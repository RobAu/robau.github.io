<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Spellguard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-screen canvas stage (castle wall left, training dummy right) with an HTML HUD and pop-up parchment panels on top.
   Single committed look: storybook night courtyard, thick ink outlines. */
:root{
  --night:#1a1340;
  --ink:#140d2e;
  --parchment:#fff4d6;
  --parchment-2:#f3e2b8;
  --gold:#ffcc3d;
  --plum:#7b4fd6;
  --muted:#6a5a8c;
  --font-display:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overscroll-behavior:none}
body{background:var(--night);color:var(--parchment);font-family:var(--font-body);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#stage{position:relative;width:100%;height:100%;overflow:hidden;touch-action:none}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}

.hud{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;
  padding-top:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.chip{font-family:var(--font-display);font-size:15px;letter-spacing:.03em;background:rgba(20,13,46,.72);border:2px solid rgba(255,244,214,.25);
  border-radius:999px;padding:6px 12px;color:var(--parchment);white-space:nowrap}
.hud-right{display:flex;gap:6px;align-items:center}
.chip b{color:var(--gold);font-weight:400;font-variant-numeric:tabular-nums}
.icon-btn{pointer-events:auto;font-family:var(--font-display);font-size:14px;background:rgba(20,13,46,.72);color:var(--parchment);
  border:2px solid rgba(255,244,214,.25);border-radius:999px;padding:6px 10px;cursor:pointer}
.icon-btn:focus-visible,.btn:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

.prompt{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:flex;align-items:center;gap:10px;background:var(--parchment);color:var(--ink);border:3px solid var(--ink);border-radius:999px;
  box-shadow:0 5px 0 var(--ink);padding:8px 18px 8px 10px;pointer-events:none;max-width:calc(100% - 32px)}
.prompt .swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);flex:none;display:grid;place-items:center;font-size:22px;line-height:1;color:var(--ink)}
.prompt .txt{display:flex;flex-direction:column;min-width:0}
.prompt .name{font-family:var(--font-display);font-size:20px;line-height:1.05}
.prompt .how{font-size:12.5px;font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(14,9,36,.62);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));touch-action:pan-y}
.panel{background:var(--parchment);color:var(--ink);border:4px solid var(--ink);border-radius:24px;box-shadow:0 8px 0 var(--ink);
  width:100%;max-width:760px;max-height:100%;overflow:auto;padding:22px;animation:pop .45s cubic-bezier(.2,1.6,.4,1) both;touch-action:pan-y}
.panel.narrow{max-width:460px;text-align:center}
@keyframes pop{from{transform:scale(.7) rotate(-2deg);opacity:0}to{transform:none;opacity:1}}
.eyebrow{font-family:var(--font-display);font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--plum)}
h1,h2{font-family:var(--font-display);font-weight:400;text-wrap:balance;margin:4px 0 8px;line-height:1}
h1{font-size:clamp(48px,13vw,84px);color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink);letter-spacing:.02em}
h2{font-size:clamp(28px,7vw,40px)}
.panel p{font-size:16px;line-height:1.45;margin:6px 0 14px;font-weight:600}
.actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.btn{font-family:var(--font-display);font-size:22px;letter-spacing:.02em;color:var(--ink);background:var(--gold);border:3px solid var(--ink);
  border-radius:999px;box-shadow:0 5px 0 var(--ink);padding:12px 28px;cursor:pointer;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.btn.ghost{background:var(--parchment-2)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:10px}
.card{cursor:pointer;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 10px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;min-width:0}
.card canvas{width:120px;height:120px;border-radius:14px;background:var(--night);border:3px solid var(--ink)}
.card .el{font-family:var(--font-display);font-size:12px;letter-spacing:.1em;text-transform:uppercase;padding:2px 10px;border-radius:999px;border:2px solid var(--ink);margin-top:4px}
.card .nm{font-family:var(--font-display);font-size:22px;line-height:1}
.card .kana,.prompt .swatch{font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic","Noto Sans JP","Noto Sans CJK JP",sans-serif;font-weight:700}
.card .sp{font-family:var(--font-display);font-size:16px;color:var(--plum)}
.credit{font-size:12px!important;color:var(--muted);margin-bottom:0!important}
.credit a{color:var(--plum)}
.card .role{font-size:14px;line-height:1.3;font-weight:800}
.card .hw{font-size:12.5px;line-height:1.3;color:var(--muted);font-weight:700}
.card .tier{font-size:11px;color:var(--muted);font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.stars{font-size:44px;letter-spacing:6px;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;line-height:1}
.stars .off{color:#d9cdb0}
.stats{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;font-weight:800;font-variant-numeric:tabular-nums}
.stats span b{font-family:var(--font-display);font-weight:400;font-size:24px;display:block}
@media (max-width:520px){
  .chip,.icon-btn{font-size:13px;padding:5px 9px}
  .hud-right{gap:4px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .card canvas{width:96px;height:96px}
  .card .nm{font-size:19px}
  .panel{padding:16px}
  .btn{font-size:20px;padding:11px 24px}
}
@media (prefers-reduced-motion:reduce){.panel{animation:none}}
</style>
</head>

  <div class="hud" id="hud" hidden>

    <div class="hud-right">
      <div class="chip">Score <b id="score">0</b></div>
      <div class="chip">Streak <b id="streak">0</b></div>
      <button class="icon-btn" id="muteBtn" type="button" aria-label="Toggle sound">Sound</button>
    </div>
  </div>
  <div class="prompt" id="prompt" hidden>
    <div class="swatch" id="pSwatch"></div>
    <div class="txt"><div class="name" id="pName">Write tsu</div><div class="how" id="pHow">1 stroke</div></div>
  </div>
  <div class="overlay" id="overlay"></div>
</div>

// $P point-cloud recognizer (Vatavu, Anthony, Wobbrock 2012): stroke order and direction don't matter,
// so it handles multi-stroke characters and kids who write strokes in their own order.
const PN = 48;
function pathLength(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }

function resampleStrokes(strokes, n) {

const ACCEPT = 0.68;

const acceptFor = id => ACCEPT - 0.02 * (SPELL[id].strokes.length - 1);

function recognize(strokes) {
  strokes = strokes.filter(st => st.length > 1);

  const c = cloudNormalize(strokes);

    this.el.src = 'data:audio/mpeg;base64,' + KANA_CLIPS['あ'];

function updateHud() {
  $('score').textContent = game.score;
  $('streak').textContent = game.streak;
  $('lessonChip').textContent = game.lessonIndex < LESSONS.length ? `Lesson ${game.lessonIndex + 1} of ${LESSONS.length}` : 'Master trial';

    const s = SPELL[game.target];
    $('pName').textContent = `Write ${s.romaji}: ${s.name}`; $('pHow').textContent = s.how; $('pSwatch').style.background = s.color; $('pSwatch').textContent = s.kana;

function spellCard(s, showTier) {
  const el = document.createElement('div'); el.className = 'card';
  const cv = document.createElement('canvas'); cv.width = 240; cv.height = 240;
  el.append(cv);
  el.insertAdjacentHTML('beforeend',
    `<span class="el" style="background:${s.color}">${s.element}</span><div class="nm"><span class="kana">${s.kana}</span> ${s.romaji}</div>` +
    `<div class="sp">${s.name}</div><div class="role">${s.role}</div><div class="hw">${s.how}</div>` + (showTier ? `<div class="tier">Lesson ${s.lesson}</div>` : ''));
  cardCanvases.push({ cv, spell: s, offset: Math.random() });
  el.title = `Tap to hear ${s.kana} (${s.romaji})`;
  el.addEventListener('click', () => { Sound.init(); Sound.say(s); });
  return el;
}

function showOverlay(html, cls = '') {
  cardCanvases = [];
  overlay.innerHTML = `<div class="panel ${cls}">${html}</div>`;
  overlay.hidden = false;
  return overlay.querySelector('.panel');
}
function hideOverlay() { overlay.hidden = true; overlay.innerHTML = ''; cardCanvases = []; }

function showTitle() {

    <p>Monsters are coming for your castle. Your spells are hiragana: write a character with your finger or mouse and its element bursts out of your staff. ひ (hi) is fire, because fire is 火, hi, in Japanese. Each lesson teaches two new characters, and they get trickier as you go.</p>
    <div class="actions"><button class="btn" id="startBtn" type="button">Start lessons</button><button class="btn ghost" id="bookBtn" type="button">Spellbook</button></div>

  p.querySelector('#startBtn').onclick = () => { Sound.init(); resetRun(); startLesson(0); };

function showBook() {
  const p = showOverlay(`<div class="eyebrow">All 16 hiragana spells, easiest first</div><h2>Spellbook</h2><div class="cards"></div>
    <div class="actions"><button class="btn" id="backBtn" type="button">Back</button></div>`);
  const cards = p.querySelector('.cards');
  SPELLS.forEach(s => cards.append(spellCard(s, true)));
  p.querySelector('#backBtn').onclick = () => { showTitle(); };
}

function resetRun() { Object.assign(game, { score: 0, streak: 0, bestStreak: 0, seen: {} }); }

function startLesson(i) {
  game.lessonIndex = i;
  game.lesson = i < LESSONS.length ? LESSONS[i] : MASTER;
  const unlocked = SPELLS.filter(s => s.lesson <= Math.min(i + 1, LESSONS.length)).map(s => s.id);
  game.queue = buildQueue(game.lesson, unlocked);
  game.firstTry = 0; game.total = game.queue.length;
  updateHud();
  if (game.lesson.newSpells.length) showIntro(game.lesson); else beginPlay();
}

function buildQueue(lesson, unlocked) {
  const q = [];
  lesson.newSpells.forEach(id => q.push(id, id));
  while (q.length < lesson.count) q.push(unlocked[Math.floor(Math.random() * unlocked.length)]);
  // shuffle, then avoid the same spell twice in a row where possible
  for (let k = q.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [q[k], q[j]] = [q[j], q[k]]; }
  for (let k = 1; k < q.length; k++) if (q[k] === q[k - 1]) { const j = q.findIndex((x, n) => n > k && x !== q[k] && q[n - 1] !== x); if (j > 0) [q[k], q[j]] = [q[j], q[k]]; }
  // the very first prompt of a lesson is a new spell, so it is practised right after the intro
  if (lesson.newSpells.length && !lesson.newSpells.includes(q[0])) { const j = q.findIndex(x => lesson.newSpells.includes(x)); [q[0], q[j]] = [q[j], q[0]]; }
  return q;
}

function showIntro(lesson) {
  game.state = 'intro'; $('hud').hidden = false; $('prompt').hidden = true;
  const p = showOverlay(`<div class="eyebrow">Lesson ${game.lessonIndex + 1} · New spells</div><h2>${lesson.title}</h2>
    <p>Watch the stroke order, then write the character anywhere on the screen. The numbered dots show where each stroke starts. Tap a card to hear how it sounds.</p><div class="cards"></div>
    <div class="actions"><button class="btn" id="goBtn" type="button">Let's cast!</button></div>`);
  const cards = p.querySelector('.cards');
  lesson.newSpells.forEach(id => cards.append(spellCard(SPELL[id], false)));
  p.querySelector('#goBtn').onclick = () => { Sound.init(); beginPlay(); };
}

function beginPlay() { hideOverlay(); game.state = 'play'; $('hud').hidden = false; $('prompt').hidden = false; nextPrompt(); }

function nextPrompt() {
  if (game.state !== 'play') return;
  if (!game.queue.length) return endLesson();
  game.target = game.queue.shift();
  ink.strokes = []; ink.timer = 0;
  game.fails = 0;
  game.showGhost = !game.seen[game.target];
  game.seen[game.target] = true;
  game.awaiting = true;
  bubble.pop = 0;
  updateHud();
}

function endLesson() {
  game.state = 'end'; game.awaiting = false; $('prompt').hidden = true;
  const acc = game.firstTry / game.total;
  const stars = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
  const last = game.lessonIndex >= LESSONS.length - 1;
  const isMaster = game.lessonIndex >= LESSONS.length;
  const blurb = isMaster ? 'Every spell, mixed up. Go again and beat your streak.'
    : last ? `You know all ${SPELLS.length} spells. Next up is the master trial: every spell, mixed.`
    : `Next lesson: ${LESSONS[game.lessonIndex + 1].title}.`;
  const p = showOverlay(`<div class="eyebrow">${isMaster ? 'Master trial' : 'Lesson ' + (game.lessonIndex + 1)} complete</div>
    <h2>${stars === 3 ? 'Spell-tacular!' : stars === 2 ? 'Well cast!' : 'Keep practising!'}</h2>
    <div class="stars">${[1, 2, 3].map(n => n <= stars ? '★' : '<span class="off">★</span>').join('')}</div>
    <div class="stats"><span><b>${game.firstTry}/${game.total}</b>first try</span><span><b>${game.score}</b>score</span><span><b>${game.bestStreak}</b>best streak</span></div>
    <p>${blurb}</p>
    <div class="actions"><button class="btn ghost" id="againBtn" type="button">Retry lesson</button><button class="btn" id="nextBtn" type="button">${isMaster ? 'Play again' : last ? 'Master trial' : 'Next lesson'}</button></div>`, 'narrow');
  p.querySelector('#againBtn').onclick = () => { startLesson(game.lessonIndex); };
  p.querySelector('#nextBtn').onclick = () => { startLesson(Math.min(game.lessonIndex + 1, LESSONS.length)); };
}

// ---------- Input ----------
function pt(e) { const r = canvas.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
canvas.addEventListener('pointerdown', e => {
  if (game.state !== 'play') return;
  e.preventDefault(); Sound.init();
  canvas.setPointerCapture?.(e.pointerId);
  ink.timer = 0;
  stroke = { id: e.pointerId, pts: [pt(e)] };
});
canvas.addEventListener('pointermove', e => {
  if (!stroke || e.pointerId !== stroke.id) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) {
    const p = pt(ev), l = stroke.pts[stroke.pts.length - 1];
    if (Math.hypot(p[0] - l[0], p[1] - l[1]) >= 2) stroke.pts.push(p);
  }
  const p = stroke.pts[stroke.pts.length - 1];
  if (Math.random() < 0.6) particles.push({ x: p[0], y: p[1], vx: (Math.random() - 0.5) * 40, vy: (Math.random() - 0.5) * 40 - 20, life: 0.5, max: 0.5, size: 2 + Math.random() * 3, color: '#ffe9a8', kind: 'spark' });
});
function endStroke(e) {
  if (!stroke || e.pointerId !== stroke.id) return;
  const pts = stroke.pts; stroke = null;
  handleStroke(pts);
}
canvas.addEventListener('pointerup', endStroke);
canvas.addEventListener('pointercancel', endStroke);
// Stop the page from scrolling, zooming or showing a context menu while drawing on phones.
['touchstart', 'touchmove', 'gesturestart'].forEach(t => $('stage').addEventListener(t, e => { if (!overlay.contains(e.target) || overlay.hidden) e.preventDefault(); }, { passive: false }));
canvas.addEventListener('contextmenu', e => e.preventDefault());

function handleStroke(pts) {
  if (pathLength(pts) < 6) return; // a tap, not a stroke
  if (!game.awaiting) { fadeStrokes.push({ pts, color: '#ffe9a8', t: 0.4, max: 0.4 }); return; }
  ink.strokes.push(pts);
  if (ink.strokes.length >= SPELL[game.target].strokes.length) judgeInk();
  else { ink.timer = INK_PAUSE; ink.wait = INK_PAUSE; }
}
function judgeInk() {
  const strokes = ink.strokes; ink.strokes = []; ink.timer = 0;
  if (!strokes.length || !game.awaiting) return;
  const all = strokes.flat(), b = bbox(all);
  if (Math.max(b.w, b.h) < 40 * Math.max(0.7, S)) { strokes.forEach(pts => fadeStrokes.push({ pts, color: '#9a8fb8', t: 0.4, max: 0.4 })); floaters.push({ text: 'Write bigger!', x: b.x0 + b.w / 2, y: b.y0 - 20, t: 1.2, color: '#ffffff' }); return; }
  const res = recognize(strokes);
  if (res && res.id === game.target && res.score >= acceptFor(res.id)) success(res, strokes);
  else fail(res && res.score >= acceptFor(res.id) ? res.id : null, strokes);
}

function success(res, strokes) {
  const pts = strokes.flat();
  const s = SPELL[res.id];
  game.awaiting = false;
  if (game.fails === 0) game.firstTry++;
  game.streak++; game.bestStreak = Math.max(game.bestStreak, game.streak);
  const quality = res.score > 0.9 ? 'Perfect!' : res.score > 0.84 ? 'Great!' : 'Nice!';
  game.score += 100 + (res.score > 0.9 ? 50 : res.score > 0.84 ? 25 : 0) + (game.streak - 1) * 10;
  strokes.forEach(st => fadeStrokes.push({ pts: st, color: s.color, t: 0.6, max: 0.6, glow: true }));
  const c = centroid(pts);
  floaters.push({ text: quality, x: c[0], y: c[1] - 20, t: 1.1, color: s.color, big: true });
  Sound.say(s);
  castSpell(s);
  updateHud();
}

function fail(otherId, strokes) {
  const pts = strokes.flat();
  game.fails++; game.streak = 0; game.showGhost = true;
  strokes.forEach(st => fadeStrokes.push({ pts: st, color: '#9a8fb8', t: 0.45, max: 0.45 }));
  const c = centroid(pts);
  floaters.push({ text: otherId ? `That's ${SPELL[otherId].kana}!` : 'Fizzle!', x: c[0], y: c[1] - 20, t: 1.2, color: '#ffffff' });
  wiz.fizzle = 1;
  for (let i = 0; i < 14; i++) particles.push({ x: wiz.tip[0], y: wiz.tip[1], vx: (Math.random() - 0.5) * 80, vy: -Math.random() * 70 - 10, life: 0.9, max: 0.9, size: 6 + Math.random() * 8, color: '#a79fc4', kind: 'smoke' });
  updateHud();
}
function centroid(p) { let x = 0, y = 0; for (const q of p) { x += q[0]; y += q[1]; } return [x / p.length, y / p.length]; }

// ---------- Spell effects ----------
function target() { return [scene.dumX, scene.dumY - 75 * S]; }
function castSpell(s) {
  wiz.cast = 1; wiz.orb = s.color;
  const [tx, ty] = target();
  if (s.fx === 'lightning') {
    setTimeout(() => { bolt = { t: 0.35, color: s.color }; impact(s); }, 120);
    return;
  }
  const from = s.fx === 'star' ? [tx - 40 * S, -20] : s.fx === 'earth' ? [tx, -30] : wiz.tip.slice();
  projectiles.push({ s, x0: from[0], y0: from[1], x: from[0], y: from[1], tx, ty, t: 0, dur: s.fx === 'earth' ? 0.55 : 0.5,
    arc: s.fx === 'earth' || s.fx === 'star' ? 0 : -90 * S, spin: 0 });
  if (s.fx === 'star') for (let k = 1; k <= 3; k++) projectiles.push({ s, x0: tx + (k - 2) * 70 * S, y0: -20 - k * 30, x: 0, y: 0, tx: tx + (k - 2) * 25 * S, ty: ty + 10 * S, t: -k * 0.08, dur: 0.5, arc: 0, spin: 0, echo: true });
}

function impact(s) {
  const [tx, ty] = target();
  shake = Math.min(14, shake + (s.fx === 'earth' || s.fx === 'lightning' ? 12 : 7));
  dummy.wob = 1; dummy.tint = s.color; dummy.tintT = 1; dummy.squash = 1;
  const n = 34;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    const p = { x: tx, y: ty, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.8, max: 0.8, size: 3 + Math.random() * 6, color: s.color, kind: 'dot', g: 300 };
    if (s.fx === 'fire') { p.vy = -Math.abs(p.vy) * 0.8; p.g = -120; p.color = Math.random() < 0.5 ? '#ffd23f' : '#ff5a1f'; }
    if (s.fx === 'water') { p.g = 700; p.vy -= 160; }
    if (s.fx === 'ice') { p.kind = 'shard'; p.g = 200; }
    if (s.fx === 'earth') { p.kind = 'rock'; p.g = 900; p.vy = -Math.abs(p.vy); p.color = Math.random() < 0.5 ? s.color : '#8a5a33'; }
    if (s.fx === 'star') { p.kind = 'star'; p.g = 120; }
    if (s.fx === 'void') { p.kind = 'swirl'; p.a = a; p.r = 10 + Math.random() * 70 * S; p.vr = -60 - Math.random() * 60; p.g = 0; }
    if (s.fx === 'wind') { p.kind = 'swirl'; p.a = a; p.r = 20 + Math.random() * 40 * S; p.vr = 90; p.g = 0; p.size = 2 + Math.random() * 3; }

// ---------- Drawing helpers ----------
function mapPts(pts, cx, cy, size) { return pts.map(([x, y]) => [cx + (x - 0.5) * size, cy + (y - 0.5) * size]); }

// Draws the character's strokes in order, traced up to `prog` (0..1 over all strokes),
// with a numbered dot where each stroke starts and a comet head on the stroke being drawn.
function drawSpellShape(c, s, cx, cy, size, prog, o = {}) {
  const strokes = s.strokes.map(st => mapPts(st, cx, cy, size));
  const lens = strokes.map(pathLength), total = lens.reduce((a, b) => a + b, 0);
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (o.guide) { c.save(); c.setLineDash([size * 0.03, size * 0.05]); c.strokeStyle = o.guideColor || 'rgba(255,255,255,.25)'; c.lineWidth = o.w * 0.6; strokes.forEach(p => { polyline(c, p); c.stroke(); }); c.restore(); }
  let left = prog * total, head = null;
  strokes.forEach((p, k) => {
    if (left <= 0) return;
    let upto = p.length;
    if (left < lens[k]) { let d = 0; upto = 1; while (upto < p.length && d + Math.hypot(p[upto][0] - p[upto - 1][0], p[upto][1] - p[upto - 1][1]) <= left) { d += Math.hypot(p[upto][0] - p[upto - 1][0], p[upto][1] - p[upto - 1][1]); upto++; } upto = Math.max(2, upto); head = p[upto - 1]; }
    left -= lens[k];
    if (o.outline) { c.strokeStyle = INK; c.lineWidth = o.w + 6; polyline(c, p, upto); c.stroke(); }
    c.save(); c.shadowColor = s.color; c.shadowBlur = o.glow ? 18 : 0;
    c.strokeStyle = s.color; c.lineWidth = o.w; polyline(c, p, upto); c.stroke(); c.restore();
  });
  if (o.numbers !== false) {
    const r = Math.max(7, o.w * 0.85 + 2);
    c.font = `${Math.round(r * 1.25)}px ${FONT_DISPLAY}`; c.textAlign = 'center'; c.textBaseline = 'middle';
    strokes.forEach((p, k) => {
      c.fillStyle = '#5dff8f'; c.strokeStyle = INK; c.lineWidth = 2.5;
      c.beginPath(); c.arc(p[0][0], p[0][1], r, 0, TAU); c.fill(); c.stroke();
      c.fillStyle = INK; c.fillText(String(k + 1), p[0][0], p[0][1] + 1);
    });

  }

    c.save(); c.shadowColor = '#fff'; c.shadowBlur = 20; c.fillStyle = '#fff';

}
const FONT_DISPLAY = '"Lilita One", "Trebuchet MS", sans-serif';
function starPath(c, x, y, r, rot = 0) {
  c.beginPath();

  c.closePath();
}

function drawWizard(t) {

function drawBubble(t) {
  if (!game.target || game.state !== 'play') return;
  const s = SPELL[game.target];
  const k = easeOutBack(Math.min(1, bubble.pop));
  const r = scene.bubbleR * k, x = scene.dumX, y = scene.bubbleY + Math.sin(t * 2) * 3;

  c.save(); c.lineWidth = 4; c.strokeStyle = INK; c.fillStyle = '#fff4d6';
  c.beginPath(); c.moveTo(x - 10, y + r - 4); c.lineTo(x, y + r + 16 * k); c.lineTo(x + 10, y + r - 4); c.closePath(); c.fill(); c.stroke();

}

function drawGhost(t) {

  ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,244,214,.75)';

function drawStroke() {
  const c = ctx;

  for (const f of fadeStrokes) {
    if (f.pts.length < 2) continue;

    c.save(); c.globalAlpha = a; c.shadowColor = f.color; c.shadowBlur = f.glow ? 24 : 0;
    c.strokeStyle = f.color; c.lineWidth = 9 + (1 - a) * 6; polyline(c, f.pts); c.stroke(); c.restore();
  }
  for (const st of ink.strokes) {
    if (st.length < 2) continue;
    c.save(); c.shadowColor = '#ffcc3d'; c.shadowBlur = 12; c.strokeStyle = '#ffcc3d'; c.lineWidth = 10; polyline(c, st); c.stroke();
    c.shadowBlur = 0; c.strokeStyle = '#fffbe8'; c.lineWidth = 4; polyline(c, st); c.stroke(); c.restore();
  }

    const l = ink.strokes[ink.strokes.length - 1], e = l[l.length - 1], k = 1 - ink.timer / ink.wait;
    c.save(); c.lineWidth = 4; c.strokeStyle = 'rgba(255,244,214,.3)'; c.beginPath(); c.arc(e[0] + 22, e[1] - 22, 10, 0, TAU); c.stroke();

    c.strokeStyle = '#ffcc3d'; c.lineWidth = 10; polyline(c, stroke.pts); c.stroke();
    c.shadowBlur = 0; c.strokeStyle = '#fffbe8'; c.lineWidth = 4; polyline(c, stroke.pts); c.stroke();
    c.restore();
  }
}

function drawProjectiles(dt) {
  const c = ctx;
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.t += dt; if (p.t < 0) continue;
    const k = Math.min(1, p.t / p.dur), e = p.s.fx === 'earth' ? k * k : k;
    p.x = p.x0 + (p.tx - p.x0) * e; p.y = p.y0 + (p.ty - p.y0) * e + p.arc * Math.sin(Math.PI * e);
    p.spin += dt * 10;
    const r = (p.s.fx === 'earth' ? 24 : 14) * S;
    if (Math.random() < 0.9) particles.push({ x: p.x, y: p.y, vx: (Math.random() - 0.5) * 30, vy: (Math.random() - 0.5) * 30, life: 0.35, max: 0.35, size: r * 0.5, color: p.s.color, kind: p.s.fx === 'star' ? 'star' : 'dot' });
    c.save(); c.lineWidth = 4; c.strokeStyle = INK; c.shadowColor = p.s.color; c.shadowBlur = 22; c.fillStyle = p.s.color;
    if (p.s.fx === 'star') { starPath(c, p.x, p.y, r * 1.3, p.spin); c.fill(); c.shadowBlur = 0; c.stroke(); }
    else if (p.s.fx === 'earth') { c.beginPath(); for (let j = 0; j < 7; j++) { const a = p.spin * 0.3 + j * TAU / 7, rr = r * (0.8 + 0.2 * ((j * 37) % 5) / 5); c.lineTo(p.x + Math.cos(a) * rr, p.y + Math.sin(a) * rr); } c.closePath(); c.fill(); c.shadowBlur = 0; c.stroke(); }
    else if (p.s.fx === 'wind') { c.shadowBlur = 0; c.strokeStyle = p.s.color; c.lineWidth = 5 * S; for (let j = 0; j < 3; j++) { c.beginPath(); c.arc(p.x, p.y, r * (0.6 + j * 0.45), p.spin + j, p.spin + j + 2.2); c.stroke(); } }
    else { c.beginPath(); c.arc(p.x, p.y, r, 0, TAU); c.fill(); c.shadowBlur = 0; c.stroke(); c.fillStyle = 'rgba(255,255,255,.75)'; c.beginPath(); c.arc(p.x - r * 0.3, p.y - r * 0.3, r * 0.3, 0, TAU); c.fill(); }
    c.restore();
    if (k >= 1) { projectiles.splice(i, 1); if (!p.echo) impact(p.s); }
  }

    bolt.t -= dt;
    const [tx, ty] = target(), [sx, sy] = wiz.tip;
    const pts = [[tx, -10]];
    const seg = 9;
    for (let i = 1; i < seg; i++) { const k = i / seg; pts.push([tx + (Math.random() - 0.5) * 70 * S, -10 + (ty + 10) * k]); }
    pts.push([tx, ty]);
    c.save(); c.lineJoin = 'miter'; c.globalAlpha = Math.max(0, bolt.t / 0.35);
    c.strokeStyle = INK; c.lineWidth = 14 * S; polyline(c, pts); c.stroke();
    c.shadowColor = bolt.color; c.shadowBlur = 30; c.strokeStyle = bolt.color; c.lineWidth = 8 * S; polyline(c, pts); c.stroke();
    c.strokeStyle = '#fff'; c.lineWidth = 3 * S; polyline(c, pts); c.stroke();
    c.beginPath(); c.moveTo(sx, sy); c.lineTo((sx + tx) / 2, sy - 30 * S); c.stroke();
    c.restore();
    if (bolt.t <= 0) bolt = null;
  }
}

function drawParticles(dt) {
  const c = ctx;
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.life -= dt; if (p.life <= 0) { particles.splice(i, 1); continue; }
    const a = p.life / p.max;
    if (p.kind === 'swirl') { p.a += dt * (p.vr / 30); p.r = Math.max(0, p.r + (p.vr < 0 ? -40 : 40) * dt); }
    else if (p.kind !== 'ring') { p.vy += (p.g || 0) * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.98; }
    c.save(); c.globalAlpha = a; c.fillStyle = p.color; c.strokeStyle = INK;
    switch (p.kind) {
      case 'ring': c.globalAlpha = a * 0.8; c.strokeStyle = p.color; c.lineWidth = 8 * a; c.beginPath(); c.arc(p.x, p.y, p.size * (1.2 - a), 0, TAU); c.stroke(); break;
      case 'smoke': c.globalAlpha = a * 0.7; c.beginPath(); c.arc(p.x, p.y, p.size * (1.6 - a), 0, TAU); c.fill(); break;
      case 'shard': c.translate(p.x, p.y); c.rotate(p.vx * 0.01); c.beginPath(); c.moveTo(0, -p.size * 1.6); c.lineTo(p.size * 0.6, 0); c.lineTo(0, p.size * 1.6); c.lineTo(-p.size * 0.6, 0); c.closePath(); c.fill(); c.lineWidth = 1.5; c.stroke(); break;
      case 'rock': c.beginPath(); c.rect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size); c.fill(); c.lineWidth = 2; c.stroke(); break;
      case 'star': starPath(c, p.x, p.y, p.size, p.life * 6); c.fill(); break;
      case 'swirl': { const [tx, ty] = target(); c.beginPath(); c.arc(tx + Math.cos(p.a) * p.r, ty + Math.sin(p.a) * p.r, p.size, 0, TAU); c.fill(); break; }
      default: c.beginPath(); c.arc(p.x, p.y, p.size * (0.4 + 0.6 * a), 0, TAU); c.fill();
    }
    c.restore();
  }
}

function drawFloaters(dt) {
  const c = ctx, fam = getComputedStyle(document.documentElement).getPropertyValue('--font-display');
  for (let i = floaters.length - 1; i >= 0; i--) {
    const f = floaters[i];
    f.t -= dt; if (f.t <= 0) { floaters.splice(i, 1); continue; }
    f.y -= 40 * dt;
    const size = (f.big ? 38 : 28) * Math.max(0.75, S);
    c.save(); c.globalAlpha = Math.min(1, f.t * 2); c.font = `${size}px ${fam}`; c.textAlign = 'center';
    const x = Math.max(size * 3, Math.min(W - size * 3, f.x));
    c.lineWidth = 7; c.strokeStyle = INK; c.lineJoin = 'round'; c.strokeText(f.text, x, f.y);
    c.fillStyle = f.color; c.fillText(f.text, x, f.y); c.restore();

function drawCards(t) {
  for (const cc of cardCanvases) {
    const c = cc.cv.getContext('2d'), w = cc.cv.width;
    c.setTransform(1, 0, 0, 1, 0, 0);
    c.fillStyle = '#1a1340'; c.fillRect(0, 0, w, w);
    const dur = 0.7 + 0.6 * cc.spell.strokes.length, ph = (t + cc.offset * dur) % (dur + 0.6), prog = Math.min(1, ph / dur);
    drawSpellShape(c, cc.spell, w / 2, w / 2, w * 0.92, prog, { w: 11, guide: true, guideColor: 'rgba(255,244,214,.3)', comet: true, glow: true });
    if (ph > dur) { // a little sparkle burst when the character is complete
      const k = (ph - dur) / 0.6;
      c.save(); c.globalAlpha = 1 - k; c.fillStyle = cc.spell.color;
      for (let i = 0; i < 8; i++) { const a = i * TAU / 8; starPath(c, w / 2 + Math.cos(a) * w * 0.38 * (0.6 + k), w / 2 + Math.sin(a) * w * 0.38 * (0.6 + k), 7, k * 3); c.fill(); }
      c.restore();
    }
  }
}

const easeOutBack = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; time += dt;
  wiz.cast = Math.max(0, wiz.cast - dt * 2.2);
  wiz.fizzle = Math.max(0, wiz.fizzle - dt * 2);
  dummy.wob = Math.max(0, dummy.wob - dt * 1.8);
  dummy.tintT = Math.max(0, dummy.tintT - dt * 1.4);
  dummy.squash = Math.max(0, dummy.squash - dt * 3);
  bubble.pop = Math.min(1, bubble.pop + dt * 3);
  shake = Math.max(0, shake - dt * 40);
  if (ink.timer > 0 && !stroke) { ink.timer -= dt; if (ink.timer <= 0) judgeInk(); }
  for (let i = fadeStrokes.length - 1; i >= 0; i--) { fadeStrokes[i].t -= dt; if (fadeStrokes[i].t <= 0) fadeStrokes.splice(i, 1); }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.save();
  if (shake > 0 && !reduceMotion) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  ctx.drawImage(bgCanvas, 0, 0, W, H);
  ctx.fillStyle = '#fff6dd';
  for (const s of starsBg) { ctx.globalAlpha = 0.45 + 0.55 * Math.sin(time * 2 + s.p) ** 2; ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill(); }
  ctx.globalAlpha = 1;
  drawDummy(time);
  drawWizard(time);
  drawBubble(time);
  drawGhost(time);
  drawProjectiles(dt);
  drawParticles(dt);
  ctx.restore();
  drawStroke();
  drawFloaters(dt);
  if (cardCanvases.length) drawCards(time);
  requestAnimationFrame(frame);
}

$('muteBtn').onclick = () => { Sound.init(); Sound.muted = !Sound.muted; if (Sound.muted && Sound.el) Sound.el.pause(); $('muteBtn').textContent = Sound.muted ? 'Muted' : 'Sound'; };
window.addEventListener('resize', resize);
resize();
showTitle();
requestAnimationFrame(frame);
</script>
