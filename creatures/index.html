<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Creatures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: full-bleed living canvas; a glass HUD on top, a thumb-reach control bar at the bottom, and a pull-up sheet for details. Single dark-glass look that sits over the world's own day/night. */
:root {
  color-scheme: dark;
  --glass: rgba(18, 26, 20, 0.80);
  --glass-strong: rgba(14, 20, 16, 0.94);
  --line: rgba(220, 235, 200, 0.14);
  --ink: #eef2e4;
  --muted: #a8b59c;
  --sun: #f4c34f;
  --leaf: #8fd67a;
  --danger: #ef7a6c;
  --A: #79d38f; --C: #62a8f0; --G: #f4c34f; --T: #ee7468;
  --display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: #1d2a1c; color: var(--ink); font-family: var(--body); overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#world { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

.hud { position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
  padding-top: calc(env(safe-area-inset-top, 0px) + 10px);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.pill { pointer-events: auto; background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.brand { display: flex; align-items: center; gap: 10px; }
.brand h1 { margin: 0; font-family: var(--display); font-weight: 700; font-size: 17px; letter-spacing: 0.01em; line-height: 1; }
.brand .when { font-size: 12px; color: var(--muted); margin-top: 3px; font-variant-numeric: tabular-nums; }
#dial { width: 30px; height: 30px; flex: none; }
.counts { display: grid; grid-template-columns: auto auto; column-gap: 8px; row-gap: 1px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
.counts b { color: var(--ink); font-weight: 700; font-size: 13px; }

.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6;
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 10px);
  padding-left: max(10px, env(safe-area-inset-left, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none; }
.bar-inner { pointer-events: auto; display: flex; align-items: center; gap: 6px; background: var(--glass); border: 1px solid var(--line); border-radius: 20px; padding: 6px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); max-width: 100%; }
.btn { appearance: none; border: 0; background: transparent; color: var(--ink); font: 700 13px var(--body); min-width: 46px; height: 46px; padding: 0 10px; border-radius: 14px; display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer; }
.btn svg { width: 22px; height: 22px; }
.btn small { font-size: 10px; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }
.btn:active { background: rgba(255,255,255,0.08); }
.btn:focus-visible { outline: 2px solid var(--sun); outline-offset: 1px; }
.btn.on { background: rgba(244, 195, 79, 0.16); }
.btn.on small, .btn.on svg { color: var(--sun); }
.sep { width: 1px; height: 30px; background: var(--line); }
#speed { font-family: var(--mono); font-size: 15px; min-width: 50px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 82px); z-index: 7; background: var(--glass-strong); border: 1px solid var(--line); padding: 8px 14px; border-radius: 12px; font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .25s; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; max-height: 62%; display: flex; flex-direction: column;
  background: var(--glass-strong); border-top: 1px solid var(--line); border-radius: 22px 22px 0 0; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1); }
.sheet.open { transform: none; }
@media (min-width: 720px) { .sheet { left: auto; right: 16px; bottom: 16px; width: 400px; max-height: calc(100% - 120px); border-radius: 22px; border: 1px solid var(--line); } }
.sheet-head { display: flex; align-items: center; gap: 12px; padding: 14px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); }
.sheet-head h2 { margin: 0; font-family: var(--display); font-size: 22px; font-weight: 700; line-height: 1.05; text-wrap: balance; }
.sheet-head .sub { color: var(--muted); font-size: 13px; margin-top: 3px; }
.sheet-head .grow { flex: 1; min-width: 0; }
.close { flex: none; }
.sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 20px) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 16px; }
.sec h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
#swatch { width: 52px; height: 52px; flex: none; }

.meters { display: grid; grid-template-columns: 96px 1fr 44px; gap: 6px 10px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.meter { height: 8px; border-radius: 4px; background: rgba(255,255,255,0.08); overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 4px; }
.meters .v { text-align: right; color: var(--muted); }
.state { font-size: 14px; }
.state b { color: var(--sun); }
.kin { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; border: 1px solid var(--line); background: rgba(255,255,255,0.05); color: var(--ink); font: 700 13px var(--body); padding: 6px 10px; border-radius: 10px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; }
.chip[disabled] { opacity: 0.55; cursor: default; }

.dna { display: grid; grid-template-columns: 112px auto 1fr 14px; gap: 5px 10px; align-items: center; font-size: 12.5px; }
.dna .gl { color: var(--muted); }
.bases { font-family: var(--mono); font-weight: 600; font-size: 14px; letter-spacing: 0.06em; display: flex; gap: 1px; }
.bases span { width: 13px; text-align: center; border-radius: 3px; }
.bases .mut { outline: 1.5px solid var(--ink); outline-offset: -1px; }
.bA { color: var(--A); } .bC { color: var(--C); } .bG { color: var(--G); } .bT { color: var(--T); }
.tbar { height: 6px; border-radius: 3px; background: rgba(255,255,255,0.08); position: relative; }
.tbar i { position: absolute; top: -3px; width: 4px; height: 12px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.org { width: 10px; height: 10px; border-radius: 50%; }
.legend { font-size: 12px; color: var(--muted); line-height: 1.5; margin-top: 8px; }
.legend .k { font-family: var(--mono); font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 8px; }
.stat { background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 11px; color: var(--muted); }
canvas.chart { width: 100%; display: block; border-radius: 10px; background: rgba(255,255,255,0.03); }
.log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.log li { display: flex; gap: 8px; }
.log .d { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; width: 52px; }
.docs { display: flex; flex-direction: column; gap: 8px; font-size: 13px; line-height: 1.4; }
.docs div { display: flex; flex-direction: column; }
.docs .plus { color: var(--leaf); } .docs .minus { color: var(--muted); }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg .chip.on { border-color: var(--sun); color: var(--sun); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.chip.warn { border-color: var(--danger); color: var(--danger); }
.help { font-size: 13px; color: var(--muted); line-height: 1.5; margin: 0; max-width: 60ch; }

.over { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); background: rgba(5, 10, 6, 0.55); }
.card { background: var(--glass-strong); border: 1px solid var(--line); border-radius: 20px; padding: 20px; max-width: 340px; display: flex; flex-direction: column; gap: 12px; }
.card h2 { margin: 0; font-family: var(--display); font-size: 24px; }
.card p { margin: 0; color: var(--muted); line-height: 1.5; font-size: 14px; }
@media (prefers-reduced-motion: reduce) { .sheet, .toast { transition: none; } }
</style>
</head>
<body>
<canvas id="world" aria-label="The creatures' world"></canvas>

<div class="hud">
  <div class="pill brand">
    <canvas id="dial" width="60" height="60" aria-hidden="true"></canvas>
    <div><h1>Creatures</h1><div class="when" id="when">Day 1 · Spring</div></div>
  </div>
  <button class="pill counts" id="countsBtn" aria-label="Open world stats" style="font: inherit; color: inherit; cursor: pointer;">
    <span>alive</span><b id="cPop">0</b>
    <span>species</span><b id="cSp">0</b>
    <span>generation</span><b id="cGen">0</b>
  </button>
</div>

<div class="bar">
  <div class="bar-inner" role="toolbar" aria-label="Controls">
    <button class="btn" id="play" aria-label="Pause"><svg viewBox="0 0 24 24" fill="currentColor" id="playIcon"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg></button>
    <button class="btn" id="speed" aria-label="Change speed">1×</button>
    <div class="sep"></div>
    <button class="btn on" data-tool="look" aria-label="Look tool: tap a creature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/></svg><small>LOOK</small></button>
    <button class="btn" data-tool="feed" aria-label="Feed tool: tap to grow grass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 21V11"/><path d="M12 13c-4 0-6-3-6-7 4 0 6 3 6 7z"/><path d="M12 15c4 0 6-3 6-7-4 0-6 3-6 7z"/></svg><small>GRASS</small></button>
    <button class="btn" data-tool="tree" aria-label="Plant tool: tap to sow a seed"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="9" r="6"/><path d="M12 15v6"/><circle cx="10" cy="8" r="1" fill="currentColor"/><circle cx="14.5" cy="10.5" r="1" fill="currentColor"/></svg><small>PLANT</small></button>
    <button class="btn" data-tool="water" aria-label="Water tool: tap to dig a pond"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3c3 4 6 7.5 6 11a6 6 0 0 1-12 0c0-3.5 3-7 6-11z"/></svg><small>POND</small></button>
    <div class="sep"></div>
    <button class="btn" id="statsBtn" aria-label="World stats"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg><small>WORLD</small></button>
  </div>
</div>

<div class="toast" id="toast"></div>

<section class="sheet" id="sheet" aria-live="polite">
  <div class="sheet-head">
    <canvas id="swatch" width="104" height="104" aria-hidden="true"></canvas>
    <div class="grow"><h2 id="shTitle">—</h2><div class="sub" id="shSub"></div></div>
    <button class="btn close" id="shClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <div class="sheet-body" id="shBody"></div>
</section>

<div class="over" id="over" hidden>
  <div class="card">
    <h2 id="overTitle">The world fell silent</h2>
    <p id="overText"></p>
    <div class="row">
      <button class="chip" id="overSeed">Release 24 newcomers</button>
      <button class="chip" id="overNew">Start a new world</button>
    </div>
  </div>
</div>

<script>
(() => {
"use strict";
const $ = id => document.getElementById(id);
// ---------- constants ----------
const TILE = 20, GW = 80, GH = 80, WW = GW * TILE, WH = GH * TILE;
const DAY = 60, YEAR = DAY * 8, STEP = 1 / 20, CAP = 400;
const BASES = "ACGT", GENE_LEN = 6;
const GENES = [
  { k: "size",      label: "Body size",      lo: "small",   hi: "large" },
  { k: "speed",     label: "Speed",          lo: "slow",    hi: "fast" },
  { k: "sight",     label: "Eyesight",       lo: "short",   hi: "far" },
  { k: "hue",       label: "Colour",         lo: "",        hi: "" },
  { k: "diet",      label: "Diet",           lo: "grass",   hi: "fruit" },
  { k: "heat",      label: "Heat tolerance", lo: "wilts",   hi: "hardy" },
  { k: "night",     label: "Night vision",   lo: "day",     hi: "night" },
  { k: "fertility", label: "Breeding",       lo: "cautious",hi: "eager" },
  { k: "lifespan",  label: "Lifespan",       lo: "brief",   hi: "long" },
  { k: "social",    label: "Herding",        lo: "loner",   hi: "herd" },
  { k: "legs",      label: "Legs",           lo: "2",       hi: "8" },
  { k: "shape",     label: "Body shape",     lo: "round",   hi: "long" },
  { k: "armor",     label: "Armour",         lo: "soft",    hi: "plated" },
  { k: "fur",       label: "Fur",            lo: "bare",    hi: "shaggy" },
  { k: "jaws",      label: "Jaws",           lo: "grazer",  hi: "hunter" },
  { k: "camo",      label: "Stripes",        lo: "plain",   hi: "camouflage" },
  { k: "litter",    label: "Litter",         lo: "1",       hi: "3" },
  { k: "gut",       label: "Tough gut",      lo: "delicate",hi: "iron" },
  { k: "hump",      label: "Water hump",     lo: "none",    hi: "big" },
];
// what each gene buys and what it costs (shown in the World sheet)
const GENE_DOCS = {
  size: ["Holds more energy and water, eats faster, harder to kill, keeps warm", "Higher upkeep, grows up slower"],
  speed: ["Reaches food and water first, outruns hunters", "Moving costs a lot more energy"],
  sight: ["Spots food, water, mates and prey from further away", "Upkeep for the eyes"],
  hue: ["Just colour. Handy for following families", "Nothing"],
  diet: ["Low digests grass fast, high gets far more from fruit", "Each end is poor at the other food. Grass is bulky, low in energy and slow to digest"],
  heat: ["Loses less water in hot sun", "Small upkeep"],
  night: ["Sees well in the dark", "Upkeep for the eyes"],
  fertility: ["Breeds sooner and more often", "Babies start with less energy"],
  lifespan: ["Lives longer", "Every cost is a bit higher"],
  social: ["Stays near its own kind", "Crowds compete for the same grass"],
  legs: ["More legs run faster and turn sharper", "Each leg adds upkeep"],
  shape: ["A long body is faster", "Loses more water than a round one"],
  armor: ["Plates block bites, spikes hurt attackers", "Heavy: slower, and costs energy to carry"],
  fur: ["Saves energy on cold nights and in winter", "Loses water in hot sun"],
  jaws: ["Above 60% it hunts other species for meat", "Worse at digesting plants, upkeep for the jaws"],
  camo: ["Hunters spot it from much closer", "Mates have a harder time spotting it too"],
  litter: ["Two or three babies at once", "Each baby starts weaker, and the parents rest longer after"],
  gut: ["Shrugs off poisonous fruit", "Upkeep for the gut"],
  hump: ["Stores extra water for long trips away from ponds", "Heavy, so slower, plus a little upkeep"],
};
const DNA_LEN = GENES.length * GENE_LEN;
const GRASS_ENERGY = 36, GRASS_BULK = 6; // energy and stomach space per full patch of grass
const SPECIES_SPLIT = 26, MATE_LIMIT = 32;
const SEASONS = ["Spring", "Summer", "Autumn", "Winter"];

// ---------- helpers ----------
const rnd = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(str) { let h = 2166136261; for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619); return h >>> 0; }
function randDNA() { let s = ""; for (let i = 0; i < DNA_LEN; i++) s += BASES[(rnd() * 4) | 0]; return s; }
function hamming(a, b) { let d = 0; for (let i = 0; i < a.length; i++) if (a.charCodeAt(i) !== b.charCodeAt(i)) d++; return d; }
// most genes read as "how many high bases"; colour genes read the bases as a number
function decodeWith(dna, genes, posKey) {
  const g = {};
  genes.forEach((G, gi) => {
    const o = gi * GENE_LEN;
    if (G.k === posKey) { let v = 0; for (let j = 0; j < GENE_LEN; j++) v = v * 4 + BASES.indexOf(dna[o + j]); g[G.k] = v / 4096; }
    else { let s = 0; for (let j = 0; j < GENE_LEN; j++) s += BASES.indexOf(dna[o + j]); g[G.k] = s / (3 * GENE_LEN); }
  });
  return g;
}
const decode = dna => decodeWith(dna, GENES, "hue");
const CONS = "bdfgklmnprstvz", VOW = "aeiou", ENDS = ["", "", "n", "r", "s", "x", "l"];
function nameOf(dna, salt) {
  let h = hash(dna + ":" + salt), s = "";
  const n = 2 + (h & 1);
  for (let i = 0; i < n; i++) { h = Math.imul(h ^ (h >>> 13), 2654435761) >>> 0; s += CONS[h % 14] + VOW[(h >>> 8) % 5]; }
  s += ENDS[(h >>> 16) % ENDS.length];
  return s[0].toUpperCase() + s.slice(1);
}

// ---------- terrain ----------
let water, moist, shore;
function makeNoise(seed) {
  const r = mulberry32(seed), g = new Float32Array(256 * 256);
  for (let i = 0; i < g.length; i++) g[i] = r();
  const at = (x, y) => g[(x & 255) + (y & 255) * 256];
  return (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const a = at(xi, yi), b = at(xi + 1, yi), c = at(xi, yi + 1), d = at(xi + 1, yi + 1);
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function genTerrain(seed, ponds) {
  const n = makeNoise(seed);
  const vals = new Float32Array(GW * GH);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const ex = Math.min(x, GW - 1 - x, y, GH - 1 - y);
    vals[y * GW + x] = n(x / 14, y / 14) * 0.62 + n(x / 6 + 40, y / 6) * 0.28 + n(x / 3, y / 3 + 90) * 0.1 - (ex < 3 ? 0.4 : 0);
  }
  const sorted = Array.from(vals).sort((a, b) => a - b);
  const thr = sorted[Math.floor(sorted.length * 0.84)];
  water = new Uint8Array(GW * GH);
  for (let i = 0; i < vals.length; i++) water[i] = vals[i] > thr ? 1 : 0;
  (ponds || []).forEach(i => water[i] = 1);
  recomputeWater();
}
function recomputeWater() {
  shore = new Uint8Array(GW * GH); moist = new Float32Array(GW * GH);
  const dist = new Int16Array(GW * GH).fill(-1), q = [];
  for (let i = 0; i < water.length; i++) if (water[i]) { dist[i] = 0; q.push(i); }
  for (let h = 0; h < q.length; h++) {
    const i = q[h], x = i % GW, y = (i / GW) | 0;
    const nb = [x > 0 ? i - 1 : -1, x < GW - 1 ? i + 1 : -1, y > 0 ? i - GW : -1, y < GH - 1 ? i + GW : -1];
    for (const j of nb) if (j >= 0 && dist[j] < 0) { dist[j] = dist[i] + 1; q.push(j); }
  }
  for (let i = 0; i < water.length; i++) {
    const d = dist[i] < 0 ? 99 : dist[i];
    moist[i] = water[i] ? 1 : Math.exp(-d / 7);
    if (d === 1) shore[i] = 1;
  }
}

const ptrs = new Map(); let drag = null, pinch = null;

let last = performance.now(), acc = 0;

  if (c) { cam.x = c.x; cam.y = c.y; } else { cam.x = WW / 2; cam.y = WH / 2; }
  follow = false;
}
window.addEventListener("resize", resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
window.addEventListener("pagehide", save);

window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
