<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Little Guildhall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: a walnut game table seen from above. Parchment tiles for patrons and workshops, painted scenes on every card, a ledger panel for your stores, a fixed action bar. Single deliberate look in both themes. */
:root{
  --table:#2b1d13; --on-table:#f3e6cc; --on-table-muted:#c8b18c;
  --parch:#f5ebd5; --parch-2:#eadbbb; --ink:#2b2118; --ink-muted:#7a6650; --rule:#cdb68c;
  --gold:#d9a842; --gold-deep:#9c6f17; --gold-ink:#2a1a06;
  --timber:#4f8a43; --clay:#b9542c; --ore:#46709f; --wool:#c3951f;
  --ok:#5fbf63; --warn:#b8401c;
  --display:"IM Fell English SC","IM Fell English",Georgia,serif;
  --serif:"IM Fell English",Georgia,serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--table);color:var(--on-table);font-family:var(--body);font-size:14px;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;font-variant-numeric:tabular-nums;background-attachment:fixed;background-size:cover}
.app{max-width:480px;margin:0 auto;padding:10px 12px calc(86px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:10px;box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
svg.i{width:1em;height:1em;display:inline-block;vertical-align:middle;overflow:visible}

header{display:flex;align-items:center;gap:10px}
.crest{width:38px;height:44px;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.5))}
h1{font-family:var(--display);font-weight:400;font-size:24px;line-height:1;margin:0;flex:1;min-width:0;text-shadow:0 2px 0 rgba(0,0,0,.4)}
h1 small{display:block;font-family:var(--serif);font-style:italic;font-size:13px;color:var(--on-table-muted);margin-top:3px}
.stats{display:flex;gap:12px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--on-table-muted)}
.stats b{display:block;color:var(--on-table);font-size:20px;font-family:var(--display);font-weight:400;text-align:right;letter-spacing:0;text-transform:none}
.stats .score b{color:var(--gold)}
.label{font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--on-table-muted);font-weight:600}
.turnbar{height:5px;background:rgba(0,0,0,.35);border-radius:3px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
.turnbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-deep),var(--gold));transition:width .3s}

.patrons{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.patron{background:var(--parch);color:var(--ink);border-radius:8px;padding:5px;display:flex;align-items:center;gap:5px;min-width:0;box-shadow:0 2px 0 rgba(0,0,0,.35),inset 0 0 0 1px var(--rule);position:relative}
.patron .face{width:36px;height:36px;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--gold),0 0 0 3px var(--gold-deep);overflow:hidden}
.patron .face svg{width:100%;height:100%;display:block}
.patron .req{display:flex;flex-direction:column;gap:1px;font-weight:800;font-size:12px;min-width:0}
.patron .req span{display:flex;align-items:center;gap:3px}
.patron .req span.met{color:var(--timber)}
.patron .req svg{width:15px;height:15px}
.patron .pv{position:absolute;top:-6px;right:-5px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f3d27a,var(--gold) 45%,var(--gold-deep));color:var(--gold-ink);font-family:var(--display);font-size:13px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.5)}
.patron.done{filter:grayscale(.85);opacity:.55}
.patron.done .pv{background:#8e2a22;color:#f5d9b0}

.market{display:flex;flex-direction:column;gap:7px}
.row{display:grid;grid-template-columns:16px repeat(4,1fr);gap:6px;align-items:stretch}
.tier{font-family:var(--display);color:var(--on-table-muted);font-size:14px;display:grid;place-items:center}
.card{position:relative;background:var(--parch);color:var(--ink);border-radius:8px;display:flex;flex-direction:column;overflow:hidden;text-align:left;box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 0 1px rgba(0,0,0,.3);transition:transform .12s,box-shadow .12s;min-width:0}
.card.t2{box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 0 2px #b9b4a6}
.card.t3{box-shadow:0 3px 0 rgba(0,0,0,.4),0 0 0 2px var(--gold)}
.art{position:relative;aspect-ratio:100/64;max-width:100%}
.art>svg{width:100%;height:100%;display:block}
.art .name{position:absolute;left:0;right:0;bottom:0;padding:2px 4px 1px;font-family:var(--display);font-size:11.5px;line-height:1.15;color:#fbf1dc;background:linear-gradient(transparent,rgba(25,15,8,.78) 40%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.coin{position:absolute;left:3px;top:3px;width:21px;height:21px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#f7dc8c,var(--gold) 45%,var(--gold-deep));color:var(--gold-ink);font-family:var(--display);font-size:14px;display:grid;place-items:center;box-shadow:0 1px 2px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.35)}
.medal{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:var(--parch);box-shadow:0 0 0 2px var(--c),0 1px 3px rgba(0,0,0,.5);display:grid;place-items:center}
.medal svg{width:17px;height:17px}
.cost{display:flex;flex-wrap:wrap;gap:1px 6px;padding:4px 5px 5px;align-content:flex-start;min-height:34px;background:linear-gradient(var(--parch),var(--parch-2))}
.pip{display:inline-flex;align-items:center;gap:2px;font-size:12.5px;font-weight:800}
.pip svg{width:15px;height:15px}
.pip s{opacity:.45;font-weight:600;font-size:10px}
.pip.short{color:var(--warn)}
.card.can::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 3px var(--ok);pointer-events:none}
.card.sel{transform:translateY(-4px) scale(1.03);z-index:1}
.card.sel::after{content:"";position:absolute;inset:0;border-radius:8px;box-shadow:inset 0 0 0 3px var(--gold),0 0 18px rgba(217,168,66,.6);pointer-events:none}
.card.fresh{animation:deal .5s cubic-bezier(.2,.8,.3,1.2)}
@keyframes deal{from{transform:translateY(-14px) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}

.ledger{background:var(--parch);color:var(--ink);border-radius:12px;padding:9px 10px 10px;display:flex;flex-direction:column;gap:8px;box-shadow:0 3px 0 rgba(0,0,0,.4),inset 0 0 0 1px var(--rule),inset 0 0 30px rgba(150,110,50,.18)}
.ledger .top{display:flex;justify-content:space-between;align-items:baseline}
.ledger .label{color:var(--ink-muted)}
.ledger .top .t{font-family:var(--display);font-size:16px;color:var(--ink)}
.res{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.col{display:flex;flex-direction:column;align-items:center;gap:3px}
.chip{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#fffaf0,#efe1c2 70%);box-shadow:0 0 0 5px var(--c),0 0 0 6px rgba(0,0,0,.35),0 4px 6px rgba(0,0,0,.35),inset 0 -3px 6px rgba(120,90,40,.25);transition:transform .1s;margin:6px 0 2px}
.chip:active{transform:scale(.93)}
.chip>svg{width:40px;height:40px}
.chip .count{position:absolute;right:-9px;bottom:-7px;min-width:24px;height:24px;border-radius:12px;background:var(--ink);color:var(--parch);font-weight:800;font-size:14px;display:grid;place-items:center;padding:0 5px;box-sizing:border-box;box-shadow:0 1px 2px rgba(0,0,0,.4)}
.chip .badge{position:absolute;left:-9px;top:-8px;min-width:24px;height:24px;border-radius:12px;background:radial-gradient(circle at 35% 30%,#f7dc8c,var(--gold) 50%,var(--gold-deep));color:var(--gold-ink);font-size:13px;font-weight:800;display:grid;place-items:center;padding:0 4px;box-sizing:border-box;box-shadow:0 1px 3px rgba(0,0,0,.5);animation:bump .25s}
@keyframes bump{from{transform:scale(.4)}to{transform:none}}
.col .nm{font-family:var(--display);font-size:13px;margin-top:4px}
.col .ws{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-muted)}
.col .ws b{color:var(--ink);font-size:14px}
.col .ws svg{width:15px;height:15px}
.links{font-size:12px;color:var(--on-table-muted);text-align:center}
.links button{text-decoration:underline;text-underline-offset:3px}

.bar{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(#3a271a,#24170e);border-top:2px solid var(--gold-deep);padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 16px rgba(0,0,0,.4)}
.bar .in{max-width:456px;margin:0 auto;display:flex;gap:8px;align-items:center}
.bar .msg{flex:1;min-width:0;font-size:13px;line-height:1.35}
.bar .msg .sub{color:var(--on-table-muted)}
.bar .msg svg{width:14px;height:14px}
.btn{background:linear-gradient(#e9bd5a,var(--gold) 50%,var(--gold-deep));color:var(--gold-ink);font-weight:800;border-radius:10px;padding:12px 16px;font-size:15px;white-space:nowrap;box-shadow:0 2px 0 #5e420c,inset 0 1px 0 rgba(255,255,255,.5)}
.btn[disabled]{filter:grayscale(.8);opacity:.4;cursor:default}
.btn.ghost{background:none;color:var(--on-table-muted);border:1px solid #5c4430;box-shadow:none;padding:11px 12px}
.sheet .btn.ghost{color:var(--ink-muted);border-color:var(--rule)}

.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:var(--parch);color:var(--ink);padding:8px 14px;border-radius:20px;font-weight:600;font-size:13px;transition:.25s;pointer-events:none;z-index:5;max-width:86vw;text-align:center;box-shadow:0 0 0 2px var(--gold),0 6px 16px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.sheet{position:fixed;inset:0;background:rgba(12,7,3,.7);display:grid;place-items:center;padding:16px;z-index:10}
.sheet .box{background:var(--parch);color:var(--ink);border-radius:14px;padding:22px 20px;max-width:360px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;box-shadow:0 0 0 3px var(--gold),0 0 0 4px var(--gold-deep),0 20px 40px rgba(0,0,0,.6),inset 0 0 40px rgba(150,110,50,.22);max-height:90vh;overflow:auto}
.sheet h2{font-family:var(--display);font-weight:400;font-size:28px;margin:0;line-height:1.05;text-wrap:balance}
.sheet p{margin:0;line-height:1.5;color:var(--ink-muted)}
.sheet ul{margin:0;padding-left:18px;line-height:1.55}
.sheet .label{color:var(--ink-muted)}
.sheet .hero{width:100%;aspect-ratio:100/48;border-radius:8px;overflow:hidden;box-shadow:inset 0 0 0 1px var(--rule)}
.sheet .hero svg{width:100%;height:100%;display:block}
.big{font-family:var(--display);font-size:60px;line-height:1;color:var(--gold-deep)}
.sheet .btns{display:flex;gap:8px;justify-content:flex-end}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<div class="app" id="app">
  <header>
    <svg class="crest" viewBox="0 0 38 44"><use href="#crest"/></svg>
    <h1>Little Guildhall<small>A season of building</small></h1>
    <div class="stats">
      <div>Turn<b id="turn">1/24</b></div>
      <div class="score">Prestige<b id="score">0</b></div>
      <div>Best<b id="best">–</b></div>
    </div>
  </header>
  <div class="turnbar"><i id="tb" style="width:0"></i></div>
  <div>
    <div class="label" style="margin-bottom:6px">Patrons visit when your workshops match</div>
    <div class="patrons" id="patrons"></div>
  </div>
  <div class="market" id="market"></div>
  <div class="ledger">
    <div class="top"><span class="t">Your stores</span><span class="label" id="cap">0/10 goods</span></div>
    <div class="res" id="res"></div>
  </div>
  <div class="links"><button id="help">How to play</button> · <button id="restart">New game</button></div>
</div>

<div class="bar"><div class="in">
  <div class="msg" id="msg">Tap goods to gather, or tap a workshop to build it.</div>
  <button class="btn ghost" id="clear" hidden>Clear</button>
  <button class="btn" id="act" disabled>Gather</button>
</div></div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetbox"></div></div>

<script>
const C=["timber","clay","ore","wool"];
const NAME={timber:"Timber",clay:"Clay",ore:"Ore",wool:"Wool"};
const SHOP={timber:["Sawmill","Cooper","Joinery","Wharf"],clay:["Kiln","Brickyard","Pottery","Tilery"],ore:["Forge","Smelter","Foundry","Mint"],wool:["Loom","Dyehouse","Fullery","Tailor"]};
const PATRONS=[["merchant","The Merchant"],["abbess","The Abbess"],["duchess","The Duchess"],["captain","The Captain"]];
const TURNS=24, CAP=10;
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const icon=(c,cls="i")=>`<svg class="${cls}" viewBox="0 0 40 40"><use href="#g-${c}"/></svg>`;
const house=c=>`<svg class="i" viewBox="0 0 16 16" style="color:var(--${c})"><use href="#house"/></svg>`;
let uid=0;

function spread(total,cols){const c={};cols.forEach(k=>c[k]=1);for(let i=cols.length;i<total;i++)c[pick(cols)]++;return c}
function makeCard(t){
  const bonus=pick(C), others=C.filter(c=>c!==bonus); let cost,pts;
  if(t===1){
    if(Math.random()<.25){cost={[pick(others)]:4};pts=1}
    else{const tot=R(3,4);cost=spread(tot,shuffle(others).slice(0,R(2,3)));pts=0}
  }else if(t===2){
    const r=Math.random();
    if(r<.25){cost={[pick(others)]:5};pts=2}
    else if(r<.4){cost={[pick(C)]:6};pts=3}
    else{const tot=R(5,7);cost=spread(tot,shuffle(C).slice(0,R(2,3)));pts=tot>=7?2:1}
  }else{
    const r=Math.random();
    if(r<.25){cost={[pick(C)]:7};pts=4}
    else{const tot=R(9,12);cost=spread(tot,shuffle(C).slice(0,R(3,4)));pts=tot>=12?5:tot>=10?4:3}
  }
  return{id:++uid,t,bonus,cost,pts,name:pick(SHOP[bonus])};
}
function makePatrons(){
  const pairs=[[0,1],[0,2],[0,3],[1,2],[1,3],[2,3]].map(p=>p.map(i=>C[i]));
  const tri=C.map(c=>C.filter(x=>x!==c));
  const pool=shuffle([...pairs.map(p=>({req:{[p[0]]:4,[p[1]]:4}})),...tri.map(p=>({req:{[p[0]]:3,[p[1]]:3,[p[2]]:3}}))]);
  const who=shuffle(PATRONS);
  return pool.slice(0,3).map((p,i)=>({...p,pts:3,done:false,face:who[i][0],title:who[i][1]}));
}
function newGame(){
  const z=()=>({timber:0,clay:0,ore:0,wool:0});
  return{turn:1,score:0,tok:z(),bon:z(),market:[1,2,3].map(t=>[0,0,0,0].map(()=>makeCard(t))),patrons:makePatrons(),built:0,over:false};
}

let S, sel=[], selCard=null, fresh=new Set();
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const best=()=>+store.get("guildhall.best")||0;
const $=id=>document.getElementById(id);

function tokTotal(){return C.reduce((s,c)=>s+S.tok[c],0)}
function need(card){const n={};for(const c in card.cost){n[c]=Math.max(0,card.cost[c]-S.bon[c])}return n}
function short(card){const n=need(card);let s={},any=false;for(const c in n){const d=n[c]-S.tok[c];if(d>0){s[c]=d;any=true}}return any?s:null}

function cardHTML(cd,ti,ci){
  const sh=short(cd), n=need(cd);
  const cls=["card","t"+cd.t,!sh?"can":"",selCard&&selCard[0]===ti&&selCard[1]===ci?"sel":"",fresh.has(cd.id)?"fresh":""].join(" ");
  const sun=cd.t===3?`<circle cx="22" cy="20" r="14" fill="url(#sun)"/>`:cd.t===2?`<circle cx="20" cy="14" r="9" fill="url(#sun)" opacity=".7"/>`:"";
  return `<button class="${cls}" data-r="${ti}" data-c="${ci}" aria-label="${cd.name}, ${NAME[cd.bonus]} workshop, ${cd.pts} prestige">
    <div class="art"><svg viewBox="0 0 100 64" preserveAspectRatio="xMidYMid slice"><rect width="100" height="64" fill="url(#sky${cd.t})"/>${sun}<use href="#sc-${cd.bonus}"/></svg>
      ${cd.pts?`<span class="coin">${cd.pts}</span>`:""}
      <span class="medal" style="--c:var(--${cd.bonus})">${icon(cd.bonus)}</span>
      <span class="name">${cd.name}</span></div>
    <div class="cost">${Object.entries(cd.cost).map(([c,v])=>`<span class="pip${sh&&sh[c]?" short":""}">${icon(c)}${n[c]}${n[c]<v?`<s>${v}</s>`:""}</span>`).join("")}</div></button>`;
}
function render(){
  $("turn").textContent=Math.min(S.turn,TURNS)+"/"+TURNS;
  $("score").textContent=S.score;
  $("best").textContent=best()||"–";
  $("tb").style.width=((S.turn-1)/TURNS*100)+"%";
  $("cap").textContent=tokTotal()+"/"+CAP+" goods";
  $("patrons").innerHTML=S.patrons.map(p=>`<div class="patron${p.done?" done":""}" aria-label="${p.title}"><span class="face"><svg viewBox="0 0 40 40"><use href="#pt-${p.face||"merchant"}"/></svg></span><span class="req">${Object.entries(p.req).map(([c,n])=>`<span class="${S.bon[c]>=n?"met":""}">${house(c)}${Math.min(S.bon[c],n)}/${n}</span>`).join("")}</span><span class="pv">${p.done?"✓":p.pts}</span></div>`).join("");
  $("market").innerHTML=S.market.map((row,ti)=>`<div class="row"><div class="tier">${"I".repeat(ti+1)}</div>${row.map((cd,ci)=>cardHTML(cd,ti,ci)).join("")}</div>`).join("");
  fresh.clear();
  $("res").innerHTML=C.map(c=>{const k=sel.filter(x=>x===c).length;return `<div class="col"><button class="chip" data-tok="${c}" style="--c:var(--${c})" aria-label="Gather ${NAME[c]}, you hold ${S.tok[c]}">${icon(c,"")}<span class="count">${S.tok[c]}</span>${k?`<span class="badge">+${k}</span>`:""}</button><span class="nm">${NAME[c]}</span><span class="ws" title="Workshops">${house(c)}<b>${S.bon[c]}</b></span></div>`}).join("");
  renderBar();
}
function pipText(o){return Object.entries(o).filter(([,v])=>v>0).map(([c,v])=>`${v} ${icon(c)}`).join(" ")}
function renderBar(){
  const act=$("act"),msg=$("msg"),clr=$("clear");
  clr.hidden=!(sel.length||selCard);
  if(selCard){
    const cd=S.market[selCard[0]][selCard[1]],sh=short(cd);
    act.textContent="Build";act.disabled=!!sh;
    msg.innerHTML=sh?`<b>${cd.name}</b><br><span class="sub">Missing ${pipText(sh)}</span>`:`<b>${cd.name}</b>: pay ${pipText(need(cd))||"nothing"}<br><span class="sub">+1 ${NAME[cd.bonus]} discount forever${cd.pts?`, +${cd.pts} prestige`:""}</span>`;
  }else if(sel.length){
    act.textContent="Gather";act.disabled=false;
    const same=sel.length===2&&sel[0]===sel[1];
    msg.innerHTML=`Gather ${pipText(sel.reduce((o,c)=>(o[c]=(o[c]||0)+1,o),{}))}<br><span class="sub">${same?"Two of a kind.":sel.length<3?"Up to 3 different, or tap again for 2 of one.":"Three different."}</span>`;
  }else{
    act.textContent="Gather";act.disabled=true;
    msg.innerHTML=`Tap goods to gather, or a workshop to build.<br><span class="sub">Green frame: you can build it now.</span>`;
  }
}
function tapTok(c){
  selCard=null;
  const has=sel.includes(c), room=CAP-tokTotal()-sel.length;
  if(sel.length===1&&sel[0]===c){ if(room>0)sel.push(c); else sel=[]; }
  else if(sel.length===2&&sel[0]===sel[1]){ sel=sel[0]===c?[]:[c]; }
  else if(has){ sel=sel.filter(x=>x!==c); }
  else if(sel.length<3){ if(room>0)sel.push(c); else toast("Your stores hold at most 10 goods. Build something."); }
  else { sel=[c]; }
  render();
}
function tapCard(r,c){ sel=[]; selCard=(selCard&&selCard[0]===r&&selCard[1]===c)?null:[r,c]; render(); }

function endTurn(){
  for(const p of S.patrons){ if(!p.done&&Object.entries(p.req).every(([c,n])=>S.bon[c]>=n)){p.done=true;S.score+=p.pts;toast(`${p.title||"A patron"} visits your guild: +3 prestige`)} }
  S.turn++; sel=[]; selCard=null;
  if(S.turn>TURNS){ S.over=true; }
  save(); render();
  if(S.over) showEnd();
}
function act(){
  if(selCard){
    const [r,c]=selCard, cd=S.market[r][c]; if(short(cd))return;
    const n=need(cd); for(const k in n)S.tok[k]-=n[k];
    S.bon[cd.bonus]++; S.score+=cd.pts; S.built++;
    const nc=makeCard(cd.t); S.market[r][c]=nc; fresh.add(nc.id);
    if(cd.pts)toast(`Built the ${cd.name}: +${cd.pts} prestige`);
    endTurn();
  }else if(sel.length){
    sel.forEach(k=>S.tok[k]++); endTurn();
  }
}
let tt;function toast(t){const el=$("toast");el.textContent=t;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),1900)}

function rank(s){return s>=28?"Guildmaster":s>=20?"Master Builder":s>=13?"Journeyman":s>=7?"Apprentice":"Hopeful"}
function sheet(html){$("sheetbox").innerHTML=html;$("sheet").hidden=false}
function closeSheet(){$("sheet").hidden=true}
const hero=`<div class="hero"><svg viewBox="0 0 200 96" preserveAspectRatio="xMidYMid slice"><use href="#hero"/></svg></div>`;
function showEnd(){
  const prev=best(), rec=S.score>prev; if(rec)store.set("guildhall.best",S.score);
  sheet(`${hero}<div class="label">Season over · ${S.built} workshops built</div><div class="big">${S.score}</div><h2>${rank(S.score)}</h2><p>${rec?(prev?`A new best, beating ${prev}.`:"Your first recorded season."):`Your best so far is ${prev}.`}</p><div class="btns"><button class="btn" id="again">Play again</button></div>`);
  $("again").onclick=()=>{closeSheet();start(null)};
  render();
}
function showHelp(first){
  sheet(`${hero}<h2>Little Guildhall</h2><p>Grow a guild of workshops in ${TURNS} turns. Each turn, do one thing:</p><ul><li><b>Gather</b> 3 different goods, or 2 of the same.</li><li><b>Build</b> a workshop by paying its cost.</li></ul><p>Each workshop makes its good 1 cheaper for the rest of the game. Workshops with a gold coin are worth prestige. Patrons visit when your workshop counts match theirs, for +3. You can hold 10 goods at most.</p><div class="btns"><button class="btn" id="ok">${first?"Start":"Back to the game"}</button></div>`);
  $("ok").onclick=()=>{store.set("guildhall.seen","1");closeSheet()};
}
function confirmRestart(){
  sheet(`<h2>Start a new season?</h2><p>This game will be lost.</p><div class="btns"><button class="btn ghost" id="no">Keep playing</button><button class="btn" id="yes">New game</button></div>`);
  $("no").onclick=closeSheet; $("yes").onclick=()=>{closeSheet();start(null)};
}
function save(){store.set("guildhall.game",JSON.stringify(S))}

// Walnut table texture, generated once.
(function(){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="900"><filter id="w"><feTurbulence type="fractalNoise" baseFrequency="0.006 0.09" numOctaves="4" seed="7"/><feColorMatrix values="0 0 0 0 .22  0 0 0 0 .14  0 0 0 0 .08  0 0 0 -1.1 1.05"/></filter><rect width="100%" height="100%" fill="#2e1f15"/><rect width="100%" height="100%" filter="url(#w)" opacity=".85"/><radialGradient id="v" cx=".5" cy=".4" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient><rect width="100%" height="100%" fill="url(#v)"/></svg>`;
  document.body.style.backgroundImage=`url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
})();

$("market").addEventListener("click",e=>{const b=e.target.closest(".card");if(b&&!S.over)tapCard(+b.dataset.r,+b.dataset.c)});
$("res").addEventListener("click",e=>{const b=e.target.closest("[data-tok]");if(b&&!S.over)tapTok(b.dataset.tok)});
$("act").onclick=act;
$("clear").onclick=()=>{sel=[];selCard=null;render()};
$("help").onclick=()=>showHelp(false);
$("restart").onclick=confirmRestart;

function start(data){
  let g=data&&data.S;
  if(!g&&data!==null){try{const s=JSON.parse(store.get("guildhall.game"));if(s&&!s.over)g=s}catch(e){}}
  S=g||newGame(); sel=[]; selCard=null;
  S.patrons.forEach((p,i)=>{if(!p.face){p.face=PATRONS[i][0];p.title=PATRONS[i][1]}});
  uid=Math.max(uid,...S.market.flat().map(c=>c.id));
  save(); render();
  if(!store.get("guildhall.seen")&&data!==null)showHelp(true);
}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
