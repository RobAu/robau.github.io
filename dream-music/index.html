<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Dream Music</title>
<meta name="theme-color" content="#07061a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@400;500;600&family=Noto+Sans+Symbols:wght@700&family=Noto+Sans+Symbols+2&family=Noto+Sans+Math&display=swap">
<style>
/* Layout: one full-bleed liquid canvas; a quiet title that dissolves on first touch; a thin control row hugging the bottom safe area. */
:root {
  --ink: #07061a;          /* deep night behind the liquid */
  --mist: #ece8ff;         /* text on the dream */
  --mist-dim: rgba(236, 232, 255, 0.62);
  --glass: rgba(18, 14, 46, 0.42);
  --glass-edge: rgba(236, 232, 255, 0.16);
  --glow: #b9a6ff;         /* focus + active state */
  --font-display: "Instrument Serif", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --font-ui: "Figtree", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
html, body {
  height: 100%;
  margin: 0;
  overflow: hidden;
  overscroll-behavior: none;
  background: var(--ink);
  color: var(--mist);
  font-family: var(--font-ui);
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;
  -webkit-user-select: none;
  user-select: none;
  touch-action: none;
}
body { position: fixed; inset: 0; }
[hidden] { display: none !important; }
body.nogl {
  background: radial-gradient(120% 80% at 30% 20%, #3a2a7a 0%, transparent 60%),
              radial-gradient(100% 90% at 80% 90%, #0f4d63 0%, transparent 60%),
              var(--ink);
}
#dream {
  position: fixed; inset: 0;
  width: 100%; height: 100%;
  display: block;
  touch-action: none;
  cursor: crosshair;
}
#intro {
  position: fixed; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: env(safe-area-inset-top, 0px) env(safe-area-inset-bottom, 0px);
  text-align: center;
  pointer-events: none;
  transition: opacity 1.6s ease, transform 2.4s ease, filter 1.6s ease;
}
#intro.gone { opacity: 0; transform: scale(1.06); filter: blur(10px); }
#intro h1 {
  margin: 0;
  font-family: var(--font-display);
  font-style: italic;
  font-weight: 400;
  font-size: clamp(3.2rem, 15vw, 6.5rem);
  line-height: 0.92;
  letter-spacing: -0.01em;
  text-wrap: balance;
  text-shadow: 0 0 40px rgba(185, 166, 255, 0.45);
}
#intro p {
  margin: 0;
  max-width: 30ch;
  font-size: 1.02rem;
  line-height: 1.5;
  color: var(--mist-dim);
  text-wrap: balance;
  text-shadow: 0 1px 12px rgba(7, 6, 26, 0.9), 0 0 2px rgba(7, 6, 26, 0.8);
}
#intro .begin {
  margin-top: 10px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mist);
  animation: breathe 3.2s ease-in-out infinite;
}
#intro .hint { font-size: 0.8rem; color: var(--mist-dim); text-shadow: 0 1px 10px rgba(7, 6, 26, 0.9); }
#intro .begin { text-shadow: 0 1px 12px rgba(7, 6, 26, 0.9); }
@keyframes breathe { 0%,100% { opacity: 0.45 } 50% { opacity: 1 } }

#bar {
  position: fixed; left: 0; right: 0; bottom: 0;
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding-left: max(14px, env(safe-area-inset-left, 0px));
  padding-right: max(14px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
#bar .group { display: flex; gap: 10px; }
#bar button {
  pointer-events: auto;
  min-height: 46px; min-width: 46px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  padding: 0 14px;
  border-radius: 999px;
  border: 1px solid var(--glass-edge);
  background: var(--glass);
  -webkit-backdrop-filter: blur(14px) saturate(1.3);
  backdrop-filter: blur(14px) saturate(1.3);
  color: var(--mist);
  font: 500 0.9rem/1 var(--font-ui);
  touch-action: manipulation;
  cursor: pointer;
  transition: background 0.2s, transform 0.15s;
}
#bar button.icon { padding: 0; width: 46px; }
#bar button:active { transform: scale(0.94); }
#bar button:focus-visible { outline: 2px solid var(--glow); outline-offset: 3px; }
#bar button svg { width: 20px; height: 20px; flex: none; }
#dreamName { font-family: var(--font-display); font-style: italic; font-size: 1.15rem; font-weight: 400; }
#next .lbl { font-size: 0.7rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mist-dim); }

#toast {
  position: fixed; left: 50%; top: calc(18px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -8px);
  max-width: calc(100% - 32px);
  padding: 9px 16px;
  border-radius: 999px;
  background: var(--glass);
  border: 1px solid var(--glass-edge);
  -webkit-backdrop-filter: blur(14px);
  backdrop-filter: blur(14px);
  font-size: 0.86rem; color: var(--mist);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  opacity: 0; pointer-events: none;
  transition: opacity 0.5s, transform 0.5s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast em { font-family: var(--font-display); font-size: 1.05rem; }

@media (prefers-reduced-motion: reduce) {
  #intro .begin { animation: none; }
  #intro { transition: opacity 0.6s; }
  #intro.gone { transform: none; filter: none; }
}
</style>
</head>
<body>
<canvas id="dream" aria-label="Liquid dream. Touch and drag to play music and stir the colors."></canvas>

<div id="intro">
  <h1>Dream music</h1>
  <p>Touch the dream to wake a voice. Drag to stir it. Higher on the screen sings higher. More fingers, more voices.</p>
  <div class="begin">Touch anywhere to begin</div>
  <div class="hint">Sound on. On iPhone, turn off silent mode.</div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<div id="bar">
  <div class="group">
    <button id="next" type="button" aria-label="Drift to the next dream">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg>
      <span id="dreamName">Moon tide</span>
    </button>
  </div>
  <div class="group">
    <button id="fs" class="icon" type="button" aria-label="Full screen" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button id="mute" class="icon" type="button" aria-label="Mute" aria-pressed="false">
      <svg id="icoOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg id="icoOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </div>
</div>

<script>
'use strict';
(() => {
const $ = s => document.querySelector(s);
const canvas = $('#dream');
const coarse = matchMedia('(pointer: coarse)').matches;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------------------------------------------------------------
   Dreams: each one is a mode, a key, a chord walk and a palette
---------------------------------------------------------------- */
const MODES = {
  lydian:     [0, 2, 4, 6, 7, 9, 11],
  dorian:     [0, 2, 3, 5, 7, 9, 10],
  aeolian:    [0, 2, 3, 5, 7, 8, 10],
  mixolydian: [0, 2, 4, 5, 7, 9, 10],
  ionian:     [0, 2, 4, 5, 7, 9, 11],
};
const NOTE_NAMES = ['C', 'D♭', 'D', 'E♭', 'E', 'F', 'G♭', 'G', 'A♭', 'A', 'B♭', 'B'];
const DREAMS = [
  { name: 'Moon tide',        mode: 'lydian',     root: 62, prog: [0, 4, 5, 3], bpm: 62, hue: 0.62, span: 0.42, deepA: [0.03, 0.02, 0.10], deepB: [0.01, 0.05, 0.12] },
  { name: 'Glass forest',     mode: 'dorian',     root: 57, prog: [0, 3, 6, 4], bpm: 68, hue: 0.36, span: 0.38, deepA: [0.01, 0.06, 0.06], deepB: [0.03, 0.03, 0.08] },
  { name: 'Slow orbit',       mode: 'aeolian',    root: 60, prog: [0, 5, 2, 6], bpm: 56, hue: 0.80, span: 0.40, deepA: [0.07, 0.02, 0.09], deepB: [0.02, 0.02, 0.07] },
  { name: 'Paper lanterns',   mode: 'mixolydian', root: 55, prog: [0, 6, 3, 4], bpm: 72, hue: 0.03, span: 0.30, deepA: [0.09, 0.03, 0.04], deepB: [0.04, 0.02, 0.08] },
  { name: 'Underwater choir', mode: 'ionian',     root: 58, prog: [0, 5, 3, 4], bpm: 60, hue: 0.50, span: 0.35, deepA: [0.00, 0.04, 0.09], deepB: [0.02, 0.06, 0.07] },
];
let dreamIdx = 0;
const curDream = () => DREAMS[dreamIdx];
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function note(d, i, oct) {
  const sc = MODES[d.mode];
  return d.root + (oct || 0) + 12 * Math.floor(i / 7) + sc[((i % 7) + 7) % 7];
}
const TOUCH_STEPS = 14;
const touchNote = y => note(curDream(), Math.min(TOUCH_STEPS - 1, Math.max(0, Math.floor(y * TOUCH_STEPS))), 0);

function hsv(h, s, v) {
  h = ((h % 1) + 1) % 1;
  const i = Math.floor(h * 6), f = h * 6 - i;
  const p = v * (1 - s), q = v * (1 - f * s), t = v * (1 - (1 - f) * s);
  return [[v, t, p], [q, v, p], [p, v, t], [p, q, v], [t, p, v], [v, p, q]][i % 6];
}
function noteColor(m, strength) {
  const d = curDream();
  const pc = (((m - d.root) % 12) + 12) % 12;
  const c = hsv(d.hue + (pc / 12) * d.span + (Math.random() - 0.5) * 0.04, 0.72, 1);
  const k = strength == null ? 0.16 : strength;
  return [c[0] * k, c[1] * k, c[2] * k];
}

/* ---------------------------------------------------------------
   Liquid: a small GPU stable-fluids solver
---------------------------------------------------------------- */
const QUALITY = [
  { sim: 160, dye: 1024, iter: 20 },
  { sim: 128, dye: 720,  iter: 16 },
  { sim: 96,  dye: 512,  iter: 12 },
  { sim: 64,  dye: 320,  iter: 8 },
];
let qLevel = coarse ? 1 : 0;
const CFG = { curl: reduceMotion ? 4 : 7, densDiss: 0.26, velDiss: 1.6, pressure: 0.8, radius: 0.26, force: 3000, maxSplat: 170, timeScale: 0.6 };

const Fluid = (() => {
  const params = { alpha: false, depth: false, stencil: false, antialias: false, preserveDrawingBuffer: false, powerPreference: 'high-performance' };
  let gl = canvas.getContext('webgl2', params);
  const isGL2 = !!gl;
  if (!gl) gl = canvas.getContext('webgl', params) || canvas.getContext('experimental-webgl', params);
  if (!gl) return null;

  let halfType, linear, fmtRGBA, fmtRG, fmtR;
  if (isGL2) {
    gl.getExtension('EXT_color_buffer_float');
    gl.getExtension('EXT_color_buffer_half_float');
    halfType = gl.HALF_FLOAT;
    linear = true;
  } else {
    const hf = gl.getExtension('OES_texture_half_float');
    if (!hf) return null;
    halfType = hf.HALF_FLOAT_OES;
    linear = !!gl.getExtension('OES_texture_half_float_linear');
  }
  gl.clearColor(0, 0, 0, 1);

  function canRender(internal, format) {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texImage2D(gl.TEXTURE_2D, 0, internal, 4, 4, 0, format, halfType, null);
    const fbo = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    const ok = gl.checkFramebufferStatus(gl.FRAMEBUFFER) === gl.FRAMEBUFFER_COMPLETE;
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo); gl.deleteTexture(tex);
    return ok;
  }
  if (isGL2) {
    fmtRGBA = canRender(gl.RGBA16F, gl.RGBA) ? { i: gl.RGBA16F, f: gl.RGBA } : null;
    if (!fmtRGBA) return null;
    fmtRG = canRender(gl.RG16F, gl.RG) ? { i: gl.RG16F, f: gl.RG } : fmtRGBA;
    fmtR = canRender(gl.R16F, gl.RED) ? { i: gl.R16F, f: gl.RED } : fmtRG;
  } else {
    if (!canRender(gl.RGBA, gl.RGBA)) return null;
    fmtRGBA = fmtRG = fmtR = { i: gl.RGBA, f: gl.RGBA };
  }

  const VS = `precision highp float;
    attribute vec2 aPosition;
    varying vec2 vUv, vL, vR, vT, vB;
    uniform vec2 texelSize;
    void main () {
      vUv = aPosition * 0.5 + 0.5;
      vL = vUv - vec2(texelSize.x, 0.0); vR = vUv + vec2(texelSize.x, 0.0);
      vT = vUv + vec2(0.0, texelSize.y); vB = vUv - vec2(0.0, texelSize.y);
      gl_Position = vec4(aPosition, 0.0, 1.0);
    }`;
  const HEAD = `precision highp float; precision highp sampler2D;
    varying vec2 vUv, vL, vR, vT, vB;\n`;
  const FS = {
    copy: `uniform sampler2D uTexture; void main () { gl_FragColor = texture2D(uTexture, vUv); }`,
    clear: `uniform sampler2D uTexture; uniform float value; void main () { gl_FragColor = value * texture2D(uTexture, vUv); }`,
    splat: `uniform sampler2D uTarget; uniform float aspectRatio; uniform vec3 color; uniform vec2 point; uniform float radius;
      void main () {
        vec2 p = vUv - point; p.x *= aspectRatio;
        vec3 s = exp(-dot(p, p) / radius) * color;
        gl_FragColor = vec4(texture2D(uTarget, vUv).xyz + s, 1.0);
      }`,
    advection: `uniform sampler2D uVelocity; uniform sampler2D uSource;
      uniform vec2 texelSize; uniform vec2 dyeTexelSize; uniform float dt; uniform float dissipation;
      vec4 bilerp (sampler2D sam, vec2 uv, vec2 ts) {
        vec2 st = uv / ts - 0.5; vec2 iuv = floor(st); vec2 fuv = fract(st);
        vec4 a = texture2D(sam, (iuv + vec2(0.5, 0.5)) * ts);
        vec4 b = texture2D(sam, (iuv + vec2(1.5, 0.5)) * ts);
        vec4 c = texture2D(sam, (iuv + vec2(0.5, 1.5)) * ts);
        vec4 d = texture2D(sam, (iuv + vec2(1.5, 1.5)) * ts);
        return mix(mix(a, b, fuv.x), mix(c, d, fuv.x), fuv.y);
      }
      void main () {
      #ifdef MANUAL_FILTERING
        vec2 coord = vUv - dt * bilerp(uVelocity, vUv, texelSize).xy * texelSize;
        vec4 result = bilerp(uSource, coord, dyeTexelSize);
      #else
        vec2 coord = vUv - dt * texture2D(uVelocity, vUv).xy * texelSize;
        vec4 result = texture2D(uSource, coord);
      #endif
        gl_FragColor = result / (1.0 + dissipation * dt);
      }`,
    divergence: `uniform sampler2D uVelocity;
      void main () {
        float L = texture2D(uVelocity, vL).x; float R = texture2D(uVelocity, vR).x;
        float T = texture2D(uVelocity, vT).y; float B = texture2D(uVelocity, vB).y;
        vec2 C = texture2D(uVelocity, vUv).xy;
        if (vL.x < 0.0) L = -C.x; if (vR.x > 1.0) R = -C.x;
        if (vT.y > 1.0) T = -C.y; if (vB.y < 0.0) B = -C.y;
        gl_FragColor = vec4(0.5 * (R - L + T - B), 0.0, 0.0, 1.0);
      }`,
    curl: `uniform sampler2D uVelocity;
      void main () {
        float L = texture2D(uVelocity, vL).y; float R = texture2D(uVelocity, vR).y;
        float T = texture2D(uVelocity, vT).x; float B = texture2D(uVelocity, vB).x;
        gl_FragColor = vec4(0.5 * (R - L - T + B), 0.0, 0.0, 1.0);
      }`,
    vorticity: `uniform sampler2D uVelocity; uniform sampler2D uCurl; uniform float curl; uniform float dt;
      void main () {
        float L = texture2D(uCurl, vL).x; float R = texture2D(uCurl, vR).x;
        float T = texture2D(uCurl, vT).x; float B = texture2D(uCurl, vB).x;
        float C = texture2D(uCurl, vUv).x;
        vec2 force = 0.5 * vec2(abs(T) - abs(B), abs(R) - abs(L));
        force /= length(force) + 0.0001;
        force *= curl * C; force.y *= -1.0;
        vec2 v = texture2D(uVelocity, vUv).xy + force * dt;
        v = clamp(v, -1000.0, 1000.0);
        gl_FragColor = vec4(v, 0.0, 1.0);
      }`,
    pressure: `uniform sampler2D uPressure; uniform sampler2D uDivergence;
      void main () {
        float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x;
        float div = texture2D(uDivergence, vUv).x;
        gl_FragColor = vec4((L + R + B + T - div) * 0.25, 0.0, 0.0, 1.0);
      }`,
    gradient: `uniform sampler2D uPressure; uniform sampler2D uVelocity;
      void main () {
        float L = texture2D(uPressure, vL).x; float R = texture2D(uPressure, vR).x;
        float T = texture2D(uPressure, vT).x; float B = texture2D(uPressure, vB).x;
        vec2 v = texture2D(uVelocity, vUv).xy - vec2(R - L, T - B);
        gl_FragColor = vec4(v, 0.0, 1.0);
      }`,
    attach: `uniform sampler2D uVelocity; uniform sampler2D uCloud; uniform float strength;
      // Where the hidden points are, the liquid takes on their motion, so it moves only as they move.
      void main () {
        vec4 c = texture2D(uCloud, vUv);
        vec2 v = texture2D(uVelocity, vUv).xy;
        float w = clamp(c.b * strength, 0.0, 0.5);
        v = mix(v, c.rg / max(c.b, 0.0001), w);
        gl_FragColor = vec4(v, 0.0, 1.0);
      }`,
    dreamAdvect: `uniform sampler2D uVelocity; uniform sampler2D uSource; uniform sampler2D uImage; uniform sampler2D uField;
      uniform sampler2D uImagePrev; uniform sampler2D uFieldPrev; uniform float uMix; uniform float uPic;
      uniform vec2 texelSize; uniform vec2 dyeTexel; uniform float uTime; uniform float dt; uniform float dissipation; uniform float amount; uniform float aspect;
      vec2 imgUv (vec2 uv) { vec2 p = (uv - vec2(0.5, 0.54)) * vec2(aspect, 1.0); return p / (min(aspect, 1.0) * 0.92) + 0.5; }
      // Fade to nothing toward the edges of the picture box so no straight seams appear.
      float win (vec2 q) { vec2 w = smoothstep(0.0, 0.14, q) * smoothstep(0.0, 0.14, 1.0 - q); return w.x * w.y; }
      // The old picture fades out while the new one fades in.
      vec4 img (vec2 q) { vec2 c = clamp(q, 0.0, 1.0); return mix(texture2D(uImagePrev, c), texture2D(uImage, c), uMix) * win(q); }
      float fld (vec2 q) { vec2 c = clamp(q, 0.0, 1.0); return mix(texture2D(uFieldPrev, c).a, texture2D(uField, c).a, uMix) * win(q); }
      float hash (vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
      float vnoise (vec2 p) {
        vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
        return mix(mix(hash(i), hash(i + vec2(1.0, 0.0)), f.x), mix(hash(i + vec2(0.0, 1.0)), hash(i + vec2(1.0, 1.0)), f.x), f.y);
      }
      // Slowly drifting billows, like the inside of a cloud.
      float billow (vec2 p, float t) {
        return vnoise(p * 4.0 + vec2(t * 0.11, -t * 0.07)) * 0.55 + vnoise(p * 9.0 - vec2(t * 0.05, t * 0.09)) * 0.3 + vnoise(p * 19.0 + t * 0.04) * 0.15;
      }
      void main () {
        vec2 q = imgUv(vUv);
        float cl = billow(q, uTime);
        float o = 3.6 / 192.0;
        vec4 im = img(q) * 0.4 + (img(q + vec2(o, o)) + img(q - vec2(o, o)) + img(q + vec2(o, -o)) + img(q - vec2(o, -o))) * 0.15;
        float m = smoothstep(0.08, 0.75, im.a + (cl - 0.5) * 0.45 * smoothstep(0.0, 0.5, im.a + 0.2)) * uPic;
        float lum = dot(im.rgb, vec3(0.3, 0.59, 0.11)) / max(im.a, 0.001);
        // Steering current: down the slope of a blurred copy of the figure, and from far away toward its middle.
        float e = 0.05;

  p.color = noteColor(m);
  const a = Math.random() * Math.PI * 2;
  Visual.queue.push([x, y, Math.cos(a) * 70, Math.sin(a) * 70, noteColor(m, 0.75), 1.5]);
}, { passive: false });

canvas.addEventListener('pointermove', e => {
  let p = pointers.get(e.pointerId);
  const [x, y] = uv(e);
  touchedNow();
  if (!p) {
    if (e.pointerType !== 'mouse') return;
    p = { x, y, dx: 0, dy: 0, moved: false, down: false, speed: 0, color: noteColor(touchNote(y), 0.05) };
    pointers.set(e.pointerId, p);
    return;
  }
  p.dx += x - p.x; p.dy += y - p.y;
  p.x = x; p.y = y; p.moved = true;
}, { passive: true });

function release(e) {
  const p = pointers.get(e.pointerId);
  if (!p) return;
  if (S.started) voiceOff(e.pointerId);
  if (e.pointerType === 'mouse' && e.type === 'pointerup') { p.down = false; p.color = noteColor(touchNote(p.y), 0.05); }
  else pointers.delete(e.pointerId);
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') { release(e); pointers.delete(e.pointerId); } });

// Keep the phone from scrolling, zooming, or showing callouts while you play.
const stop = e => { if (e.target === canvas || e.touches && e.touches.length > 1) e.preventDefault(); };
document.addEventListener('touchstart', stop, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

/* ---------------------------------------------------------------
   Controls
---------------------------------------------------------------- */
const toast = $('#toast');
let toastTimer;
function showToast(html) {
  toast.innerHTML = html; toast.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
}
$('#next').addEventListener('click', () => {
  touchedNow();
  dreamIdx = (dreamIdx + 1) % DREAMS.length;
  const d = curDream();
  $('#dreamName').textContent = d.name;
  showToast(`<em>${d.name}</em> · ${NOTE_NAMES[d.root % 12]} ${d.mode}`);
  hideIntro();
  if (!S.started) { requestWake(); startAudio(); }
  else {
    S.chordIdx = 0; S.step = 0;
    S.nextStep = Math.max(S.ctx.currentTime + 0.05, S.nextStep);
    S.delay.delayTime.setTargetAtTime((60 / d.bpm) * 0.75, S.ctx.currentTime, 0.5);
  }
  for (const [id, p] of pointers) {
    if (S.voices.has(id)) { voiceOff(id); voiceOn(id, p.x, p.y); }
  }
});
$('#mute').addEventListener('click', () => setMuted(!S.muted));
const fsBtn = $('#fs');
const root = document.documentElement;
if (document.fullscreenEnabled && root.requestFullscreen) {
  fsBtn.hidden = false;
  fsBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else root.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
  });
}
document.addEventListener('visibilitychange', () => {
  if (!S.started) return;
  if (document.hidden) S.ctx.suspend();
  else { if (!S.muted) S.ctx.resume(); requestWake(); }
});

/* ---------------------------------------------------------------
   Frame loop
---------------------------------------------------------------- */
if (!Fluid) {
  document.body.classList.add('nogl');
  canvas.style.display = 'none';
  // Without WebGL the music still plays; touches go to the page instead.
  document.addEventListener('pointerdown', e => { if (e.target.closest('button')) return; startAudio(); hideIntro(); });
  return;
}
canvas.addEventListener('webglcontextlost', e => { e.preventDefault(); setTimeout(() => location.reload(), 300); });

const dpr = () => Math.min(window.devicePixelRatio || 1, coarse ? 1.5 : 2);
function fitCanvas() {
  const w = Math.max(1, Math.floor(canvas.clientWidth * dpr()));
  const h = Math.max(1, Math.floor(canvas.clientHeight * dpr()));
  if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; return true; }
  return false;
}
fitCanvas();
Fluid.init();

// Seed the dream so the first frame is already alive.
for (let i = 0; i < 7; i++) {
  const m = note(curDream(), Math.floor(Math.random() * TOUCH_STEPS), 0);
  const a = Math.random() * Math.PI * 2;
  Fluid.splat(0.15 + Math.random() * 0.7, 0.15 + Math.random() * 0.7, Math.cos(a) * 700, Math.sin(a) * 700, noteColor(m, 0.9), 2.2);
}

let last = performance.now(), slowFrames = 0, frameCount = 0, ambientT = 0, breathT = Math.random() * 100;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) { last = now; return; }
  let dt = Math.min((now - last) / 1000, 1 / 30);
  last = now;
  if (fitCanvas()) Fluid.init();

  // Adaptive quality: if the phone struggles, lighten the solver.
  frameCount++;
  if (frameCount > 60) {
    slowFrames = dt > 0.024 ? slowFrames + 1 : Math.max(0, slowFrames - 0.5);
    if (slowFrames > 45 && qLevel < QUALITY.length - 1) { qLevel++; slowFrames = 0; Fluid.init(); }
  }

  // Ease the background toward the current dream.
  const d = curDream();
  for (let i = 0; i < 3; i++) { deepA[i] += (d.deepA[i] - deepA[i]) * 0.02; deepB[i] += (d.deepB[i] - deepB[i]) * 0.02; }

  // An unseen current so the dream keeps moving at rest.
  breathT += dt;
  const bx = 0.5 + 0.34 * Math.sin(breathT * 0.11), by = 0.5 + 0.3 * Math.sin(breathT * 0.153 + 1.3);
  const vx = 0.34 * 0.11 * Math.cos(breathT * 0.11), vy = 0.3 * 0.153 * Math.cos(breathT * 0.153 + 1.3);
  const calm = 1 - 0.85 * Dreamer.amount;
  if (frameCount % 2 === 0) Fluid.splat(bx, by, vx * 700 * (1 - 0.8 * Dreamer.amount), vy * 700 * (1 - 0.8 * Dreamer.amount), noteColor(note(d, S.curDeg, 0), (reduceMotion ? 0.004 : 0.01) + 0.006 * Dreamer.amount), 1.6);

  // Before sound starts, the dream makes its own drops.
  if (!S.started || S.muted) {
    ambientT -= dt;
    if (ambientT <= 0) {
      ambientT = 1.4 + Math.random() * 1.8;
      Visual.onNote(note(d, Math.floor(Math.random() * TOUCH_STEPS), 0), 0.1 + Math.random() * 0.8, 0.15 + Math.random() * 0.7);
    }
  }

  while (Visual.queue.length) {
    const q = Visual.queue.shift();
    const c = q[4].map(v => v * calm);
    Fluid.splat(q[0], q[1], q[2] * calm, q[3] * calm, c, q[5]);
  }

  let energy = 0;
  const touches = [];
  for (const [id, p] of pointers) {
    if (p.moved) {
      if (p.down) touches.push({ x: p.x, y: p.y, vx: p.dx / Math.max(dt, 0.008), vy: p.dy / Math.max(dt, 0.008) });
      p.speed = Math.hypot(p.dx, p.dy) / Math.max(dt, 0.008) / 2.5;
      const k = p.down ? 1 : 0.4;
      let fx = p.dx * CFG.force * k, fy = p.dy * CFG.force * k;
      const mag = Math.hypot(fx, fy);
      if (mag > CFG.maxSplat) { fx *= CFG.maxSplat / mag; fy *= CFG.maxSplat / mag; }
      Fluid.splat(p.x, p.y, fx, fy, p.color, p.down ? 1 : 0.6);
      p.dx = 0; p.dy = 0; p.moved = false;
    } else p.speed *= 0.85;
    if (p.down) {
      energy += 0.22 + Math.min(p.speed, 1) * 0.3;
      if (S.started && !S.muted) {
        const nm = voiceMove(id, p.x, p.y, p.speed);
        if (nm != null) p.color = noteColor(nm);
      }
    }
  }
  S.energy += (Math.min(1, energy) - S.energy) * (energy > S.energy ? 0.06 : 0.01);

  // Idle: gather the liquid into a dream image, then morph to the next one.
  let anyDown = false;
  for (const p of pointers.values()) if (p.down) anyDown = true;
  const idle = !anyDown && (now - Dreamer.lastInteract) > 3500;
  if (idle && !Dreamer.active) { Dreamer.active = true; Dreamer.since = 0; nextImage(); }
  else if (!idle) Dreamer.active = false;
  if (Dreamer.active) {
    Dreamer.since += dt;
    if (Dreamer.since > 16) { Dreamer.since = 0; nextImage(); }
  }
  // Ease from the old figure to the new one over about six seconds.
  Dreamer.mix = Math.min(1, (Dreamer.mix == null ? 1 : Dreamer.mix) + dt / 6);
  const mixE = Dreamer.mix * Dreamer.mix * (3 - 2 * Dreamer.mix);
  const picW = Dreamer.curPic == null ? 1 : Dreamer.prevPic + (Dreamer.curPic - Dreamer.prevPic) * mixE;
  Fluid.setMix(mixE, picW);
  const want = Dreamer.active && Dreamer.ready ? 1 : 0;
  Dreamer.amount += (want - Dreamer.amount) * Math.min(1, (want ? 0.2 : 2.5) * dt);
  // A thin, steady stream flows in from the edge to give the figure liquid to form from.
  if (Dreamer.amount > 0.05) {
    if (Dreamer.entry == null || Dreamer.entryFor !== Dreamer.idx) { Dreamer.entryFor = Dreamer.idx; Dreamer.entry = Math.random() * Math.PI * 2; }
    const a = Dreamer.entry + 0.35 * Math.sin(now / 2300);
    const ex = Math.min(0.96, Math.max(0.04, 0.5 + Math.cos(a) * 0.47));
    const ey = Math.min(0.96, Math.max(0.04, 0.54 + Math.sin(a) * 0.47));
    const dx = 0.5 - ex, dy = 0.54 - ey, dl = Math.hypot(dx, dy) || 1;
    const m = note(d, S.curDeg + (Math.floor(now / 1500) % 5) * 2, 0);
    if (picW > 0.02) Fluid.splat(ex, ey, dx / dl * 240, dy / dl * 240, noteColor(m, 0.07 * Dreamer.amount * picW), 0.35);
  }

  CFG.curlScale = 1 - 0.75 * Dreamer.amount;
  const symW = Dreamer.amount * (1 - picW);
  updatePointCloud(dt, now, symW, Math.sin(Math.PI * mixE) * (1 - picW), symW, touches);

  Fluid.step(dt * CFG.timeScale, Dreamer.amount * (0.8 + 1.6 * (1 - picW)), Dreamer.amount);
  Fluid.render(now / 1000, deepA, deepB, Dreamer.amount);
}
requestAnimationFrame(frame);
})();
</script>


</body>
</html>
