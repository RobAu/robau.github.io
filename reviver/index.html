<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Reviver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one full-height arcade cabinet, canvas centered and scaled to fit, controls hint underneath. Single deliberate night-cabinet look. */
:root {
  --cab: #1b1430;
  --cab-edge: #2c2147;
  --ink: #fff4e0;
  --muted: #b7a9d6;
  --seed: #ffcf4a;
  --hurt: #ff6b6b;
  --display: "Lilita One", "Arial Rounded MT Bold", "Trebuchet MS", sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--cab); color: var(--ink); font-family: var(--body);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 10px; padding-inline: 16px; padding-block: 8px; box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#wrap { position: relative; width: 100%; max-width: 1100px; flex: 1 1 auto; min-height: 0; display: flex; align-items: center; justify-content: center; }
canvas { display: block; border-radius: 10px; box-shadow: 0 0 0 3px var(--cab-edge), 0 18px 50px rgba(0,0,0,.5); touch-action: none; outline: none; }
canvas:focus-visible { box-shadow: 0 0 0 3px var(--seed); }
.hint { font-size: 13px; color: var(--muted); text-align: center; letter-spacing: .02em; flex: 0 0 auto; }
.hint b { color: var(--ink); font-weight: 800; }
#touch { position: fixed; inset: auto 0 0 0; padding: 0 16px calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: space-between; pointer-events: none; }
#touch[hidden] { display: none !important; }
#touch .grp { display: flex; gap: 12px; }
#touch button {
  pointer-events: auto; width: 64px; height: 64px; border-radius: 50%; border: 2px solid rgba(255,244,224,.35);
  background: rgba(27,20,48,.45); color: var(--ink); font: 22px var(--display); touch-action: none;
}
#touch button.on { background: rgba(255,207,74,.45); }
</style>
</head>
<body>
<div id="wrap"><canvas id="game" tabindex="0" aria-label="Reviver game"></canvas></div>
<div class="hint"><b>←→</b> or <b>A D</b> run · <b>Space</b> jump (hold for higher) · <b>Shift</b> dash once bought · land on bugs to squash them · <b>P</b> pause · <b>R</b> give up · <b>M</b> mute music and sound</div>
<div id="touch" hidden>
  <div class="grp"><button id="tp" aria-label="Pause">II</button><button id="tl" aria-label="Left">◀</button><button id="tr" aria-label="Right">▶</button></div>
  <div class="grp"><button id="td" aria-label="Dash">»</button><button id="tj" aria-label="Jump">⤒</button></div>
</div>

<script>
(() => {
'use strict';
const TS = 16, W = 480, H = 272, ROWS = 17;
const cvs = document.getElementById('game');
const ctx = cvs.getContext('2d');
let scale = 1;

function resize() {
  const wrap = document.getElementById('wrap');
  const r = wrap.getBoundingClientRect();
  scale = Math.max(0.5, Math.min(r.width / W, r.height / H));
  const dpr = window.devicePixelRatio || 1;
  cvs.style.width = Math.floor(W * scale) + 'px';
  cvs.style.height = Math.floor(H * scale) + 'px';
  cvs.width = Math.floor(W * scale * dpr);
  cvs.height = Math.floor(H * scale * dpr);
  ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
}
window.addEventListener('resize', resize);

/* ---------- storage (optional) ---------- */
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const meta = Object.assign({ runs: 0, bestDist: 0, hoard: 0 }, load('reviver.meta', {}));
if (meta.bank === undefined) meta.bank = meta.hoard;
meta.up = Object.assign({ fluff: 0, spring: 0, djump: 0, dash: 0, magnet: 0, pouch: 0, revive: 0 }, meta.up || {});

const UPGRADES = [
  { id: 'fluff',  name: 'Industrial Fluff', desc: '+1 max fluff per level. Hits hurt less, emotionally.', costs: [15, 30, 50, 75, 110] },
  { id: 'spring', name: 'Spring Paws',      desc: 'Jump higher each level. Much higher.',            costs: [18, 35, 60, 90] },
  { id: 'djump',  name: 'Double Jump',      desc: '+1 mid-air jump per level. Physics weeps.',       costs: [35, 70, 120] },
  { id: 'dash',   name: 'Warp Whiskers',    desc: 'Shift: dash through bugs. Levels: longer, faster.', costs: [45, 70, 100, 140] },
  { id: 'magnet', name: 'Seed Magnet',      desc: 'Seeds fly to you. Bigger pull each level.',       costs: [12, 28, 50, 80] },
  { id: 'pouch',  name: 'Cheek Pouches',    desc: 'Every seed counts +1 extra per level.',           costs: [30, 60, 100, 150] },
  { id: 'revive', name: 'The Reviver',      desc: '+1 comeback per run per level instead of dying.', costs: [60, 110, 180] },
];
const upCost = u => meta.up[u.id] < u.costs.length ? u.costs[meta.up[u.id]] : null;

/* ---------- level ----------
   #=ground  ==plank (one-way)  c=crumbly biscuit  ^=thumbtacks  o=seed
   b=beetle  f=bee  m=mousetrap  G=golden sunflower  P=start            */
function sec(width, rows, ground) {
  const out = [];
  for (let r = 0; r < ROWS; r++) {
    let s = r >= 14 ? ground : (rows[r] || '');
    out.push(s.padEnd(width, ' ').slice(0, width));
  }
  return out;
}
// ? = a random bug (more likely in later worlds)
const START = sec(12, { 13: '   P' }, '#'.repeat(12));
const ARENA = sec(46, { 13: '   o o o         B                       G' }, '#'.repeat(46));
const CHUNKS = [
  sec(52, {
    8:  '                o o o',
    9:  '               =======',
    11: '         ooo',
    12: '        =====',
    13: '            b                 ^^^     ?  b',
  }, '#'.repeat(52)),
  sec(44, {
    10: '                    ooo',
    11: '                   =====',
    13: '     o      o              f       o',
  }, '########   #######    ####   ####   ########'),
  sec(52, {
    11: '                      ooooooo',
    12: '                     ccccccccc',
    13: '   m          m  b                         m   ^^  b',
  }, '#'.repeat(21) + ' '.repeat(9) + '#'.repeat(22)),
  sec(48, {
    5:  '                              ooo',
    6:  '                              =====',
    7:  '                      oo',
    8:  '                     ====       f',
    9:  '             f',
    10: '              ====',
    12: '        ===',
    13: '                                         ?',
  }, '#'.repeat(18) + ' '.repeat(12) + '#'.repeat(18)),
  sec(40, {
    8:  '      ?        ?          ?',
    10: '      ooo      ooo      ooo',
    11: '     =====    =====    =====',
  }, '#'.repeat(8) + ' '.repeat(4) + '#'.repeat(5) + ' '.repeat(4) + '#'.repeat(5) + ' '.repeat(4) + '#'.repeat(10)),
  sec(38, {
    10: '        oo        oo        oo',
    13: '   b   ^^^^      ^^^^      ^^^^   ?',
  }, '#'.repeat(38)),
  sec(40, {
    9:  '                oooooo',
    10: '               cccccc',
    11: '         oooo          oooo',
    12: '        cccccc        cccccc',
    13: '  m                               ?',
  }, '#'.repeat(8) + ' '.repeat(24) + '#'.repeat(8)),
  sec(34, {
    11: '      ooo        ooo',
    13: '  m   m   ?   m   m  b    m   ?',
  }, '#'.repeat(34)),
  sec(44, {
    6:  '             oooooooooo',
    7:  '            ============',
    9:  '        ===',
    11: '    ====',
    13: '          b   ^^^   ?   ^^^   b       ?',
  }, '#'.repeat(44)),
];
let world = 1, LEVEL, COLS, LW;
function makeWorld(n) {
  const pool = CHUNKS.slice().sort(() => Math.random() - 0.5);
  const k = Math.min(3 + n, 9), parts = [START];
  for (let i = 0; i < k; i++) parts.push(pool[i % pool.length]);
  parts.push(ARENA);
  LEVEL = Array.from({ length: ROWS }, (_, r) => parts.map(p => p[r]).join(''));
  COLS = LEVEL[0].length; LW = COLS * TS;
}
const diff = () => 1 + (world - 1) * 0.12;
const THEMES = [
  { name: 'Clover Meadow', sky: ['#7fc4ff', '#cfe9ff', '#fff1d6'], sun: '#fff4c2', cloud: 'rgba(255,255,255,.85)', hills: ['#a8d98a', '#86c46f'], grass: ['#5fb84a', '#7fd162'], dirt: ['#8a5a3b', '#74492f'], night: false },
  { name: 'Dusty Dunes',   sky: ['#ff9f5a', '#ffd29a', '#ffe9c7'], sun: '#fff0b0', cloud: 'rgba(255,240,220,.6)', hills: ['#e8b56e', '#d39a52'], grass: ['#d9b45f', '#f2d58a'], dirt: ['#b9773e', '#a0652f'], night: false },
  { name: 'Moonlit Burrow', sky: ['#141d45', '#2d3a78', '#5d5a9c'], sun: '#f4f1d0', cloud: 'rgba(200,210,255,.18)', hills: ['#2e3f6e', '#24325a'], grass: ['#4f8f7a', '#6fb39a'], dirt: ['#4a3a5c', '#3d2f4d'], night: true },
  { name: 'Candy Nebula',  sky: ['#3a1a6c', '#b04aa8', '#ffb3d9'], sun: '#ffe0f7', cloud: 'rgba(255,220,250,.45)', hills: ['#a24fb0', '#7c3a96'], grass: ['#ff7cc8', '#ffc0e8'], dirt: ['#6a3a8a', '#5a2f78'], night: true },
];
const theme = () => THEMES[(world - 1) % THEMES.length];

let boss = null, stingers = [], grid, enemies, traps, seeds, crumbles, goal, start, particles, floaters;

function buildLevel() {
  grid = LEVEL.map(r => r.split(''));
  enemies = []; traps = []; seeds = []; stingers = []; crumbles = {}; particles = []; floaters = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = grid[r][c], x = c * TS, y = r * TS;
    if (ch === 'P') { start = { x: x + 2, y: y + 2 }; grid[r][c] = ' '; }
    else if (ch === 'o') { seeds.push({ x: x + 4, y: y + 4, w: 8, h: 8, got: false, t: Math.random() * 6 }); grid[r][c] = ' '; }
    else if (ch === '?') {
      grid[r][c] = ' ';
      if (Math.random() < Math.min(0.9, 0.35 + (world - 1) * 0.15)) {
        if (Math.random() < 0.5) enemies.push({ type: 'beetle', x: x + 1, y: y + 7, w: 14, h: 9, vx: 0, dir: -1, vy: 0, alive: true, squash: 0 });
        else enemies.push({ type: 'bee', x: x + 3, y: y + 4, w: 11, h: 9, x0: x, y0: y + 4, t: Math.random() * 6, dir: 1, alive: true, squash: 0 });
      }
    }
    else if (ch === 'b') { enemies.push({ type: 'beetle', x: x + 1, y: y + 7, w: 14, h: 9, vx: -0.6, dir: -1, vy: 0, alive: true, squash: 0 }); grid[r][c] = ' '; }
    else if (ch === 'f') { enemies.push({ type: 'bee', x: x + 3, y: y + 4, w: 11, h: 9, x0: x, y0: y + 4, t: Math.random() * 6, dir: 1, alive: true, squash: 0 }); grid[r][c] = ' '; }
    else if (ch === 'm') { traps.push({ x: x + 1, y: y + 10, w: 14, h: 6, state: 'armed', t: 0 }); grid[r][c] = ' '; }
    else if (ch === 'G') { goal = { x: x - 4, y: y - 40, w: 24, h: 56 }; grid[r][c] = ' '; for (let rr = 0; rr < 14; rr++) grid[rr][c - 4] = 'F'; }
    else if (ch === 'B') {
      const bee = world % 2 === 0;
      boss = { kind: bee ? 'bee' : 'bucket', x: x, y: bee ? 70 : y - 10, w: bee ? 24 : 26, h: bee ? 20 : 26, vx: 0, vy: 0, dir: -1, hp: Math.min(8, 2 + world - (bee ? 1 : 0)), maxHp: Math.min(8, 2 + world - (bee ? 1 : 0)), alive: true, awake: false, state: 'walk', t: 0, hitT: 0,
               minX: (Math.floor(c / 1) - 13) * TS, taunt: 0 };
      grid[r][c] = ' ';
    }
    else if (ch === 'c') { crumbles[r + ',' + c] = { state: 'solid', t: 0 }; }
  }
  boss.maxX = goal.x + 4 - 4 * TS - boss.w;
}

function tileAt(c, r) {
  if (c < 0 || c >= COLS) return '#';
  if (r < 0 || r >= ROWS) return ' ';
  const ch = grid[r][c];
  if (ch === 'c') { const cr = crumbles[r + ',' + c]; return cr.state === 'gone' ? ' ' : 'c'; }
  return ch;
}
const isSolid = ch => ch === '#' || (ch === 'F' && boss && boss.alive);
const isTop = ch => ch === '=' || ch === 'c';

/* ---------- audio ---------- */
let actx = null, muted = load('reviver.muted', false);
function sfx(f, dur = 0.1, type = 'square', slide = 0, vol = 0.08) {
  if (muted) return;
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
  } catch (e) {}
}
const SND = {
  jump: () => sfx(520, 0.12, 'square', 380),
  seed: () => { sfx(880, 0.06, 'triangle'); setTimeout(() => sfx(1320, 0.08, 'triangle'), 50); },
  stomp: () => sfx(300, 0.15, 'square', -220, 0.1),
  hurt: () => sfx(220, 0.25, 'sawtooth', -160, 0.1),
  snap: () => sfx(140, 0.08, 'square', -60, 0.14),
  die: () => { sfx(400, 0.5, 'sawtooth', -360, 0.1); },
  win: () => [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => sfx(f, 0.18, 'triangle'), i * 110)),
};

/* ---------- music: a tiny chiptune sequencer ---------- */
const _ = null;
const TRACKS = {
  main: { bpm: 132,
    lead: [72,_,76,79, 76,_,72,_,  74,_,77,81, 79,_,77,76,  72,_,76,79, 84,_,83,81,  79,_,77,74, 72,_,_,_],
    bass: [48,_,55,_, 48,_,55,_,  50,_,57,_, 50,_,57,_,  53,_,60,_, 53,_,60,_,  55,_,62,_, 55,_,62,_] },
  boss: { bpm: 168,
    lead: [69,_,72,69, 76,_,74,72,  71,_,74,71, 77,_,76,74,  69,_,72,69, 76,_,79,77,  76,74,72,71, 69,_,68,_],
    bass: [45,45,57,45, 45,45,57,45,  41,41,53,41, 41,41,53,41,  43,43,55,43, 43,43,55,43,  40,40,52,40, 40,40,52,40] },
};
let musicOn = false, mStep = 0, mNext = 0, mTrack = 'main';
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function tone(n, t, dur, type, vol) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(midi(n), t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.02);
}
function startMusic() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { return; }
  if (musicOn) return;
  musicOn = true; mNext = actx.currentTime + 0.1;
  setInterval(() => {
    const want = (state === 'play' && boss && boss.awake && boss.alive) ? 'boss' : 'main';
    if (want !== mTrack) { mTrack = want; mStep = 0; }
    const tr = TRACKS[mTrack], stepDur = 60 / tr.bpm / 2;
    if (mNext < actx.currentTime) mNext = actx.currentTime + 0.05;
    while (mNext < actx.currentTime + 0.12) {
      if (!muted && !paused) {
        const l = tr.lead[mStep % 32], b = tr.bass[mStep % 32];
        if (l) tone(l, mNext, stepDur * 0.9, 'square', 0.022);
        if (b) tone(b, mNext, stepDur * 0.8, 'triangle', 0.07);
        if (mStep % 2 === 0) tone(mTrack === 'boss' ? 33 : 36, mNext, 0.05, 'square', 0.012);
      }
      mNext += stepDur; mStep++;
    }
  }, 25);
}

/* ---------- input ---------- */
const keys = {};
let jumpPressed = false;
const JUMP_KEYS = ['Space', 'KeyW', 'KeyZ', 'KeyK', 'ArrowUp'];
const DASH_KEYS = ['ShiftLeft', 'ShiftRight', 'KeyX', 'KeyJ'];
let dashPressed = false;
window.addEventListener('keydown', e => {
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
  if (JUMP_KEYS.includes(e.code) && !keys[e.code]) jumpPressed = true;
  keys[e.code] = true;
  if (e.code === 'KeyM') { muted = !muted; save('reviver.muted', muted); }
  if (DASH_KEYS.includes(e.code) && !e.repeat) dashPressed = true;
  if ((e.code === 'KeyP' || e.code === 'Escape') && state === 'play') { paused = !paused; return; }
  if (paused) { if (JUMP_KEYS.includes(e.code) || e.code === 'Enter') paused = false; jumpPressed = false; return; }
  if (e.code === 'KeyR' && state === 'play') die('quit');
  const confirm = (JUMP_KEYS.includes(e.code) && !(state === 'shop' && (e.code === 'ArrowUp' || e.code === 'KeyW'))) || e.code === 'Enter';
  if (state === 'perk') {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') perkSel = Math.min(2, perkSel + 1);
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') perkSel = Math.max(0, perkSel - 1);
    else if (confirm && e.code !== 'ArrowUp' && e.code !== 'KeyW' && !e.repeat && endTimer > 30) applyPerk(perkChoices[perkSel]);
    jumpPressed = false; return;
  }
  if (state === 'shop') {
    if (e.code === 'ArrowRight' || e.code === 'KeyD') shopMove(1);
    else if (e.code === 'ArrowLeft' || e.code === 'KeyA') shopMove(-1);
    else if (e.code === 'ArrowDown' || e.code === 'KeyS') shopMove(2);
    else if (e.code === 'ArrowUp' || e.code === 'KeyW') shopMove(-2);
    if (confirm && !e.repeat) shopConfirm();
    jumpPressed = false; return;
  }
  if (confirm && !e.repeat) advance();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
const autoPause = () => { if (state === 'play') paused = true; for (const k in keys) keys[k] = false; };
window.addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
const touch = { l: false, r: false, j: false };
const left = () => keys.ArrowLeft || keys.KeyA || touch.l;
const right = () => keys.ArrowRight || keys.KeyD || touch.r;
const jumpHeld = () => JUMP_KEYS.some(k => keys[k]) || touch.j;

if (window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window) {
  document.getElementById('touch').hidden = false;
  const bind = (id, k) => {
    const b = document.getElementById(id);
    const on = e => {
      e.preventDefault();
      if (k === 'p') { if (state === 'play') paused = !paused; return; }
      if (paused) { paused = false; return; }
      if (state === 'perk') { if (k === 'l') perkSel = Math.max(0, perkSel - 1); else if (k === 'r') perkSel = Math.min(2, perkSel + 1); else if (endTimer > 30) applyPerk(perkChoices[perkSel]); return; }
      if (state === 'shop') { if (k === 'l') shopMove(-1); else if (k === 'r') shopMove(1); else shopConfirm(); return; }
      if (k === 'j' && !touch.j) { jumpPressed = true; if (state !== 'play') { advance(); jumpPressed = false; } }
      if (k === 'd') dashPressed = true;
      touch[k] = true; b.classList.add('on');
    };
    const off = e => { e.preventDefault(); touch[k] = false; b.classList.remove('on'); };
    if (k === 'd' && !meta.up.dash) b.hidden = true;
    b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off);
    b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
  };
  bind('tp', 'p'); bind('tl', 'l'); bind('tr', 'r'); bind('tj', 'j'); bind('td', 'd');
}
cvs.addEventListener('pointerdown', e => {
  cvs.focus();
  if (paused) { paused = false; return; }
  if (state === 'perk') {
    const r = cvs.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const i = perkRects.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (i >= 0 && endTimer > 30) applyPerk(perkChoices[i]);
    return;
  }
  if (state === 'shop') {
    const r = cvs.getBoundingClientRect();
    const x = (e.clientX - r.left) / r.width * W, y = (e.clientY - r.top) / r.height * H;
    const i = shopRects.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (i >= 0) { shopSel = i; shopConfirm(); }
    return;
  }
  if (state !== 'play') advance();
});
function advance() {
  startMusic();
  if (state === 'title') newRun();
  else if ((state === 'dead' || state === 'win') && endTimer > 40) { state = 'shop'; shopSel = UPGRADES.length; shopMsg = ''; shopMsgT = 0; }
}
let shopSel = 0, shopMsg = '', shopMsgT = 0, shopRects = [];
function shopMove(d) { shopSel = Math.max(0, Math.min(UPGRADES.length, shopSel + d)); }
function shopConfirm() {
  if (shopSel === UPGRADES.length) { newRun(); return; }
  const u = UPGRADES[shopSel], c = upCost(u);
  if (c === null) { shopMsg = 'Maxed out. Even hamsters have limits.'; shopMsgT = 90; sfx(200, 0.1); return; }

    if (b.t > 40) { b.state = 'charge'; b.t = 0; b.vx = b.dir * (4 + (b.maxHp - b.hp) * 0.4) * diff(); shake = 4; }
  } else if (b.state === 'charge') {
    if (b.t % 2) particles.push({ x: b.x + 13 - b.dir * 12, y: b.y + 6 + Math.random() * 16, vx: -b.dir, vy: 0, life: 16, max: 16, col: pick(['#ff8fb1', '#8fe3ff', '#b6f27a']), r: 3 });
    if (b.x <= b.minX || b.x >= b.maxX) { b.state = 'stun'; b.t = 0; b.vx = 0; shake = 8; sfx(90, 0.3, 'square', -40, 0.12); floatText(b.x - 30, b.y - 20, 'I hit the wall! Again!', '#fff4e0'); }
  } else if (b.state === 'stun') {
    b.vx = 0;
    if (b.t > 80) { b.state = 'walk'; b.t = 0; }
  }
  b.vy = Math.min(MAXFALL, b.vy + G);
  b.x = Math.max(b.minX, Math.min(b.maxX, b.x + b.vx));
  moveY(b);
  if (!overlap(P, b)) return;
  if (P.vy > 0 && P.y + P.h - P.vy <= b.y + 9) {
    P.vy = jumpHeld() ? -8 : -6; P.cut = false; P.sq = 1.3;
    P.vx = (P.x + 6 < b.x + 13 ? -1 : 1) * 3.5;
    if (b.hitT > 0) return;
    b.hp--; b.hitT = 70; b.state = 'stun'; b.t = 30; b.vx = 0; shake = 10; hitStop = 5;
    puff(b.x + 13, b.y + 4, 14, '#3b3b48', 2.2, 40); SND.stomp(); sfx(140, 0.3, 'square', -80, 0.12);
    if (b.hp <= 0) bossDefeated(b, 'Curses! Foiled by fluff!');
    else floatText(b.x - 20, b.y - 20, pick(['My visor! I can\'t see!', 'OW. My helmet.', 'Who made this helmet?!']), '#fff4e0');
  } else if (b.state !== 'stun' && P.dash <= 0) hurt('boss', P.x < b.x ? -1 : 1);
}

function updateEnemies() {
  for (const e of enemies) {
    if (!e.alive) { if (e.squash > 0) e.squash--; continue; }
    if (e.type === 'beetle') {
      e.vy = Math.min(MAXFALL, (e.vy || 0) + G);
      e.vx = e.dir * 0.6 * diff();
      const hitWall = moveX(e);
      moveY(e);
      if (e.ground) {
        const aheadC = Math.floor((e.dir > 0 ? e.x + e.w + 1 : e.x - 1) / TS);
        const below = tileAt(aheadC, Math.floor((e.y + e.h + 1) / TS));
        const ahead = tileAt(aheadC, Math.floor((e.y + e.h - 2) / TS));
        if (hitWall || !(isSolid(below) || isTop(below)) || ahead === '^') e.dir = -e.dir;
      }
      if (e.y > H + 40) e.alive = false;
    } else {
      e.t += 0.05;
      e.x += e.dir * 0.7 * diff();
      if (e.x > e.x0 + 44) e.dir = -1;
      if (e.x < e.x0 - 44) e.dir = 1;
      e.y = e.y0 + Math.sin(e.t) * 14;
    }
  }
}
function updateCrumbles() {
  for (const k in crumbles) {
    const cr = crumbles[k];
    if (cr.state === 'shaking' && ++cr.t > 28) {
      cr.state = 'gone'; cr.t = 0;
      const [r, c] = k.split(',').map(Number);
      puff(c * TS + 8, r * TS + 4, 6, '#d9a45b', 1.4, 30);
    } else if (cr.state === 'gone' && ++cr.t > 200) {
      const [r, c] = k.split(',').map(Number);
      if (!P || !overlap(P, { x: c * TS, y: r * TS, w: TS, h: TS })) { cr.state = 'solid'; cr.t = 0; }
    }
  }
}
function updateParticles() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.05; p.vx *= 0.97; p.life--; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 0.5; f.life--; }
  floaters = floaters.filter(f => f.life > 0);
}

/* ---------- drawing ---------- */
function ell(x, y, rx, ry, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); ctx.fill(); }
function rrect(x, y, w, h, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fill(); }

function drawBackground() {
  const th = state === 'title' ? THEMES[0] : theme();
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(0.65, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (th.night) for (let i = 0; i < 40; i++) {
    const sx = ((i * 97 - cam * 0.05) % W + W) % W, sy = (i * 53) % 150;
    ctx.globalAlpha = 0.4 + 0.4 * Math.sin(frame * 0.05 + i); ell(sx, sy, 0.9, 0.9, '#ffffff'); ctx.globalAlpha = 1;
  }
  // sun or moon
  ell(400 - cam * 0.02, 50, 22, 22, th.sun);
  if (th.night) { ell(393 - cam * 0.02, 45, 4, 4, 'rgba(0,0,0,.08)'); ell(408 - cam * 0.02, 58, 3, 3, 'rgba(0,0,0,.08)'); }
  // clouds
  for (let i = 0; i < 8; i++) {
    const x = ((i * 157 - cam * 0.15 + frame * 0.05) % (W + 160) + W + 160) % (W + 160) - 80, y = 24 + (i * 37) % 70;
    ell(x, y, 22, 9, th.cloud); ell(x + 14, y - 5, 14, 9, th.cloud); ell(x - 12, y - 2, 12, 7, th.cloud);
  }
  // hills
  const hill = (par, base, amp, col, f) => {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 8) { const wx = x + cam * par; ctx.lineTo(x, base - Math.sin(wx * f) * amp - Math.sin(wx * f * 2.7) * amp * 0.4); }
    ctx.lineTo(W, H); ctx.fill();
  };
  hill(0.2, 190, 22, th.hills[0], 0.012);
  hill(0.4, 214, 16, th.hills[1], 0.02);
}

function drawTiles() {
  const c0 = Math.floor(cam / TS), c1 = c0 + Math.ceil(W / TS) + 1;
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1 && c < COLS; c++) {
    const ch = grid[r][c], x = c * TS - cam, y = r * TS;
    if (ch === '#') {
      const topOpen = r === 0 || grid[r - 1][c] !== '#';
      const th = theme();
      ctx.fillStyle = th.dirt[0]; ctx.fillRect(x, y, TS, TS);
      ctx.fillStyle = th.dirt[1];
      if ((c * 7 + r * 3) % 5 === 0) ctx.fillRect(x + 4, y + 8, 3, 3);
      if ((c * 3 + r * 5) % 4 === 0) ctx.fillRect(x + 10, y + 3, 2, 2);
      if (topOpen) {
        ctx.fillStyle = th.grass[0]; ctx.fillRect(x, y, TS, 5);
        ctx.fillStyle = th.grass[1]; ctx.fillRect(x, y, TS, 2);
        ctx.fillStyle = th.grass[0]; ctx.fillRect(x + 3, y + 5, 2, 2); ctx.fillRect(x + 11, y + 5, 2, 1);
      }
    } else if (ch === '=') {
      rrect(x, y, TS, 6, 2, '#c98b4f'); ctx.fillStyle = '#a86d37'; ctx.fillRect(x, y + 4, TS, 2);
      ctx.fillStyle = '#7d4f25'; ctx.fillRect(x + 7, y + 1, 1, 3);
    } else if (ch === 'c') {
      const cr = crumbles[r + ',' + c];
      if (cr.state === 'gone') continue;
      const j = cr.state === 'shaking' ? (Math.random() - 0.5) * 2 : 0;
      rrect(x + j, y, TS - 1, 7, 2, '#e7b46a');
      ctx.fillStyle = '#c48c43'; ctx.fillRect(x + 3 + j, y + 2, 2, 2); ctx.fillRect(x + 10 + j, y + 3, 2, 2);
      if (cr.state === 'shaking') { ctx.fillStyle = '#6e4a1f'; ctx.fillRect(x + 6 + j, y, 1, 7); }
    } else if (ch === 'F') {
      if (!boss.alive) continue;
      ctx.fillStyle = `rgba(143,227,255,${0.25 + 0.15 * Math.sin(frame * 0.2 + r)})`; ctx.fillRect(x + 5, y, 6, TS);
      ctx.fillStyle = 'rgba(255,255,255,.7)'; ctx.fillRect(x + 7, y + ((frame * 2 + r * 7) % 16), 2, 4);
    } else if (ch === '^') {
      for (let k = 0; k < 2; k++) {
        const bx = x + 2 + k * 7;
        ctx.fillStyle = '#c9ced6'; ctx.beginPath(); ctx.moveTo(bx, y + 16); ctx.lineTo(bx + 3, y + 7); ctx.lineTo(bx + 6, y + 16); ctx.fill();
        ell(bx + 3, y + 15, 3.5, 1.6, '#e2475b');
      }
    }
  }
}

function drawSeed(s) {
  if (s.got) return;
  const y = s.y + Math.sin(frame * 0.08 + s.t) * 1.5;
  ctx.save(); ctx.translate(s.x + 4 - cam, y + 4); ctx.rotate(0.5);
  ell(0, 0, 3, 5, '#3b2f2a'); ell(0, 0, 1.4, 4, '#f2e6c9');
  ctx.restore();
}

function drawEnemy(e) {
  const x = e.x - cam, y = e.y;
  if (x < -30 || x > W + 30) return;
  if (!e.alive) {
    if (e.squash <= 0) return;
    ctx.globalAlpha = e.squash / 40;
    ell(x + e.w / 2, y + e.h - 1, e.w / 2 + 2, 2, e.type === 'bee' ? '#ffd23f' : '#5b3a8c');
    ctx.globalAlpha = 1; return;
  }
  if (e.type === 'beetle') {
    const f = e.dir, leg = Math.sin(frame * 0.4) * 1.5;
    ctx.fillStyle = '#2b1d14'; ctx.fillRect(x + 3 + leg, y + 7, 1, 2); ctx.fillRect(x + 7 - leg, y + 7, 1, 2); ctx.fillRect(x + 11 + leg, y + 7, 1, 2);
    ell(x + 7, y + 5, 7, 4.5, '#5b3a8c'); ell(x + 6, y + 3.5, 4, 2, '#8f6ad1');
    ctx.fillStyle = '#3d2463'; ctx.fillRect(x + 7, y + 1, 1, 7);
    ell(x + 7 + f * 6, y + 5, 2.6, 2.6, '#2b1d14');
    ell(x + 7 + f * 7, y + 4.3, 0.9, 0.9, '#fff');
  } else {
    const wing = Math.sin(frame * 0.9) * 2;
    ell(x + 4, y - 1 - wing * 0.5, 3, 4 + wing * 0.3, 'rgba(255,255,255,.75)');
    ell(x + 7, y - 1 + wing * 0.5, 3, 4 - wing * 0.3, 'rgba(255,255,255,.75)');
    ell(x + 5.5, y + 4.5, 6, 4.5, '#ffd23f');
    ctx.fillStyle = '#2b1d14'; ctx.fillRect(x + 3, y + 1, 2, 7); ctx.fillRect(x + 7, y + 1, 2, 7);
    const f = e.dir;
    ell(x + 5.5 + f * 4.5, y + 3.5, 1, 1, '#2b1d14');
    ctx.fillStyle = '#2b1d14'; ctx.beginPath(); const sx = x + 5.5 - f * 6.5;
    ctx.moveTo(sx, y + 4); ctx.lineTo(sx - f * 3, y + 5); ctx.lineTo(sx, y + 6); ctx.fill();
  }
}

function drawTrap(t) {
  const x = t.x - cam, y = t.y;
  if (x < -30 || x > W + 30) return;
  rrect(x, y + 2, t.w, 4, 1, '#c8a06a'); ctx.fillStyle = '#9c7746'; ctx.fillRect(x, y + 5, t.w, 1);
  ctx.strokeStyle = '#8b9099'; ctx.lineWidth = 1.2; ctx.beginPath();
  if (t.state === 'armed') {
    ctx.moveTo(x + 1, y + 2); ctx.lineTo(x - 3, y - 3); ctx.lineTo(x + 3, y - 3); ctx.stroke();
    // cheese bait
    ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.moveTo(x + 8, y + 2); ctx.lineTo(x + 13, y + 2); ctx.lineTo(x + 13, y - 2); ctx.fill();
    ell(x + 11.5, y + 0.8, 0.7, 0.7, '#e0ad1f');
  } else if (t.state === 'snapping') {
    ctx.moveTo(x + 1, y + 2); ctx.lineTo(x + 3, y - 5); ctx.lineTo(x + 9, y - 3); ctx.stroke();
  } else {
    ctx.moveTo(x + 1, y + 2); ctx.lineTo(x + 13, y + 2); ctx.stroke();
  }
}

function drawBeeBoss() {
  const b = boss, x = b.x - cam, y = b.y, f = b.dir;
  for (const st of stingers) { ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.moveTo(st.x - cam, st.y); ctx.lineTo(st.x - cam + 4, st.y); ctx.lineTo(st.x - cam + 2, st.y + 7); ctx.fill(); }
  if (x < -60 || x > W + 60) return;

    ctx.save(); ctx.translate(x + 12 + j, y + 10);
    if (b.state === 'dive') ctx.rotate(f > 0 ? 0.6 : -0.6);
    const wing = stun ? 0 : Math.sin(frame * 1.1) * 3;
    ell(-5, -9 - wing * 0.5, 6, 8 + wing * 0.4, 'rgba(255,255,255,.7)'); ell(4, -9 + wing * 0.5, 6, 8 - wing * 0.4, 'rgba(255,255,255,.7)');
    ell(0, 0, 13, 10, '#ffd23f');
    ctx.fillStyle = '#2b1d14'; ctx.fillRect(-7, -9, 3, 18); ctx.fillRect(-1, -10, 3, 20); ctx.fillRect(5, -9, 3, 18);
    ctx.fillStyle = '#2b1d14'; ctx.beginPath(); ctx.moveTo(-f * 12, -2); ctx.lineTo(-f * 19, stun ? 8 : 1); ctx.lineTo(-f * 12, 3); ctx.fill();
    ell(f * 8, -2, 2.4, 2.4, '#fff'); ell(f * 8.6, -2, 1.2, 1.2, '#2b1d14');
    // admiral's hat
    ctx.fillStyle = '#1b2a5c'; ctx.beginPath(); ctx.ellipse(f * 2, -10, 11, 5, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#ffcf4a'; ctx.fillRect(f * 2 - 11, -11, 22, 2); ell(f * 2, -13, 2, 2, '#ffcf4a');
    if (stun) for (let i = 0; i < 3; i++) { const a = frame * 0.1 + i * 2.1; ell(Math.cos(a) * 13, -18 + Math.sin(a) * 3, 2, 2, '#ffcf4a'); }
    ctx.restore();
  }
  for (let i = 0; i < b.maxHp; i++) ell(x + 12 - (b.maxHp - 1) * 3.5 + i * 7, y - 12, 2.5, 2.5, i < b.hp ? '#ff6b6b' : 'rgba(0,0,0,.25)');
}

function drawBoss() {
  const b = boss; if (!b.alive) return;
  if (b.kind === 'bee') { drawBeeBoss(); return; }

  ctx.fillStyle = '#2b1d14'; [-8, -2, 4, 9].forEach((lx, i) => ctx.fillRect(lx + (i % 2 ? leg : -leg), 21, 2, 5));
  ell(0, 17, 13, 8, '#5b3a8c'); ell(-3, 15, 7, 3, '#8f6ad1');
  // the comically oversized helmet
  ctx.fillStyle = '#26262f'; ctx.beginPath(); ctx.ellipse(0, 6, 16, 17, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(-16, 5, 32, 4);
  ell(-5, -4, 4, 6, 'rgba(255,255,255,.18)');
  const visorDown = b.state === 'stun';
  ctx.fillStyle = '#111'; ctx.fillRect(f > 0 ? 2 : -14, visorDown ? 5 : 1, 12, visorDown ? 9 : 4);
  if (!visorDown) { ell(f * 7, 3, 1.4, 1.4, '#ff3b3b'); ell(f * 11, 3, 1.4, 1.4, '#ff3b3b'); }
  ctx.fillStyle = '#3d3d4a'; ctx.fillRect(-2, -14, 4, 4);
  if (visorDown) for (let i = 0; i < 3; i++) { const a = frame * 0.1 + i * 2.1; ell(Math.cos(a) * 14, -14 + Math.sin(a) * 3, 2, 2, '#ffcf4a'); }
  ctx.restore();
  // health pips above
  for (let i = 0; i < b.maxHp; i++) ell(x + 13 - (b.maxHp - 1) * 3.5 + i * 7, y - 18, 2.5, 2.5, i < b.hp ? '#ff6b6b' : 'rgba(0,0,0,.25)');
}

function drawPlaid() {

function drawGoal() {

function drawHamster(px, py, face, sq, step, fluff, inv, ground) {
  if (inv > 0 && Math.floor(inv / 4) % 2 === 0) return;
  const cx = px + 6, by = py + 12;
  const fl = 0.55 + 0.45 * Math.min(1, fluff / MAX_FLUFF); // fluff makes you rounder
  const rx = 8 * fl / sq * (sq < 1 ? 1.1 : 1), ry = 7 * fl * sq;
  ctx.save(); ctx.translate(cx, by); ctx.scale(face, 1);
  // feet
  const s = ground ? Math.sin(step) * 2 : 1;
  ell(-3 + s, -0.8, 2.4, 1.4, '#e98f7a'); ell(3 - s, -0.8, 2.4, 1.4, '#e98f7a');
  // tail tuft
  ell(-rx + 0.5, -ry * 0.8, 2, 2, '#f7d9b0');
  // body with fluffy rim
  for (let i = 0; i < 10; i++) { const a = i / 10 * Math.PI * 2; ell(Math.cos(a) * rx * 0.85, -ry + Math.sin(a) * ry * 0.85, 2.6, 2.6, '#f2a65a'); }
  ell(0, -ry, rx, ry, '#f2a65a');
  ell(2, -ry * 0.75, rx * 0.65, ry * 0.6, '#fff1d6');
  // ear
  ell(2, -ry * 2 + 1.5, 2.6, 2.6, '#e07b5a'); ell(2, -ry * 2 + 1.8, 1.4, 1.4, '#f7b7a3');
  // face
  ell(rx * 0.55, -ry * 1.2, 1.4, 1.7, '#2b1d14'); ell(rx * 0.6, -ry * 1.3, 0.5, 0.5, '#fff');
  ell(rx * 0.95, -ry * 0.95, 1.1, 0.9, '#e2475b');
  ell(rx * 0.35, -ry * 0.85, 2, 1.3, 'rgba(255,120,140,.45)');
  ctx.restore();
}

function txt(s, x, y, size, col, align = 'center', font = 'display') {
  ctx.font = `${size}px ${font === 'display' ? '"Lilita One", "Trebuchet MS", sans-serif' : '800 ' + '"Nunito", system-ui, sans-serif'}`;
  if (font !== 'display') ctx.font = `800 ${size}px "Nunito", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(2, size / 5); ctx.strokeStyle = '#1b1430'; ctx.lineJoin = 'round';
  ctx.strokeText(s, x, y); ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function drawHUD() {
  for (let i = 0; i < MAX_FLUFF; i++) {
    const on = i < P.fluff;
    const hx = 14 + i * 13;
    const danger = P.fluff === 1 && MAX_FLUFF > 1 && state === 'play';
    if (on && danger) ell(hx, 14, 7.5 + Math.sin(frame * 0.3), 7.5 + Math.sin(frame * 0.3), 'rgba(255,107,107,.7)');
    ell(hx, 14, 5.5, 5.5, on ? '#fff6e6' : 'rgba(255,255,255,.2)');
    if (on) { ell(hx - 2.5, 12, 2.6, 2.6, '#fff'); ell(hx + 2.5, 15, 2.6, 2.6, '#f7e8cf'); }
  }
  txt('FLUFF', 14 + MAX_FLUFF * 13 + 2, 14, 10, '#fff4e0', 'left', 'body');
  if (P.revives > 0) txt('♥ REVIVES × ' + P.revives, 14, 30, 9, '#ff8fb1', 'left', 'body');
  if (meta.up.dash) { rrect(14, 40, 40, 3, 1.5, 'rgba(255,255,255,.2)'); rrect(14, 40, 40 * (1 - P.dashCd / dashCdMax()), 3, 1.5, P.dashCd > 0 ? '#b7a9d6' : '#ff8fb1'); }
  ctx.save(); ctx.translate(W - 74, 14); ctx.rotate(0.5); ell(0, 0, 3, 5, '#3b2f2a'); ell(0, 0, 1.4, 4, '#f2e6c9'); ctx.restore();
  txt('× ' + run.seeds, W - 66, 14, 13, '#ffcf4a', 'left');
  // progress bar
  const pw = 120, px = W / 2 - pw / 2;
  rrect(px, 9, pw, 6, 3, 'rgba(27,20,48,.5)');
  rrect(px, 9, Math.max(6, pw * progress() / 100), 6, 3, '#ffcf4a');
  ell(px + pw, 12, 4, 4, '#ffcf4a');
  txt('WORLD ' + world + ' · ' + theme().name, W / 2, 26, 10, '#fff4e0', 'center', 'body');
  if (boss && boss.awake && boss.alive && state === 'play') {
    const bw = 160, bx = W / 2 - bw / 2, by = H - 26;
    txt(boss.kind === 'bee' ? 'ADMIRAL BUZZKILL' : 'COMMANDER BUCKETFACE', W / 2, by - 8, 10, '#ff8fb1');
    rrect(bx, by, bw, 6, 3, 'rgba(27,20,48,.6)');
    rrect(bx, by, Math.max(4, bw * boss.hp / boss.maxHp), 6, 3, '#ff6b6b');
  }
  const owned = PERKS.filter(p => pk(p.id)).map(p => p.name + (pk(p.id) > 1 ? ' ×' + pk(p.id) : ''));
  if (owned.length) { txt(owned.join(' · '), 10, H - 9, 8, '#fff4e0', 'left', 'body'); }
}

function panel(h) {
  ctx.fillStyle = 'rgba(27,20,48,.72)'; ctx.fillRect(0, 0, W, H);
  rrect(W / 2 - 170, H / 2 - h / 2, 340, h, 14, '#2c2147');
}

function draw() {
  ctx.save();
  if (shake > 0.5) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground();
  if (state === 'title') {
    drawTitle(); ctx.restore(); return;
  }
  if (state === 'shop') { ctx.restore(); drawShop(); return; }
  drawGoal();
  drawTiles();
  if (world === 1) drawSign(start.x + 46 - cam, 14 * TS);
  seeds.forEach(drawSeed);
  traps.forEach(drawTrap);
  enemies.forEach(drawEnemy);
  drawBoss();
  if (state !== 'dead') drawHamster(P.x - cam, P.y, P.face, P.sq, P.step, P.fluff, P.inv, P.ground);
  if (state !== 'dead' && P.shield > 0) { ctx.strokeStyle = `rgba(143,227,255,${0.6 + 0.2 * Math.sin(frame * 0.15)})`; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(P.x - cam + 6, P.y + 5, 12, 0, Math.PI * 2); ctx.stroke(); }
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life / p.max * 1.5); ell(p.x - cam, p.y, p.r, p.r, p.col); }
  ctx.globalAlpha = 1;
  for (const f of floaters) { ctx.globalAlpha = Math.min(1, f.life / 20); txt(f.txt, f.x - cam + 6, f.y, 10, f.col); }
  ctx.globalAlpha = 1;
  ctx.restore();
  drawPlaid();
  drawHUD();
  if (muted) txt('MUTED', W - 8, H - 10, 9, '#b7a9d6', 'right', 'body');
  if (state === 'dead' && endTimer > 25) drawEnd(false);
  if (state === 'perk') drawPerk();
  if (paused) {
    ctx.fillStyle = 'rgba(27,20,48,.6)'; ctx.fillRect(0, 0, W, H);
    txt('PAUSED', W / 2, H / 2 - 10, 32, '#ffcf4a');
    txt('Press P, Space or tap to keep squeaking', W / 2, H / 2 + 20, 11, '#fff4e0', 'center', 'body');
  }
  if (state === 'win' && endTimer > 40) drawEnd(true);
}

function drawEnd(won) {
  panel(170);
  const cy = H / 2 - 85;
  txt(won ? 'YOU MADE IT!' : 'RUN OVER', W / 2, cy + 28, 30, won ? '#ffcf4a' : '#ff6b6b');
  ctx.font = '800 12px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff4e0';
  ctx.fillText(won ? 'Captain Squeaks saves the Golden Sunflower. Sequel pending.' : deathMsg, W / 2, cy + 56);
  const stats = [['SEEDS', run.seeds], ['SQUISHED', run.stomps], ['WORLD', world + ' · ' + progress() + '%'], ['BEST WORLD', meta.bestWorld || 1]];
  stats.forEach(([k, v], i) => {
    const x = W / 2 - 120 + i * 80;
    txt(String(v), x, cy + 86, 18, '#fff4e0');
    ctx.font = '800 8px "Nunito", system-ui, sans-serif'; ctx.fillStyle = '#b7a9d6'; ctx.fillText(k, x, cy + 102);
  });
  ctx.font = '800 10px "Nunito", system-ui, sans-serif'; ctx.fillStyle = '#b7a9d6';
  ctx.fillText(`Seeds to spend: ${meta.bank}`, W / 2, cy + 122);
  if (endTimer > 40 && Math.floor(endTimer / 30) % 2 === 0) txt('SPACE / TAP FOR THE SEED SHOP', W / 2, cy + 148, 13, '#ffcf4a');
}

function drawPerk() {
  panel(200);
  txt('WORLD ' + world + ' CLEARED!', W / 2, 54, 26, '#ffcf4a');
  ctx.font = '800 10px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#b7a9d6';
  ctx.fillText('Pick a power-up for this run. +1 fluff restored. It gets harder from here.', W / 2, 76);
  perkRects = [];
  const cw = 100, ch = 96, gap = 10, x0 = W / 2 - (cw * 3 + gap * 2) / 2, y0 = 92;
  perkChoices.forEach((p, i) => {
    const x = x0 + i * (cw + gap), sel = i === perkSel;
    perkRects.push({ x, y: y0, w: cw, h: ch });
    rrect(x, y0, cw, ch, 10, sel ? '#4a3a78' : '#1b1430');
    if (sel) { ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, y0 + 1, cw - 2, ch - 2, 9); ctx.stroke(); }
    txt(p.name, x + cw / 2, y0 + 22, 12, sel ? '#ffcf4a' : '#fff4e0');
    ctx.font = '600 9px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#d9cff0';
    const words = p.desc.split(' '); let line = '', ly = y0 + 46;
    for (const w of words) { if (ctx.measureText(line + w).width > cw - 16) { ctx.fillText(line.trim(), x + cw / 2, ly); line = ''; ly += 12; } line += w + ' '; }
    ctx.fillText(line.trim(), x + cw / 2, ly);
    if (pk(p.id)) { ctx.font = '800 8px "Nunito", system-ui, sans-serif'; ctx.fillStyle = '#b6f27a'; ctx.fillText('You have ' + pk(p.id), x + cw / 2, y0 + ch - 10); }
  });
  if (endTimer > 30 && Math.floor(endTimer / 30) % 2 === 0) txt('ARROWS + SPACE, OR TAP A CARD', W / 2, y0 + ch + 16, 11, '#ffcf4a');
}

function drawShop() {
  ctx.fillStyle = '#1b1430'; ctx.fillRect(0, 0, W, H);
  txt('SEED SHOP', 16, 22, 24, '#ffcf4a', 'left');
  ctx.save(); ctx.translate(W - 92, 22); ctx.rotate(0.5); ell(0, 0, 4, 6.5, '#3b2f2a'); ell(0, 0, 1.8, 5, '#f2e6c9'); ctx.restore();
  txt(String(meta.bank), W - 82, 22, 20, '#fff4e0', 'left');
  ctx.font = '800 9px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#b7a9d6';
  ctx.fillText('Galactic Seed Emporium · no refunds', 140, 23);
  shopRects = [];
  const cw = 220, ch = 44, gx = 12, gy = 6, x0 = (W - cw * 2 - gx) / 2, y0 = 40;
  for (let i = 0; i <= UPGRADES.length; i++) {
    const col = i % 2, row = Math.floor(i / 2);
    const x = x0 + col * (cw + gx), y = y0 + row * (ch + gy);
    shopRects.push({ x, y, w: cw, h: ch });
    const sel = i === shopSel;
    if (i === UPGRADES.length) {
      rrect(x, y, cw, ch, 10, sel ? '#ffcf4a' : '#3a2c5e');
      if (sel) { ctx.font = '16px "Lilita One", "Trebuchet MS", sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#1b1430'; ctx.fillText('START NEXT RUN ▶', x + cw / 2, y + ch / 2 + 1); }
      else txt('START NEXT RUN ▶', x + cw / 2, y + ch / 2 + 1, 16, '#ffcf4a');
      continue;
    }
    const u = UPGRADES[i], lvl = meta.up[u.id], cost = upCost(u), afford = cost !== null && meta.bank >= cost;
    rrect(x, y, cw, ch, 10, sel ? '#4a3a78' : '#2c2147');
    if (sel) { ctx.strokeStyle = '#ffcf4a'; ctx.lineWidth = 2; ctx.beginPath(); ctx.roundRect(x + 1, y + 1, cw - 2, ch - 2, 9); ctx.stroke(); }
    txt(u.name, x + 10, y + 13, 12, cost === null ? '#b6f27a' : '#fff4e0', 'left');
    for (let k = 0; k < u.costs.length; k++) ell(x + 10 + ctx.measureText(u.name).width + 10 + k * 9, y + 13, 3, 3, k < lvl ? '#b6f27a' : 'rgba(255,255,255,.18)');
    ctx.font = '600 8.5px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'left'; ctx.fillStyle = '#b7a9d6';
    ctx.fillText(u.desc, x + 10, y + 31);
    ctx.font = '800 11px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'right';
    ctx.fillStyle = cost === null ? '#b6f27a' : afford ? '#ffcf4a' : '#ff6b6b';
    ctx.fillText(cost === null ? 'MAX' : cost + ' seeds', x + cw - 10, y + 13);
  }
  if (shopMsgT > 0) { shopMsgT--; ctx.globalAlpha = Math.min(1, shopMsgT / 20); txt(shopMsg, W / 2, H - 14, 11, '#fff4e0', 'center', 'body'); ctx.globalAlpha = 1; }
  else { ctx.font = '800 9px "Nunito", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = '#b7a9d6'; ctx.fillText('Arrows to choose · Space to buy · or tap a card', W / 2, H - 14); }
}

function drawTitle() {
  ctx.fillStyle = '#5fb84a'; ctx.fillRect(0, 224, W, 5);
  ctx.fillStyle = '#8a5a3b'; ctx.fillRect(0, 229, W, 43);
  const b = Math.abs(Math.sin(frame * 0.06)) * 18;
  ctx.save(); ctx.translate(W / 2 - 18, 224 - 12 * 2.2 - b); ctx.scale(2.2, 2.2);
  drawHamster(0, 0, 1, 1 + Math.sin(frame * 0.12) * 0.06, frame * 0.2, MAX_FLUFF, 0, true);
  ctx.restore();
  txt('REVIVER', W / 2, 70, 56, '#ffcf4a');
  txt('starring Captain Squeaks, fluffiest pilot in the galaxy', W / 2, 106, 13, '#fff4e0', 'center', 'body');
  if (Math.floor(frame / 30) % 2 === 0) txt('PRESS SPACE OR TAP TO START', W / 2, 140, 14, '#fff4e0');
  if (meta.runs) txt(`Runs: ${meta.runs}   Best world: ${meta.bestWorld || 1}   Seeds to spend: ${meta.bank}`, W / 2, 256, 10, '#fff4e0', 'center', 'body');
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
makeWorld(1); buildLevel();
P = { x: start.x, y: start.y, w: 12, h: 12, fluff: 3, inv: 0 };
run = { seeds: 0, stomps: 0, maxX: 0, time: 0 };
resize();
cvs.focus();
requestAnimationFrame(loop);
window.__reviver = { get paused() { return paused; }, get world() { return world; }, get perkChoices() { return perkChoices; }, nextWorld, get boss() { return boss; }, meta, get shopSel() { return shopSel; }, get state() { return state; }, get P() { return P; }, get goal() { return goal; }, newRun, die, get run() { return run; } };
})();
</script>
