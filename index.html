<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RobAu pages</title>
<style>
:root{--bg:#f6f3ea;--fg:#1d1b16;--muted:#6b665a;--accent:#9a6b1f}
@media (prefers-color-scheme:dark){:root{--bg:#0f1817;--fg:#efe8d4;--muted:#a3b3aa;--accent:#e3b04b}}
body{margin:0;padding:48px 16px;background:var(--bg);color:var(--fg);font:17px/1.5 Georgia,'Times New Roman',serif}
main{max-width:560px;margin:0 auto}
h1{font-weight:500;font-size:28px;margin:0 0 24px}
ul{list-style:none;padding:0;margin:0}
li{padding:12px 0;border-top:1px solid color-mix(in srgb,var(--fg) 15%,transparent)}
a{color:var(--accent);font-size:20px;text-decoration:none}
a:hover{text-decoration:underline}
p{margin:2px 0 0;color:var(--muted);font-size:15px}
</style>
</head>
<body>
<main>
<h1>Pages</h1>
<ul>
<li><a href="tinyhold/">Tinyhold</a><p>A hamlet that builds itself. Watch a valley settle, grow and squabble; follow a villager or click a building to see what it does.</p></li>
</ul>
</main>
</body>
</html>
