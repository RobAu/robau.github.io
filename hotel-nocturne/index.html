  let mach='';for(let i=0;i<5;i++)mach+=`<g transform="translate(${70+i*150},300)"><rect width="120" height="140" fill="#b0663a"/><circle cx="60" cy="74" r="40" fill="#2a1a14" stroke="#cfa651" stroke-width="6"/><circle cx="60" cy="74" r="28" fill="#3a5a6a" opacity=".6" class="${i%2?'spin':''}"/><circle cx="20" cy="18" r="5" fill="#cfa651"/></g>`;
  return svg(`<rect width="800" height="450" fill="#1a1416"/><path d="M0 64 Q400 90 800 64" stroke="#5a4a3a" stroke-width="3" fill="none"/>${sheets}${mach}
  ${o.sock?'<path d="M400 440 q0 -20 14 -20 h14 v-20 h12 v34 q0 6 -6 6Z" fill="#8a8a8a"/>':''}`)};
P.shop=(o={})=>{let globes='';for(let i=0;i<6;i++){const x=90+i*80;globes+=`<g transform="translate(${x},${i<3?150:250})"><rect x="-20" y="18" width="40" height="14" fill="#5a3a24"/><circle r="26" fill="#cfe8ef" opacity=".35"/><path d="M-10 18 v-16 l10 -10 l10 10 v16z" fill="#2a1a20"/><circle r="26" fill="none" stroke="#efe2cc" stroke-opacity=".5"/>${[...Array(5)].map((_,k)=>`<circle cx="${(k*9)%30-14}" cy="${(k*13)%24-12}" r="1.6" fill="#fff" class="twinkle"/>`).join('')}</g>`}
  return svg(`<rect width="800" height="450" fill="#21161c"/><rect x="40" y="186" width="480" height="8" fill="#5a3a24"/><rect x="40" y="286" width="480" height="8" fill="#5a3a24"/>${globes}
  <path d="M400 0 V60" stroke="#444"/><circle cx="400" cy="70" r="10" fill="#ffd27a" class="neon"/><circle cx="400" cy="70" r="160" fill="url(#glowW)" opacity=".25" class="neon"/>
  <g transform="translate(640,80)"><rect width="120" height="340" fill="#a3202c"/><rect x="10" y="40" width="100" height="280" fill="#2a1a20"/>${[...Array(6)].map((_,i)=>`<path d="M10 ${86+i*44} H110" stroke="#a3202c" stroke-width="5"/>`).join('')}<rect x="10" y="8" width="100" height="22" fill="#111"/><text x="60" y="24" text-anchor="middle" font-family="DM Mono,monospace" font-size="11" fill="#efe2cc">TELEPHONE</text><circle cx="60" cy="150" r="40" fill="url(#glowW)" opacity=".5"/></g>
  <g transform="translate(560,420)"><path d="M-22 0 L-18 -110 H18 L22 0Z" fill="#c9b8a8"/><circle cy="-130" r="20" fill="#d9c8b8"/><rect x="14" y="-142" width="22" height="12" fill="#efe2cc" transform="rotate(20 14 -142)"/></g>
  ${o.hat?'<g transform="translate(300,350)"><ellipse rx="50" ry="10" fill="#2a1a2a"/><rect x="-30" y="-50" width="60" height="50" fill="#2a1a2a"/><rect x="-30" y="-16" width="60" height="8" fill="#8f2f45"/></g>':''}`)};

/* ---- the lift ---- */
X('lift','The lift','x',[
  'A brass cage lift clanks open. Inside, a lift boy in a pillbox hat stands at the controls. He is mostly freckles and partly fog.',
  q('Evening. Fitz, lift operator,')+' he says. '+q('Floors are a bit unusual tonight. Mind the gap. The gap bites.'),
  'The panel of buttons is longer than any building needs, and one red lever at the bottom is labelled, in very firm capitals, <b>NEVER</b>.'],[
  ['Floor 7: the Attic of Lost Things, where everything anyone ever misplaced ends up','attic'],
  ['Floor 4: the Rooftop Pool, which the sign says is “filled with night”','pool'],
  ['Floor 3: Room 14, the room everyone complains about','room14'],
  ['Floor 2: the Portrait Gallery, where the paintings follow you with their eyes','gallery'],
  ['Floor 1½: the Conservatory, which smells of jungle and something hungry','conserv'],
  ['Floor B2: the Steam Baths and Spa','spa'],
  ['Floor B3: the Laundry, rumbling like a thunderstorm in a basement','laundry'],
  ['Floor G: the Gift Shop, with a red telephone booth in the corner','shop'],
  ['Ask Fitz where he would go, if he could go anywhere','liftboy',5],
  ['Pull the red lever marked NEVER, because you have never been good at rules','lever',5],
  ['Step back out into the Grand Corridor','hall',5]]);
SC.lift.pic=()=>P.lift();

X('liftboy','Fitz','x',[q('Me?')+' Fitz blinks. '+q('Nobody’s asked me that since 1938.')+' He leans in. '+q('There’s a button hidden under the panel. Floor Infinity. I’ve never dared press it. Also I was meant to go to the World’s Fair, once. The lift got stuck between floors, and so did I.')],[
  ['Find the hidden button and press Floor Infinity together','liftinf'],
  ['Offer to run the lift for a while so Fitz can finally take a break','end_liftswap'],
  ['Promise to get him to a World’s Fair, somehow, tonight','end_worldsfair'],
  ['Pat him on the shoulder and pick a floor instead','lift',5]]);
SC.liftboy.pic=()=>P.lift({lit:10});
X('liftinf','Floor Infinity','x',['The lift rises. Past the roof. Past the clouds. Past what looks like a very surprised satellite. The floor numbers on the dial stop being numbers and start being colours.',q('I think,')+' Fitz whispers, '+q('we should decide what to do before we run out of up.')],[
  ['Open the gate and step out onto the top of the sky','end_skytop'],
  ['Sit down on the floor, eat a mint, and just keep going','end_express'],
  ['Hit the emergency stop button, hard','end_betweenfloors']]);
SC.liftinf.pic=()=>P.lift({sky:1,lit:10});
E('liftswap','Going Up',()=>P.lift(),'Fitz hands you his pillbox hat with shaking hands, steps out of the lift and walks straight through the front door into the night. You hear him laughing all the way down the hill.','You run the lift now. You learn every floor, including the ones that are only there on Thursdays. Fitz sends postcards from the seaside. He has learned to swim.');
E('worldsfair','World’s Fair',()=>P.lift({fall:1}),'You grab the lift controls and push them sideways, which lifts should not do. The lift does it anyway, out of sheer surprise.','The doors open onto a sunny day in 1939: flags, a giant metal globe, the smell of popcorn. Fitz screams with joy. You both stay. You never quite get the hang of the money.');
E('skytop','Top Floor',()=>P.coast(),'You step out onto a cloud. It holds. Up here the sun never quite sets and the neighbours are geese.','You rent a small cloud with a view and grow tomatoes in the rain. The rent is reasonable. The commute is terrible.');
E('express','Express Service',()=>P.lift({sky:1,lit:10}),'You keep going up. And up. Fitz finds a radio under the panel that only plays songs nobody has written yet.','It has been eleven years. You are still going up. Honestly, it’s the most relaxing job you’ve ever had.');
E('betweenfloors','Between Floors',()=>P.lift(),'The lift shudders to a halt somewhere between Infinity and Infinity Minus One.','You and Fitz play I Spy. It is round eight thousand. Fitz is winning, mostly because he keeps choosing “fog”.');

X('lever','NEVER','x',['Fitz grabs your wrist. '+q('Not NEVER! Anything but NEVER!'),'Too late. The lift drops like a stone down a well, whistling cheerfully. The dial spins past B3, B30, B300. As you fall, five buttons light up on the panel, each flashing for attention.'],[
  ['Slap the button marked CORE','end_core'],
  ['Slap the button marked AUSTRALIA','end_australia'],
  ['Slap the button marked YESTERDAY','end_yesterday'],
  ['Slap every single button at once with both hands','end_everyfloor'],
  ['Forget the buttons, hug Fitz and hope for the best','end_liftfriends']]);
SC.lever.pic=()=>P.lift({fall:1,lit:0});
E('core','Centre of the Earth',()=>P.basement(),'The doors open at the centre of the Earth, where there is another hotel. A much nicer one. It has a lava spa and the staff are all very polite rocks.','You transfer your booking. The room is warm. Everything is warm. It is the best sleep of your life.');
E('australia','Upside Down',()=>P.coast(),'The lift comes out of the ground in a dusty field in Australia. You step out upside down and it takes three years to get used to.','You open a little café called Nocturne. It only opens at night. It is extremely popular with bats.');
E('yesterday','Yesterday',()=>P.meadow({car:1}),'The doors open on yesterday morning. Your car hasn’t broken down yet. It’s parked outside your house, gleaming.','You take the train instead. You sit next to someone lovely. You never know what you avoided, but sometimes, in storms, you think of a cat in a waistcoat and you don’t know why.');
E('everyfloor','Every Floor at Once',()=>P.hall(),'The lift stops at every floor at the same time, and so do you.','You exist everywhere in the hotel at once: in the kitchen, the pool, the gallery, the laundry. It’s confusing. But you are now extremely good at parties.');
E('liftfriends','Lift Friends',()=>P.meadow({car:1}),'You hug. The lift, embarrassed, stops falling and quietly delivers you to the ground floor.','Fitz decides that if he can survive NEVER, he can survive outside. The two of you open a lift repair business in the real world. Four and a half stars on every review site. Customers say Fitz is “a bit foggy but very sweet”.');

/* ---- attic ---- */
X('attic','The Attic of Lost Things','x',['Floor 7 is an attic so big it has its own weather. Everything anyone ever lost ends up here. Odd socks lie in drifts like snow. Umbrellas roost in the rafters like bats. There is a mountain of car keys.','A hand-painted sign says <b>LOST PROPERTY. FINDERS KEEPERS. KEEPERS STAY.</b>'],[
  ['Dig into the snowdrifts of odd socks, looking for a matching pair','socks'],
  ['Follow the sound of quiet sobbing to a heap of lost toys','toys'],
  ['Go looking for something that you, personally, once lost','yourlost'],
  ['Open one of the umbrellas roosting in the rafters','end_umbrella'],
  ['Get back in the lift before you lose something else','lift',5]]);
SC.attic.pic=()=>P.attic();
X('socks','Sock drifts','x',['You dig. Socks from every century. Stripy ones, woolly ones, one sock that is clearly a medieval chainmail sock. Deep in the drift your hand hits something wooden.','It’s a small door, made entirely of socks, with a sock for a doorknob.'],[
  ['Turn the sock doorknob and go through','end_sockland'],
  ['Ignore the door and keep digging for a matching pair, however long it takes','end_matched'],
  ['Climb out of the drift and back away','attic',5]]);
SC.socks.pic=()=>P.attic();
E('sockland','The Land of Odd Socks',()=>P.attic(),'Beyond the door is a kingdom where every lost sock lives free. They have been waiting for a leader with two feet.','They crown you. The crown is a sock. You rule wisely and wear sandals to state occasions out of respect.');
E('matched','A Perfect Pair',()=>P.attic(),'You dig for forty years. And then, one Tuesday, you find them: two socks, identical, the same stripe, the same tiny hole.','It is the greatest moment in the history of the attic. Everyone gathers to watch you put them on. They are slightly damp. You cry anyway.');
X('toys','The lost toys','x',['A one-eyed teddy bear sits on a rocking horse, sobbing into its paws. '+q('Nobody comes for us,')+' it sniffs. '+q('Not in sixty years.'),'All around, the other lost toys look up at you hopefully: a tin soldier, a rag doll, a wind-up mouse with a rusty key.'],[
  ['Promise them you’ll find every one of their children','toys2'],
  ['Stand on a box and give a stirring speech about toys’ rights','end_toyrebel'],
  ['Pick up the bear and give it the biggest hug you can','end_bearhug']]);
SC.toys.pic=()=>P.attic({bear:1});
X('toys2','A heavy basket','x',['You pile every toy into a laundry basket. It is very heavy. The bear sits on top, looking pleased.','Then it says, quietly: '+q('You do know they’re all grown-ups now? Some of them have grown-ups of their own.')],[
  ['Deliver them anyway, door to door, all over the world','end_toydelivery'],
  ['Open a toy shop where the toys choose their new children','end_toyshop'],
  ['Put the basket down, apologise, and back away','attic',5]]);
SC.toys2.pic=()=>P.attic({bear:1});
E('toyrebel','The Nursery Uprising',()=>P.attic({bear:1}),'Your speech is so stirring that the toys march downstairs in formation. Pemberton surrenders to a wind-up soldier at 2:15 AM.','You are made General of the Toy Army. Your first order is bedtime stories for everyone. It is a popular order.');
E('bearhug','Hug Retention',()=>P.attic({bear:1}),'The hug lasts so long that you both fall asleep.','You wake up as a well-loved toy on a shelf in a child’s bedroom in 2040. The child takes you everywhere. One of your ears is a bit chewed. You have never been happier.');
E('toydelivery','Special Delivery',()=>P.attic({bear:1}),'You spend a year returning toys to grown-ups: a fisherman in Norway, a judge in Toronto, a grandmother in Peru.','Every single one of them cries. You end up on the news. The bear goes back to a man called Derek, who now sleeps with it every night and isn’t embarrassed at all.');
E('toyshop','Second-Hand Smiles',()=>P.attic({bear:1}),'You open a little shop where the toys pick their own children, not the other way round.','There is a queue round the block every Saturday. The bear does the accounts. It is surprisingly strict about it.');
X('yourlost','Aisle Four','x',['You think hard about what you’ve lost over the years. A sign drops from the rafters on a chain: <b>AISLE 4: YOURS</b>.','The shelves in Aisle 4 hold three things with your name on them.'],[
  ['Take down the jar labelled “Sense of Direction”','end_direction'],
  ['Take down the box labelled “Childhood Courage (age 9)”','end_courage'],
  ['Take down the keys you lost in 2019 and swore you put somewhere safe','end_keys2019'],
  ['Leave Aisle 4 alone, some things are lost for a reason','attic',5]]);
SC.yourlost.pic=()=>P.attic();
E('direction','Found: Sense of Direction',()=>P.coast(),'You open the jar and your sense of direction leaps back inside you.','You never get lost again. You walk straight out of the attic, the hotel, and the county, and become a famous explorer. Your car is still at mile 31.');
E('courage','Brave Again',()=>P.lobby(),'Your childhood courage fits like a glove. You march downstairs and ask Pemberton for a refund. He is so stunned that he gives you one.','Then you go home, quit your job, and become a lion tamer. The lions find you hilarious.');
E('keys2019','The Spare Key',()=>P.room(),'The keys fit the attic door. You open it and step straight into your own kitchen, in 2019, with toast in the toaster.','You decide to make much better choices this time round. You do not. But the toast is excellent.');
E('umbrella','Fair Weather',()=>P.coast(),'The umbrella opens with a snap, and every other umbrella in the rafters opens too. They lift you up and out through a skylight.','You drift for days and land in a city where it always rains. Everyone there loves umbrellas. You are a celebrity.');

/* ---- rooftop pool ---- */
X('pool','The Rooftop Pool','x',['The roof has a swimming pool, and the water in it is the night sky. Stars glitter on the bottom. A comet drifts lazily across the deep end.','A lifeguard sits in a tall chair. The lifeguard is a large grey heron with a whistle.'],[
  ['Take a run-up and dive straight into the starry water','pooldive'],
  ['Wave to the heron lifeguard and strike up a conversation','heron'],
  ['Lie down on a sunlounger and look up at the sky','lounger'],
  ['Go back to the lift, slightly damp with starlight','lift',5]]);
SC.pool.pic=()=>P.pool();
X('pooldive','Starwater','x',['You plunge in. It isn’t wet. It’s cold and fizzy and goes on forever. You’re floating among the stars, and the hotel is a tiny lit thing far above you. Or below. Hard to say.','Far off, a strange green light pulses slowly.'],[
  ['Swim toward the Moon, which turns out to be closer than you thought','end_moonbath'],
  ['Grab the comet’s tail as it swims past','end_comet'],
  ['Swim down, toward the green light','pooldeep'],
  ['Paddle back to the edge and climb out','pool',10]]);
SC.pooldive.pic=()=>P.pool({green:1,noheron:1});
X('pooldeep','The green light','x',['The green light is a lighthouse, floating in space. On the gallery stands a keeper who looks exactly like you, but much older, and with an excellent beard (whether or not you have ever had one).',q('Ah. There you are,')+' says the old you. '+q('Right on time.')],[
  ['Ask your older self for one piece of advice','end_notetoself'],
  ['Offer to take over the lighthouse so the old you can rest','end_spacelight'],
  ['Swim away, this is far too weird','pooldive',10]]);
SC.pooldeep.pic=()=>P.pool({green:1,noheron:1});
E('moonbath','Moonbather',()=>P.pool({noheron:1}),'The Moon has a beach. Nobody told you.','You stay. You get silver tan lines. Astronauts are very surprised to find a deckchair.');
E('comet','Comet Rider',()=>P.coast(),'You hang on to the comet’s tail. You visit Saturn’s rings, a very lonely asteroid, and the far edge of the solar system.','You come back seventy-six years later. Nobody believes you, except Pemberton, who just says '+q('Ah, Halley’s. Lovely in spring.'));
E('notetoself','Note to Self',()=>P.meadow(),q('Stop worrying,')+' says the old you. '+q('Call your sister. Buy the boat.'),'You swim back, climb out, drive home, and do all three. The boat is excellent. Your sister helps you name it.');
E('spacelight','Keeper of the Light',()=>P.pool({green:1,noheron:1}),'The old you hands over the keys and swims off toward a nice warm star.','You guide lost satellites home. It’s quiet, and a bit lonely, and very, very beautiful.');
X('heron','The lifeguard','x',['The heron peers down at you. '+q('No running. No bombing. No wishing in the deep end.'),'It says this in the voice of someone who has said it ten thousand times.'],[
  ['Ask why on earth wishing is against the rules','herona',5],
  ['Challenge the heron to a race, two lengths, freestyle','end_race'],
  ['Thank it and leave it alone','pool',5]]);
SC.heron.pic=()=>P.pool();
X('herona','No wishing','x',[q('Because wishes come true in here, obviously,')+' sighs the heron. '+q('And then there’s the paperwork.'),'It looks at the deep end. It looks at you. It shrugs. '+q('Go on, then. One. Make it quick.')],[
  ['Wade in and wish to be rich','end_rich'],
  ['Wade in and wish to be at home, in your own bed','end_home'],
  ['Wade in and wish for the heron to have a day off','end_heronday']]);
SC.herona.pic=()=>P.pool();
E('rich','Filthy Rich',()=>P.pool(),'Gold coins pour down on you from nowhere. A lot of gold coins. The heron has to fish you out from under them.','You are extremely rich and slightly flattened. You buy the hotel a better lift. Fitz cries.');
E('home','Home Sweet Home',()=>P.room(),'You blink and you’re in your own bed, in your own pyjamas, with your own alarm going off.','Was it all a dream? Probably. Except there is a grey heron feather on your pillow, and it smells of stars.');
E('heronday','Lifeguard Duty',()=>P.pool({noheron:1}),'The heron grins, which is hard to do with a beak, and flies off to a pond somewhere warm.','You’re the lifeguard now, forever. The whistle suits you. You are very strict about wishing.');
E('race','Personal Best',()=>P.pool(),'You lose to the heron by a beak. So you train. For two hundred years.','And then, one night, you win. The heron shakes your hand with its wing. You both retire to a pond together and never race again.');
X('lounger','The sunlounger','x',['The lounger is warm, as if it has been waiting for you. Shooting stars streak overhead, one every few seconds, each one hissing softly like a struck match.','One flies so low you could almost reach up and touch it.'],[
  ['Start counting the shooting stars, just to see how many there are','end_countstars'],
  ['Reach up and catch the next low one','end_catchstar'],
  ['Get up before you get too comfortable','pool',5]]);
SC.lounger.pic=()=>P.pool({lounger:1});
E('countstars','Counting Stars',()=>P.meadow(),'You count to one million and two and fall asleep with a smile.','You wake on an empty hilltop at noon. No hotel. No pool. You are the most relaxed you have ever been in your life.');
E('catchstar','Pocketful of Starlight',()=>P.pool({lounger:1}),'You catch it. It burns a hole in your pocket, and then in your whole life, in a good way: everything you touch glows faintly afterwards.','You become a famous designer of night lights. Children all over the world sleep better because of you.');

/* ---- room 14 ---- */
X('room14','Room 14','x',['Sea shanties come through the wall of Room 14, very loudly. The door opens before you knock.','Inside: a ship’s wheel, a hammock, sand on the carpet, and a pirate ghost with a parrot skeleton on her shoulder. '+q('Captain Mabel Grisly! Ye’ve come about the noise, have ye?')],[
  ['Complain about the noise, firmly but politely','mabelcomplain'],
  ['Ask if she has room on her crew for one more','mabelcrew'],
  ['Ask about the treasure map pinned to the wall','mabelmap'],
  ['Try to teach the parrot skeleton to talk','end_parrot'],
  ['Back away to the lift, closing the door quietly','lift',5]]);
SC.room14.pic=()=>P.room14();
X('mabelcomplain','A complaint','x',['Mabel’s eyes narrow. '+q('Nobody complains to Grisly. Nobody but me mother.')+' Then her lip trembles. '+q('Ye remind me of me mother.')],[
  ['Tell her it’s past her bedtime, in your best mum voice','end_bedtime'],
  ['Put up your fists and challenge her to a duel','end_plank'],
  ['Out-sing her: start a louder shanty of your own','end_shanty']]);
SC.mabelcomplain.pic=()=>P.room14();
E('bedtime','Lights Out, Captain',()=>P.room14(),'You tuck her into the hammock and read her a story about a brave little rowing boat. She falls asleep for the first time in three hundred years, and fades away smiling.','Room 14 is quiet at last. A week later, a postcard arrives with no stamp. It says: <i>Arr. Thanks, Ma.</i>');
E('plank','Walk the Plank',()=>P.coast(),'Mabel has a plank. It goes out the window. Into a sea that definitely wasn’t there before.','You swim for days and wash up on a tiny island. You learn to fish. You learn to like it. You put up a sign: NO SHANTIES.');
E('shanty','Shanty Superstar',()=>P.room14(),'Your duet with Mabel is so good that ghosts come up through the floorboards to listen.','You go on tour around the afterlife’s pubs. You are huge among the dead. Your merchandise is mostly bones.');
X('mabelcrew','Crew trials','x',[q('Hah! Prove yerself,')+' says Mabel. '+q('Can ye tie a knot? Swab a deck? Insult someone in three languages? Steer?')],[
  ['Tie the most impressive knot you know','end_knot'],
  ['Admit, honestly, that you can’t do any of those things','end_cabincrew'],
  ['Grab the ship’s wheel and give it a spin','mabelsail']]);
SC.mabelcrew.pic=()=>P.room14();
X('mabelsail','Set sail','x',['You spin the wheel. The room tilts. The walls fall away like paper, and Room 14 is a ship, sailing through the clouds above the hotel.',q('Ha HA!')+' roars Mabel. '+q('Where to, sailor?')],[
  ['Steer toward the twinkling lights of a city on the horizon','end_portofcall'],
  ['Steer straight up, toward the stars','end_captain'],
  ['Steer back down and park neatly beside the hotel','lift',15]]);
SC.mabelsail.pic=()=>P.room14({sky:1});
E('knot','All Tied Up',()=>P.room14({sky:1}),'It is a very impressive knot. Unfortunately you have tied yourself to the mast with it.','The ship sets sail anyway. You’re the figurehead now. The views are incredible.');
E('cabincrew','Cabin Crew',()=>P.room14({sky:1}),'Mabel respects honesty. '+q('Galley duty. Ye start now.'),'You sail the night skies on a ghost ship for years. You learn forty knots, nine shanties, and one recipe, which is soup.');
E('portofcall','Port of Call',()=>P.coast(),'You dock in Amsterdam at dawn. The ghost crew go shopping for hats.','You stay, buy a canal boat, and turn it into a tiny hotel. It is the only hotel in the city where every room sways.');
E('captain','Captain of the Night Sky',()=>P.room14({sky:1}),'You sail so high that Mabel weeps with pride. She takes off her hat and puts it on your head.','You’re the captain now. Mabel retires to a hammock on the poop deck. You are terrible at shanties but brilliant at stars.');
X('mabelmap','The map','x',['The map shows the hotel grounds, drawn in brown ink with lots of little skulls for decoration. There is a big red X right under the garden fountain.',q('Me treasure!')+' says Mabel. '+q('Buried it in 1714. Can’t dig, see. Hands go straight through the shovel.')],[
  ['Take the map and go dig it up right now','end_treasure'],
  ['Sneak off and sell the map to the Moth Baron instead','end_mapsale'],
  ['Hand the map back and wish her luck','room14',5]]);
SC.mabelmap.pic=()=>P.room14();
E('treasure','X Marks the Spot',()=>P.room14({chest:1}),'You dig all night. Under the fountain is a chest of gold coins and, for some reason, Mabel’s wooden leg.','She is so happy to have the leg back that she lets you keep the gold. She hops off into the sunrise, shouting thank-yous.');
E('mapsale','Shrewd Dealer',()=>P.cards(),'The Baron pays you in moths. Moths are not a currency.','You open a moth-themed gift shop with them anyway. It does surprisingly well, mostly at night.');
E('parrot','Bone Idle Parrot',()=>P.room14(),'You repeat your name to the parrot skeleton four hundred times. It finally learns one word. Your name.','It says it forever, every few seconds. Mabel says it’s the parrot’s first friend in 300 years. You live on as its favourite perch.');

/* ---- gallery ---- */
X('gallery','The Portrait Gallery','x',['A long gallery of oil paintings in heavy gold frames. Every painted eye follows you.','One painting shows a sunny Italian seaside. One shows a grand dinner party where one chair is empty. Very empty. Very you-shaped. At the end of the hall hangs a frame with nothing in it at all.'],[
  ['Climb into the sunny seaside painting','gal_sea'],
  ['Climb into the dinner party and see who saved you a seat','gal_dinner'],
  ['Walk down to look closely at the empty frame','gal_empty'],
  ['Ask the portraits, politely, who painted them','gal_painter'],
  ['Back to the lift, feeling watched','lift',5]]);
SC.gallery.pic=()=>P.gallery();
X('gal_sea','Inside the painting','x',['You step through the frame. Warm sand, a lemon tree, a little boat with a striped sail. Everything has visible brushstrokes, including you.','The sea glitters. It smells of linseed oil and summer.'],[
  ['Go for a swim in the painted sea','end_wetpaint'],
  ['Pick and eat a lemon from the painted tree','end_lemon'],
  ['Take the little boat and sail it out past the edge of the frame','end_outframe'],
  ['Climb back out into the gallery','gallery',5]]);
SC.gal_sea.pic=()=>P.gallery();
E('wetpaint','Wet Paint',()=>P.gallery(),'You swim. The paint is still wet. You smear, beautifully, into the sea.','You are a lovely streak of blue now. Art critics write essays about you. “Note the bold brushwork in the lower left,” they say.');
E('lemon','Still Life',()=>P.gallery(),'The lemon is perfect. Sharp. Sunny. A little bit oily.','You become a lemon in a bowl by a painted window. It is serene. Visitors call you “luminous”.');
E('outframe','Out of the Frame',()=>P.coast(),'You sail off the edge of the canvas and into a real sea, off a real coast, in real sunshine.','You are still slightly oil-paint on one side, which makes you look permanently well-lit in photographs.');
X('gal_dinner','Dinner, 1740','x',['The dinner guests all turn as you climb in. '+q('You’re late!')+' says a woman in a powdered wig. They were painted in 1740 and they are very, very hungry.','In the middle of the table, a painted roast pig with an apple in its mouth winks at you.'],[
  ['Sit down in the empty chair and join the party','end_portraitguest'],
  ['Attempt the famous tablecloth trick','end_tablecloth'],
  ['Grab the pig and run for it','end_pig']]);
SC.gal_dinner.pic=()=>P.gallery();
E('portraitguest','Portrait of a Guest',()=>P.gallery(),'You sit. The paint settles around you. Your fork is forever halfway to your mouth.','You never eat. But the conversation is wonderful, and the wig lady tells the best stories in Europe.');
E('tablecloth','The Great Tablecloth Trick',()=>P.gallery(),'It works perfectly. Not a single glass falls.','The guests applaud for three hundred years. You are now the most famous figure in the painting. Tour guides point you out.');
E('pig','Pig Out',()=>P.meadow({sheep:1}),'You run out of the painting carrying the roast pig, which comes alive the moment it touches the real air.','You and the pig live on a little farm. It is called Gerald. It is vegetarian now, and very grateful.');
X('gal_empty','The empty frame','x',['The little brass label reads: <b>Self-Portrait of the Next Owner. Unfinished.</b>','A brush and a palette of wet paint lie on the floor, as if someone just put them down.'],[
  ['Pick up the brush and paint yourself into the frame','end_selfportrait'],
  ['Paint a door in the frame instead','gal_door'],
  ['Use the brush to give the next portrait along (it’s Pemberton) a moustache','end_vandal'],
  ['Leave the brush alone','gallery',5]]);
SC.gal_empty.pic=()=>P.gallery({brush:1});
X('gal_door','The painted door','x',['You paint a door. It’s wonky. The handle is on the wrong side. But when you touch it, it opens a crack, and warm air comes through.'],[
  ['Step through your door','end_painteddoor'],
  ['Paint another door, just in case, and then another','end_toomanydoors']]);
SC.gal_door.pic=()=>P.gallery({brush:1});
E('selfportrait','Self-Portrait',()=>P.gallery({brush:1}),'Your portrait is terrible. One eye is higher than the other. It comes to life anyway, climbs out, and goes off to do your job.','It is also terrible at your job. Nobody notices. You stay in the frame and enjoy the quiet.');
E('vandal','Vandal',()=>P.lobby(),'Pemberton notices. Pemberton notices everything. He chases you through nine floors.','You hide in a large vase in the lobby, so well that you become a vase. The moustache stays on the painting forever. Worth it.');
E('painteddoor','The Door You Painted',()=>P.meadow(),'Your door leads to exactly what you were imagining while you painted it: a little cottage by a lake, with smoke curling from the chimney.','You live there for the rest of your life. The paint never quite dries, and the ducks are slightly the wrong colour.');
E('toomanydoors','Too Many Doors',()=>P.gallery({brush:1}),'You paint a hundred doors. Each one leads to another gallery with another empty frame.','You are lost forever, painting doors. Your work is shown in several major museums, which you never get to visit.');
X('gal_painter','The painter','x',['The portraits whisper all at once. '+q('Agatha. The witch. She painted us so that she would never have to eat alone.'),'A small girl in a blue portrait adds: '+q('We’ve never seen the real sea. Only the painted one.')],[
  ['Ask them what they want, more than anything','end_galleryclosed'],
  ['Offer to sit for a portrait yourself, so they have a new friend','end_sitting']]);
SC.gal_painter.pic=()=>P.gallery();
E('galleryclosed','Gallery Closed',()=>P.coast(),'They want to see the sea. So, one by one, you carry every painting up to the roof as dawn comes.','They see the real sea, shining. They smile. The paint fades gently into light. You are left holding a stack of empty frames and feeling wonderful.');
E('sitting','Sitting for a Portrait',()=>P.gallery(),'You sit very still. A brush floats up on its own and paints you in quick, confident strokes.','You’re in the gallery now, third from the left. You look fantastic. The small girl in blue is your best friend.');

/* ---- conservatory ---- */
X('conserv','The Conservatory','x',['Floor 1½ is a glass conservatory packed with plants that are definitely awake. Orchids gossip in the corner. A Venus flytrap the size of a sofa is purring.','A sign on the door: <b>GARDENER WANTED. MUST BE EDIBLE-RESISTANT.</b>'],[
  ['Go and pet the giant purring flytrap','con_trap'],
  ['Lean in to listen to what the orchids are gossiping about','con_orchid'],
  ['Find the head gardener and apply for the job','con_job'],
  ['Eat one of the strange glowing fruits hanging from a vine','end_fruit'],
  ['Leave before anything decides you’re lunch','lift',5]]);
SC.conserv.pic=()=>P.conserv();
X('con_trap','The flytrap','x',['You reach out. The flytrap rolls over like a happy dog and shows you its belly. Or its teeth. With flytraps it’s hard to tell.'],[
  ['Scratch its belly','end_goodboy'],
  ['Offer it one of your shoes as a treat','end_snacktime'],
  ['Back away very, very slowly','conserv',5]]);
SC.con_trap.pic=()=>P.conserv();
E('goodboy','Good Boy',()=>P.conserv(),'The flytrap adopts you on the spot. Pemberton lets you take it home in the back of the car.','It eats your neighbour’s bins, two burglars (who are released, unharmed and very sorry), and all the wasps in the street. Best guard dog in town.');
E('snacktime','Snack Time',()=>P.conserv(),'It eats the shoe. Then, gently, it eats you.','Inside, it’s like a warm green hammock. You’re its favourite toy now. It carries you around everywhere and never chews.');
X('con_orchid','The orchids','x',[q('Have you heard?')+' whisper the orchids. '+q('Pemberton isn’t really a cat. The Moth Baron is in love with the chandelier. And YOU, darling, smell like a gardener.')],[
  ['Gossip back: tell them one tiny secret of your own','end_rumour'],
  ['Ask them what Pemberton really is','end_pembtruth'],
  ['Pick one orchid to wear as a buttonhole','end_buttonhole']]);
SC.con_orchid.pic=()=>P.conserv();
E('rumour','Rumour Has It',()=>P.conserv(),'You tell the orchids one tiny secret. By dawn the entire hotel knows it, and has improved it.','You are now the most interesting person in the building. They make you editor of the hotel newspaper, The Nightly Whisper.');
E('pembtruth','The Truth About Pemberton',()=>P.lobby(),'Pemberton, the orchids say, is three kittens standing on each other’s shoulders in a waistcoat.','You keep the secret. The kittens are so grateful they give you a suite for life. You visit every summer and bring yarn.');
E('buttonhole','Buttonhole',()=>P.conserv(),'You pin the orchid to your collar. It whispers compliments to you, quietly, all day long.','You walk out of the hotel with unshakeable confidence. You ask for a raise. You get it. You ask someone out. They say yes.');
X('con_job','The gardener','x',['The head gardener is a moss-covered man named Bramble who creaks when he moves. He hands you a watering can full of something that glows.',q('Water what needs watering,')+' he says. '+q('Mind the roses. They’re rude.')],[
  ['Water the sad little seedling in the corner','con_seedling'],
  ['Pour a little on your own head, just to see what happens','end_latebloomer'],
  ['Prune the rude roses','end_thorn']]);
SC.con_job.pic=()=>P.conserv();
X('con_seedling','The seedling','x',['The seedling drinks, and grows. And grows. Up past your knees, your head, the glass roof, which it pushes open with a gentle crack.','It is still growing.'],[
  ['Climb it, all the way up','end_longclimb'],
  ['Sit down in its shade and let it grow','end_forest']]);
SC.con_seedling.pic=()=>P.conserv({stalk:1});
E('fruit','Forbidden Fruit',()=>P.conserv(),'It tastes like a green apple that knows a secret. Suddenly you understand every plant in the room.','You become the world’s most famous botanist. Your hair is a bit leafy now, but it suits you.');
E('latebloomer','Late Bloomer',()=>P.conserv(),'You sprout. Leaves first, then blossom.','You are a cherry tree in the conservatory now. Every spring the guests have picnics under you. You enjoy the gossip.');
E('thorn','Thorn in the Side',()=>P.conserv(),'The roses fight back. You fight back harder. It becomes a feud.','Eventually you become friends. Together you win the Hotel Flower Show forty years running. Nobody else even enters any more.');
E('longclimb','The Long Climb',()=>P.coast(),'At the top of the stalk is a farm on a cloud. The farmer is kind and needs help.','You grow rain for a living. It’s honest work. Below you, the weather is noticeably better.');
E('forest','Forest Nocturne',()=>P.meadow({ghost:1}),'By morning the seedling is a forest that covers the whole hotel. The hotel can’t move on. It is stuck, happily, among the trees.','Everyone stays. Hotel Nocturne becomes a hikers’ lodge. Pemberton complains, but secretly loves the birds.');

/* ---- spa ---- */
X('spa','The Steam Baths','x',['B2 is a steam bath of green tiles and warm fog. Somewhere in the steam a deep voice says '+q('Ahhhh.'),'A menu on the wall offers three treatments: <b>MUD OF AGES · MASSAGE BY OCTOPUS · THE BATH OF FORGETTING</b>.'],[
  ['Book the Mud of Ages','spa_mud'],
  ['Book the Massage by Octopus','spa_octo'],
  ['Book the Bath of Forgetting','spa_forget'],

SC.spa.pic=()=>P.spa();
X('spa_mud','Mud of Ages','x',['The mud is warm and smells of riverbanks. As you sink into it, it speaks in a slow, friendly voice.',q('How old,')+' it asks, '+q('would you like to be?')],[
  ['“Ten. I want to be ten again.”','end_secondchildhood'],
  ['“Ninety, and very wise.”','end_wiseold'],
  ['“Exactly as old as I am, thank you.”','end_ageless']]);
SC.spa_mud.pic=()=>P.spa({mud:1});
E('secondchildhood','Second Childhood',()=>P.meadow(),'You climb out of the mud aged ten, with scabby knees and endless energy.','You borrow a bicycle and have the best summer of your life, again. Your grown-up worries don’t fit you any more, so you leave them in the spa.');
E('wiseold','Wise Old Soul',()=>P.spa(),'You climb out aged ninety and you know everything. It’s tiring.','You become the hotel’s oracle. Guests come to ask you about love, life, and lottery numbers. You only answer the first two.');
E('ageless','Ageless',()=>P.spa({mud:1}),'The mud is so moved by your contentment that it makes you stop ageing altogether.','It’s wonderful for a century. Then a bit odd. By the third century you have taken up every hobby in existence, twice.');
X('spa_octo','Massage by Octopus','x',['An octopus in a white coat cracks all eight sets of knuckles. '+q('Relax,')+' it says. '+q('I have done this for two hundred years.')],[
  ['Relax completely, as instructed','end_jelly'],
  ['Ask if it could also do a manicure while it’s at it','end_eighthands'],
  ['Tickle it back','end_inked']]);
SC.spa_octo.pic=()=>P.spa({octo:1});
E('jelly','Totally Relaxed',()=>P.spa(),'You relax so completely that you become a jellyfish.','You drift happily up to the rooftop pool and glow gently among the stars. Honestly? No complaints.');
E('eighthands','Eight Hands Are Better',()=>P.spa({octo:1}),'The octopus does your nails, your toes, your hair, your shoulders, and your taxes, all at once.','You are so impressed you go into business together. Your salon is booked up for the next eleven years.');
E('inked','Inked',()=>P.spa({octo:1}),'The octopus squeaks and inks you in surprise. It doesn’t wash off.','You are black-and-white forever, like an old film star. Very stylish. People keep asking for your autograph.');
X('spa_forget','The Bath of Forgetting','x',['The water is perfectly clear and perfectly still. A small brass sign says: <b>SOAK AWAY ONE MEMORY. ONE ONLY.</b>'],[
  ['Forget the swan incident, once and for all','end_cleanslate'],

  ['Forget this hotel ever existed','end_neverwas']]);
SC.spa_forget.pic=()=>P.spa();
E('cleanslate','Clean Slate',()=>P.spa(),'You forget it. Bliss.','Unfortunately, the swan did not forget. It finds you within the week. The feud continues, but now only one of you knows why.');
E('biscuit','Biscuit',()=>P.lobby(),'You forget your name. Pemberton names you Biscuit.','You love it. You live happily as Biscuit, assistant concierge, for many years. Guests say you have a lovely smile.');
E('neverwas','Never Was',()=>P.meadow({car:1,sheep:1}),'You wake up in your car at 6 AM with the rain stopping. The tow truck arrives.','You feel oddly, deeply happy all day, and you have a craving for cake you can’t explain.');

/* ---- laundry ---- */

  ['Offer to help fold the ghosts','l_fold'],
  ['Climb into the giant tumble dryer to warm up','l_dryer'],

  ['Go back to the lift','lift',5]]);
SC.laundry.pic=()=>P.laundry({sock:1});

  ['Get out the iron and press one','end_pressed']]);
SC.l_fold.pic=()=>P.laundry();
E('foldmaster','Fold Master',()=>P.laundry(),'You fold so well that Pemberton puts you in charge of the laundry.','Ghosts travel from other haunted hotels just to be folded by you. It is the most prestigious job in the afterlife.');
E('sheethappens','Sheet Happens',()=>P.laundry(),'You put on a sheet. Everyone mistakes you for a ghost, including the hotel.','At dawn you float off with the rest of the staff. You’re a ghost now, more or less. It suits you. You’re very good at going “Woo”.');
E('pressed','Pressed',()=>P.laundry(),'The ghost is so smooth and crisp afterwards that it nearly cries.','It haunts you lovingly for the rest of your life, keeping all your shirts ironed. Your colleagues think you have your life together.');
X('l_dryer','The tumble dryer','x',['Inside the drum it is warm and dark and smells of clean towels. It’s turning, very slowly, and somewhere in the back you feel a breeze.'],[
  ['Pull the door shut and enjoy the spin','end_spincycle'],

  ['Pour in some fabric softener, then get comfy','end_softtouch']]);
SC.l_dryer.pic=()=>P.laundry();
E('spincycle','Spin Cycle',()=>P.attic(),'You tumble for an hour. When the door opens, you are six inches tall.','You move into a dollhouse in the attic. It’s very cosy. The lost toys are excellent neighbours.');
E('lint','The Lint Dimension',()=>P.laundry(),'Behind the drum is a soft grey world of lint, hair ties and lost buttons.','The fluffy people there have been waiting for a ruler. They crown you with a hair tie. You rule fairly and sneeze a lot.');
E('softtouch','Soft Touch',()=>P.laundry(),'You come out impossibly soft. Like a cloud wearing a jumper.','Cats follow you everywhere for the rest of your life, Pemberton included. He pretends it is a coincidence.');
E('downdrain','Down the Drain',()=>P.coast(),'You follow the sock into the drain, through the pipes, and out into the sea.','You become a professional sock-rescuer for ships. It’s a niche job, but you are the best in the world at it.');
E('sockpuppet','Sock Puppet',()=>P.laundry({sock:1}),'You grab the sock. It wriggles onto your hand and says, '+q('Well, finally. Someone with ambition.'),'Your hand has opinions now. Together you become a famous comedy act. The sock gets top billing.');

/* ---- gift shop and telephone ---- */

  ['Pick up a snow globe and give it a good shake','s_globe'],
  ['Try on the cursed hat','s_hat'],
  ['Slip a postcard into your pocket when the mannequin isn’t looking','end_shoplifter'],

  ['Go back to the lift','lift',5]]);
SC.shop.pic=()=>P.shop();
X('s_globe','Inside the snow globe','x',['Snow swirls, and when it settles you’re inside the globe, standing in a tiny snowy town. Above you, the gift shop looms like a giant cathedral, wobbly through the glass.'],[
  ['Build a snowman, since you’re here','end_snowday'],
  ['Bang on the glass and shout for help','end_snowedin'],
  ['Walk into the tiny hotel in the middle of the tiny town','end_tinyhotel']]);
SC.s_globe.pic=()=>P.shop();
E('snowday','Snow Day',()=>P.shop(),'You build a snowman. It comes to life and is elected mayor of the globe by a landslide.','You’re his deputy. It’s Christmas forever. You never get tired of it, which surprises everyone, including you.');
E('snowedin','Snowed In',()=>P.shop(),'Nobody hears you. A little girl buys the globe the next day and puts it on her windowsill in Norway.','You watch her grow up, get a dog, become a pilot. Every winter she shakes you, gently, and says goodnight.');
E('tinyhotel','A Hotel Inside a Hotel',()=>P.shop(),'In the tiny hotel there is a tiny gift shop with tinier snow globes. You shake one. And another.','You keep going down. You’re the size of an atom now, mostly empty space, and still checking in.');
X('s_hat','The cursed hat','x',['It is a beautiful hat. Deep plum, with a ribbon. The label flutters: <i>Curse: wearer may only tell the truth.</i>'],[
  ['Wear it boldly and see what happens','end_hatcurse'],
  ['Buy it as a gift for Pemberton','end_pembhat']]);
SC.s_hat.pic=()=>P.shop({hat:1});
E('hatcurse','Honest Hat',()=>P.shop({hat:1}),'You can only tell the truth. You tell the mannequin its pose is a bit stiff. You tell Pemberton his waistcoat is magnificent.','Out in the world, you become the worst salesperson in history and the most trusted friend anyone has ever had.');
E('pembhat','A Gift for the Cat',()=>P.lobby(),'Pemberton opens the box. He goes very quiet. Nobody has given him a present in a hundred years.','He gives you Room 13 forever. The curse turns his whiskers pink. He is delighted. He wears the hat every Sunday.');
E('shoplifter','Shoplifter',()=>P.shop(),'The mannequin turns its head, very slowly, and looks at your pocket.','The next morning you are in the shop window, posed mid-step, holding the postcard. Your price tag says <b>NOT FOR SALE (definitely)</b>.');
X('phone','The telephone booth','x',['The telephone has no dial. Just a brass plate: <b>SPEAK YOUR DESTINATION</b>. The receiver is warm, as if someone just hung up.'],[
  ['Ask to be put through to yourself, aged twelve','ph_past'],
  ['Ask to be put through to yourself, forty years from now','ph_future'],
  ['Ask for the operator','ph_op'],
  ['Hang up and step out','shop',5]]);
SC.phone.pic=()=>P.shop();
X('ph_past','A call to the past','x',[q('Hello?')+' It’s you, aged twelve, sounding confused and a bit sticky.','You have one call. Twelve-year-old you is listening.'],[
  ['Read out next Saturday’s winning lottery numbers','end_jackpot'],
  ['Tell them everything is going to be okay','end_itgetsbetter'],
  ['Warn them never, ever to drive down Route 9','end_paradox']]);
SC.ph_past.pic=()=>P.shop();
E('jackpot','Jackpot (Past Tense)',()=>P.coast(),'Suddenly you are rich. You have always been rich. Your house is enormous and you have a boat called “Hello?”.','It’s very confusing. Your car never broke down, so you were never here. Somewhere, a cat in a waistcoat shrugs.');
E('itgetsbetter','It Gets Better',()=>P.meadow(),'Twelve-year-old you hangs up and is a little bit braver from then on.','The present wobbles. When it steadies, you’re home, and you’re the kind of person who takes the scenic route. It’s how you met everyone you love.');
E('paradox','Paradox',()=>P.shop(),'Twelve-year-old you never drives Route 9. So you never come here. So you never call. So you do come here.','You’re stuck in a loop at the phone booth, picking up the receiver forever. '+q('Hello?'));
X('ph_future','A call to the future','x',[q('Oh, it’s you,')+' says an older version of your voice. '+q('I’ve been waiting for this call. Listen carefully, I won’t say it twice.')],[
  ['Listen carefully','end_futureproof'],
  ['Interrupt to tell them about your evening','end_talkingover'],
  ['Ask, quietly, how it all ends','end_spoilersagain']]);
SC.ph_future.pic=()=>P.shop();
E('futureproof','Future Proof',()=>P.meadow(),q('Buy the yellow house. Learn the accordion. Say yes in March.'),'You do all three. It all works out, especially March.');
E('talkingover','Talking Over Yourself',()=>P.shop(),'You argue with yourself for an hour about whose evening was weirder. The line goes dead.','You never get the advice. A week later, an annoyed letter arrives in your own handwriting. It just says: <i>Honestly.</i>');
E('spoilersagain','Spoilers, Again',()=>P.meadow(),q('Peacefully, at a hundred and four, laughing at a joke about a swan.'),'You relax completely. Life is wonderful from then on, because you know exactly how it ends: laughing.');
X('ph_op','The operator','x',[q('Operator,')+' says a crackly, charming voice. '+q('Where to, caller? Anywhere you like. We go everywhere.')],[
  ['Ask for the North Pole','end_northpole'],
  ['Ask for “anywhere but here”','end_anywhere'],
  ['Ask the operator if they’re free for dinner','end_partyline']]);
SC.ph_op.pic=()=>P.shop();
E('northpole','Long Distance',()=>P.coast(),'You go down the line with a crackle and come out of a phone box at the North Pole. It is cold. A polar bear raises an eyebrow.','You stay and train reindeer. You’re a natural. The polar bear becomes your assistant.');
E('anywhere','Anywhere But Here',()=>P.coast(),'You come out of a phone on the wall of a submarine’s kitchen, a hundred metres under the Pacific.','The crew adopt you on the spot. You’re the cook now. Your soup is legendary.');
E('partyline','Party Line',()=>P.shop(),'The operator laughs, and says yes. You talk every night for a year.','On Valentine’s Day you finally meet in the phone booth. The operator is a phone. You run away together anyway. It’s a very happy marriage, with excellent reception.');

  ['Play aggressively, attack from the very first move','end_checkmate'],
  ['Pull a loose feather from a cushion and dangle it at the edge of the board','end_catdistracted'],

SC.chess.pic=()=>P.lobby();
E('checkmate','Checkmate',()=>P.lobby({cap:1}),'He beats you in four moves. You didn’t know you could lose that fast.','You’re the new night manager. Pemberton takes his first holiday in a century and sends you a photo from a beach in Majorca, in sunglasses.');
E('catdistracted','Cat Distracted',()=>P.lobby(),'Pemberton’s eyes follow the feather. His tail twitches. He leaps.','He chases it around the lobby for six hours. You walk out of the front door, free, and nobody stops you.');

/* ---- extra dawn choices ---- */
E('wardrobe','Wardrobe Malfunction',()=>P.room(),'You hide in the wardrobe in Room 13 between the forty grey dressing gowns.','When the hotel moves on, so do you. You are dressing gown number forty-one. You are fluffy, and you are needed.');
E('leap','Leap of Faith',()=>P.meadow(),'You climb onto the roof as the hotel lifts off like a hot-air balloon, and you jump.','You land in a haystack, perfectly. A farmer gives you tea. Above, the hotel waves its curtains and disappears into the pink sky.');
E('fasttrack','Fast Track',()=>P.lobby({cap:1}),q('Before you say anything,')+' you tell Pemberton, '+q('I’d like to apply for Assistant Manager.'),'He is so impressed that he hires you on the spot. In ten years you run the place. You introduce Taco Tuesdays. The ghosts love it.');

/* ===================== ENGINE ===================== */
function clock(t){const m=(23*60+t)%(24*60);let h=Math.floor(m/60),mm=m%60;const ap=h>=12?'PM':'AM';h=h%12||12;return `${h}:${String(mm).padStart(2,'0')} ${ap}`}
function loadFound(){try{return JSON.parse(localStorage.getItem('nocturne-endings')||'[]')}catch(e){return []}}
function saveFound(f){try{localStorage.setItem('nocturne-endings',JSON.stringify(f))}catch(e){}}
let found=loadFound(), pendingSay=null, view='game';
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];

function choose(c){
  arr(c.give).forEach(k=>{if(!S.items.includes(k)){S.items.push(k);S.newItem=k}});
  arr(c.take).forEach(k=>{S.items=S.items.filter(i=>i!==k)});
  arr(c.flag).forEach(f=>{if(!S.flags.includes(f))S.flags.push(f)});
  S.t+=c.cost||0;
  let to=typeof c.go==='function'?c.go():c.go;
  if(to==='cards_win'&&c.goGive&&!S.items.includes(c.goGive)){S.items.push(c.goGive);S.newItem=c.goGive}
  pendingSay=c.say||null;
  const inHotel=S.flags.includes('paid');
  if(inHotel&&S.t>=DAWN&&!to.startsWith('end_'))to='dawn';
  S.scene=to;
  render(true);
}
function render(scroll){
  view='game';
  const sc=SC[S.scene];
  const still=document.getElementById('still');
  still.innerHTML=sc.pic()+(sc.cap&&!sc.end?`<span class="caption">${sc.cap}</span>`:'');
  // bar
  const pct=Math.min(100,S.t/DAWN*100);
  const items=S.items.map(k=>`<span class="${k===S.newItem?'new':''}">${ITEMS[k]}</span>`).join('');
  document.getElementById('bar').innerHTML=`<span class="clock">${clock(S.t)}</span><div class="night" title="Time until dawn"><i style="left:${pct}%"></i></div><span>Dawn 4:00 AM</span><div class="pocket">${items||'<em>Pockets: empty</em>'}</div>`;
  S.newItem=null;
  const main=document.getElementById('main');
  if(sc.end){
    const isNew=!found.includes(sc.end);if(isNew){found.push(sc.end);saveFound(found)}
    const idx=ENDINGS.findIndex(e=>e[0]===sc.end);
    main.innerHTML=`<div class="story fade">${sc.text()}</div>
    <div class="ending fade"><span class="lbl">${isNew?'A new ending':'An ending you have seen before'} · ${found.length} found so far</span><h2>${ENDINGS[idx][1]}</h2></div>
    ${grid(sc.end)}
    <div class="choices" style="margin-top:14px"><button class="choice" id="again" type="button"><span class="tag">1</span><span class="t">Check in again</span></button></div>`;
    document.getElementById('again').onclick=restart;
  } else {
    const say=pendingSay?`<p class="aside">${pendingSay}</p>`:'';
    const cs=sc.choices().filter(Boolean);
    main.innerHTML=`<div class="story fade">${say}${sc.text()}</div><div class="choices">${cs.map((c,i)=>`<button class="choice" type="button" data-i="${i}"><span class="tag">${i+1}</span><span class="t">${c.l}</span>${c.cost&&S.flags.includes('paid')?`<span class="cost">${c.cost} min</span>`:''}</button>`).join('')}</div>`;
    main.querySelectorAll('.choice').forEach(b=>b.onclick=()=>choose(cs[+b.dataset.i]));
  }
  pendingSay=null;
  if(scroll){const top=still.getBoundingClientRect().top+window.scrollY-10;if(window.scrollY>top)window.scrollTo({top,behavior:'smooth'})}
}
function grid(cur){const f=found.filter(k=>ENDINGS.some(e=>e[0]===k));if(!f.length)return '';return `<div class="grid" style="margin-top:14px">${f.map((k,i)=>`<div class="${k===cur?'cur':''}"><b>No. ${String(i+1).padStart(2,'0')}</b>${ENDINGS.find(e=>e[0]===k)[1]}</div>`).join('')}<div class="lock"><b>&nbsp;</b>…and more</div></div>`}
function restart(){S=fresh();render(true)}
function showLedger(){
  if(view==='ledger'){render();return}
  view='ledger';
  document.getElementById('main').innerHTML=`<div class="ledger fade"><h3>Guest ledger</h3><p>You have found ${found.length} ending${found.length===1?'':'s'}. There are more. Every choice matters, the clock is always running, and dawn comes at four.</p>${grid()}
  <div class="choices"><button class="choice" type="button" id="back"><span class="tag">1</span><span class="t">Return to the story</span></button><button class="choice" type="button" id="wipe"><span class="tag">2</span><span class="t">Start a new stay from the road</span></button></div></div>`;
  document.getElementById('back').onclick=()=>render();
  document.getElementById('wipe').onclick=restart;
}
document.getElementById('ledgerBtn').onclick=showLedger;
document.addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey||e.altKey)return;const n=parseInt(e.key,10);if(!n)return;const b=document.querySelectorAll('#main .choice')[n-1];if(b){e.preventDefault();b.click()}});

function start(data){S=(data&&data.S&&SC[data.S.scene])?data.S:fresh();render()}
window.claude?.hot?.snapshot?.(()=>({S}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
