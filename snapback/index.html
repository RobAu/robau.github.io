<style>
/* Layout: one-screen app. Walnut desk around a cork board; HUD strip on top, handwritten hint below. */
:root {
  --desk: #2b1d14;
  --desk-2: #3a281b;
  --cream: #f6ead2;
  --muted: #c7b08c;
  --band: #e0782f;
  --gold: #f2c230;
  --danger: #d8423a;
  --note: #fbe98a;
  --note-ink: #4a3412;
  --display: "Bagel Fat One", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;

  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--desk);

  font-family: var(--hand);
  overflow: hidden;
  -webkit-user-select: none; user-select: none;
}
#app {
  height: 100%;
  display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px;
  box-sizing: border-box;
  gap: 8px;
}
header {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  max-width: 1100px; width: 100%; margin: 0 auto;
}
.brand { font-family: var(--display); font-size: 26px; color: var(--band); letter-spacing: .5px; line-height: 1; }
.lvl { font-family: var(--display); font-size: 18px; color: var(--cream); flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl small { color: var(--muted); font-size: 14px; margin-right: 6px; }
.stat { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--cream); display: flex; align-items: center; gap: 6px; }
#timer { width: 112px; justify-content: flex-end; white-space: nowrap; }
#goal { min-width: 150px; justify-content: flex-end; white-space: nowrap; }
header { min-height: 40px; }
.meter { width: 90px; height: 10px; border-radius: 6px; background: #00000055; overflow: hidden; border: 1px solid #ffffff22; }
.meter i { display: block; height: 100%; width: 30%; background: var(--band); transition: background .1s; }
button {
  font-family: var(--display); font-size: 15px; color: var(--note-ink);
  background: var(--note); border: 0; border-radius: 4px; padding: 7px 12px; cursor: pointer;
  box-shadow: 0 2px 0 #b9a24f, 0 3px 6px #0006;

button:active { transform: translateY(1px); box-shadow: 0 1px 0 #b9a24f; }
button:focus-visible { outline: 3px solid var(--band); outline-offset: 2px; }
#stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; position: relative; }
canvas { display: block; touch-action: none; border-radius: 10px; box-shadow: 0 14px 40px #000a; cursor: grab; }
canvas.dragging { cursor: grabbing; }
#hint {
  text-align: center; font-size: 22px; font-weight: 700; color: var(--note);
  min-height: 1.3em; max-width: 1000px; margin: 0 auto; line-height: 1.2;
  text-wrap: balance;
}
.overlay {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  background: #1a100acc; border-radius: 10px; z-index: 5;
}
.card {
  background: var(--note); color: var(--note-ink); padding: 22px 28px; border-radius: 4px;
  transform: rotate(-1.5deg); box-shadow: 0 10px 30px #000a; text-align: center; max-width: 90%;
}
.card h2 { font-family: var(--display); font-weight: 400; font-size: 34px; margin: 0 0 6px; color: var(--note-ink); text-wrap: balance; }
.card p { font-size: 22px; margin: 0 0 14px; }
.card .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
.card button { background: var(--band); color: #fff; box-shadow: 0 2px 0 #9a4a14, 0 3px 6px #0005; }
.card button.alt { background: #fff8; color: var(--note-ink); box-shadow: 0 2px 0 #0002; }
#menu { position: absolute; inset: 0; z-index: 10; overflow-y: auto; background: var(--desk); display: flex; flex-direction: column; align-items: center; padding-block: 10px 30px; }
#menu h1 { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 9vw, 84px); color: var(--band); margin: 6px 0 0; line-height: 1; text-shadow: 0 4px 0 #7a3a10; transform: rotate(-2deg); }
#menu .tag { font-size: 24px; color: var(--muted); margin: 10px 0 18px; text-align: center; }
#grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; width: 100%; max-width: 1000px; }
.note {
  background: var(--note); color: var(--note-ink); border-radius: 3px; padding: 10px 12px 12px; text-align: left;
  font-family: var(--hand); box-shadow: 0 6px 12px #0007; position: relative; min-height: 84px;
  display: flex; flex-direction: column; gap: 2px;

.note:nth-child(3n) { transform: rotate(1.2deg); background: #ffd59a; }

.note::before { content: ""; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--danger); box-shadow: inset -2px -2px 0 #0004, 0 2px 3px #0006; }

@media (prefers-reduced-motion: reduce) { .note, .card { transform: none !important; } }
@media (max-width: 640px) { .brand { display: none; } .meter { width: 60px; } #goal { min-width: 0; } #timer { width: 96px; } #hint { font-size: 18px; } }
</style>

// ---------- storage ----------

// ---------- audio ----------
let AC = null, muted = false;

function audio() {

function tone(f, dur, type = "sine", vol = 0.12, f2 = null, delay = 0) {

  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination); o.start(t0); o.stop(t0 + dur + 0.02);

function noise(dur, vol = 0.2) {
  const a = audio(); if (!a) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3);
  const s = a.createBufferSource(), g = a.createGain(); g.gain.value = vol;
  s.buffer = buf; s.connect(g).connect(a.destination); s.start();

const sfx = {
  star(k) { tone(620 + k * 70, 0.16, "triangle", 0.13, 1240 + k * 90); },
  snap() { noise(0.22, 0.35); tone(160, 0.3, "sawtooth", 0.12, 50); },
  twang(t) { tone(110 + t * 160, 0.35, "triangle", 0.08 * t, 70 + t * 80); },
  bounce(v) { tone(240 + v * 0.2, 0.08, "sine", Math.min(0.12, v / 6000)); },
  cup() { tone(523, 0.12, "triangle", 0.12); tone(784, 0.18, "triangle", 0.12, null, 0.1); },
  lost() { tone(300, 0.25, "sine", 0.08, 120); },
  win() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, "triangle", 0.12, null, i * 0.09)); },

// ---------- math ----------
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ---------- state ----------
let L = null, S = null, levelIdx = 0;

function loadLevel(i) {
  levelIdx = i; L = LEVELS[i];

    t: 0, status: "play", statusT: 0, pins,
    stars: (L.stars || []).map(s => Object.assign({ got: false, pop: 0 }, s)),
    spikes: (L.spikes || []).map(s => Object.assign({ cx: s.x, cy: s.y }, s)),
    walls: (L.walls || []).map(w => ({ x: w[0], y: w[1], w: w[2], h: w[3], door: w[4] === "door", open: 0 })),
    lasers: (L.lasers || []).map(l => Object.assign({ on: 1, off: 0, phase: 0, active: true }, l)),
    pads: (L.pads || []).map(p => ({ x: p[0], y: p[1], occ: false })),
    balls: (L.balls || []).map(b => ({ x: b[0], y: b[1], sx: b[0], sy: b[1], vx: 0, vy: 0, cup: -1, lostT: 0, spin: 0 })),
    cups: (L.cups || []).map(c => ({ x: c[0], y: c[1], w: c[2], h: c[3], full: false })),
    bumpers: (L.bumpers || []).map(b => ({ x: b[0], y: b[1], r: b[2], hit: 0 })),
    winds: (L.winds || []).map(w => ({ x: w[0], y: w[1], w: w[2], h: w[3], fx: w[4], fy: w[5] })),
    maxLen: L.maxLen, drag: null, particles: [], snapAt: null, msg: "", doorOpen: false, collected: 0,
  };
  updateSpikes(0); updateLasers(0);
  $("lvlName").innerHTML = `<small>${i + 1}</small>${L.name}`;
  $("hint").textContent = L.hint;

}
function resetLevel() { loadLevel(levelIdx); }

function updateSpikes(t) {

}
function updateLasers(t) { for (const l of S.lasers) { const st = laserState(l, t); l.active = st.active; l.warn = st.warn; } }
const activeWalls = () => S.walls.filter(w => !(w.door && S.doorOpen));

function resolvePin(p) {
  for (let k = 0; k < 3; k++) {
    for (const w of activeWalls()) {
      const c = circleRect(p.x, p.y, PIN_R, w.x, w.y, w.w, w.h);
      if (c) { p.x += c.nx * c.pen; p.y += c.ny * c.pen; }

}
function movePin(p, tx, ty, dt) {

function snap(reason, x, y) {
  if (S.status !== "play") return;
  S.status = "snap"; S.statusT = 0; S.msg = reason;
  const [A, B] = S.pins;
  S.snapAt = { x: x ?? (A.x + B.x) / 2, y: y ?? (A.y + B.y) / 2 };
  for (let i = 0; i < 26; i++) {
    const a = Math.random() * Math.PI * 2, v = 120 + Math.random() * 380;
    S.particles.push({ x: S.snapAt.x, y: S.snapAt.y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.7, c: i % 3 ? "#e0782f" : "#fff3c4" });
  }

}
function burst(x, y, color, n = 12) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 60 + Math.random() * 200;
    S.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.6, c: color });
  }
}

function step(dt) {
  if (S.status === "snap") { S.statusT += dt; if (S.statusT > 1.0) resetLevel(); stepParticles(dt); return; }
  if (S.status === "win") { S.statusT += dt; stepParticles(dt); stepBalls(dt, true); return; }
  S.t += dt;
  const t = S.t;
  updateSpikes(t); updateLasers(t);
  if (L.shrink) S.maxLen = Math.max(L.minLen || 60, L.maxLen - L.shrink * t);

  // pins
  const [A, B] = S.pins;
  for (const p of S.pins) { p.px = p.x; p.py = p.y; }
  const d = S.drag;
  if (d && d.kind === "pin") {
    const p = S.pins[d.i];
    movePin(p, d.x + d.ox, d.y + d.oy, dt);
    if (L.mirror) { const o = S.pins[1 - d.i]; movePin(o, W - (d.x + d.ox), d.y + d.oy, dt); }
    else { const o = S.pins[1 - d.i]; o.vx = o.vy = 0; }
  } else if (d && d.kind === "band") {
    movePin(A, d.x + d.oa.x, d.y + d.oa.y, dt);
    movePin(B, d.x + d.ob.x, d.y + d.ob.y, dt);
  } else { for (const p of S.pins) { p.vx = p.vy = 0; } }

  const len = Math.hypot(B.x - A.x, B.y - A.y);
  if (len > S.maxLen) { snap("Overstretched!"); return; }
  if (L.time && t > L.time) { snap("Out of time!"); return; }
  for (const s of S.spikes) {
    const q = segDist(s.x, s.y, A.x, A.y, B.x, B.y);
    if (q.d < s.r + 3) { snap("Popped on a tack!", q.cx, q.cy); return; }
  }
  for (const l of S.lasers) {
    if (!l.active) continue;
    const dd = segSegDist(A, B, { x: l.x1, y: l.y1 }, { x: l.x2, y: l.y2 });
    if (dd < 4) { snap("Zapped!", (A.x + B.x) / 2, (A.y + B.y) / 2); return; }
    for (const p of S.pins) if (segDist(p.x, p.y, l.x1, l.y1, l.x2, l.y2).d < PIN_R) { snap("Zapped!", p.x, p.y); return; }
  }

  // stars touched by the band
  const touched = new Set();
  S.stars.forEach((s, i) => { if (!s.got && segDist(s.x, s.y, A.x, A.y, B.x, B.y).d < STAR_R + 5) touched.add(i); });
  stepBalls(dt, false, touched);

  // doors

  // pads
  for (const pd of S.pads) pd.occ = S.pins.some(p => Math.hypot(p.x - pd.x, p.y - pd.y) < 20);

function nextOrder() {

}
function collectStars(touched) {

  for (const i of touched) {
    const s = S.stars[i];
    if (s.n != null && s.n !== no) continue;
    if (s.g != null) { (groups[s.g] = groups[s.g] || []).push(i); continue; }
    grab(i);
  }
  for (const g in groups) {
    const all = S.stars.map((s, i) => [s, i]).filter(([s]) => s.g == g && !s.got);
    if (all.every(([, i]) => touched.has(i))) all.forEach(([, i]) => grab(i));

}
function grab(i) {

}

function lose(b) { if (b.lostT > 0) return; burst(b.x, b.y, "#5fb3e8", 14); b.lostT = 0.6; b.vx = b.vy = 0; b.x = -100; b.y = -100; sfx.lost(); }

function win() {
  S.status = "win"; S.statusT = 0; endDrag(); sfx.win();
  const tm = S.t, prev = progress[levelIdx];
  const best = prev == null ? tm : Math.min(prev, tm);
  progress[levelIdx] = Math.round(best * 10) / 10; saveProgress();
  const last = levelIdx === LEVELS.length - 1;
  const lines = ["Nice stretch!", "Twang!", "Elastic!", "Smooth!", "Boing!", "Stretchy!"];
  $("winTitle").textContent = last ? "You beat Snapback!" : lines[levelIdx % lines.length];
  $("winText").textContent = `Cleared in ${tm.toFixed(1)}s` + (prev != null && tm < prev ? " (new best)" : prev != null ? ` (best ${best.toFixed(1)}s)` : "");
  $("btnNext").hidden = last;
  setTimeout(() => { if (S.status === "win") { winBox.hidden = false; (last ? $("btnLevels") : $("btnNext")).focus(); } }, 650);
  buildMenu();
}

// ---------- input ----------
function toBoard(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H };
}
function endDrag() {
  if (S && S.drag && S.status === "play") {
    const [A, B] = S.pins; const t = Math.hypot(B.x - A.x, B.y - A.y) / S.maxLen;
    if (t > 0.45) sfx.twang(t);
  }
  if (S) S.drag = null; canvas.classList.remove("dragging");
}
canvas.addEventListener("pointerdown", e => {
  audio();
  if (!S || S.status !== "play") return;
  const p = toBoard(e), [A, B] = S.pins;
  let best = -1, bd = 46;
  S.pins.forEach((pin, i) => { if (pin.fixed && !L.mirror) return; const d = Math.hypot(pin.x - p.x, pin.y - p.y); if (d < bd) { bd = d; best = i; } });
  if (best >= 0) {
    if (L.mirror) best = best; // either pin can lead
    S.drag = { kind: "pin", i: best, x: p.x, y: p.y, ox: S.pins[best].x - p.x, oy: S.pins[best].y - p.y };
  } else {
    const q = segDist(p.x, p.y, A.x, A.y, B.x, B.y);
    const canMid = !L.mirror && !S.pins.some(x => x.fixed);
    if (q.d < 34 && canMid) S.drag = { kind: "band", x: p.x, y: p.y, oa: { x: A.x - p.x, y: A.y - p.y }, ob: { x: B.x - p.x, y: B.y - p.y } };
    else if (q.d < 34 && !canMid) {
      // grab the nearest movable pin instead
      let i = S.pins.findIndex(x => !x.fixed); if (L.mirror) i = q.t < 0.5 ? 0 : 1;
      S.drag = { kind: "pin", i, x: p.x, y: p.y, ox: S.pins[i].x - p.x, oy: S.pins[i].y - p.y };
    }
  }
  if (S.drag) { canvas.setPointerCapture(e.pointerId); canvas.classList.add("dragging"); e.preventDefault(); }
});
canvas.addEventListener("pointermove", e => { if (S && S.drag) { const p = toBoard(e); S.drag.x = p.x; S.drag.y = p.y; } });
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", endDrag);
canvas.addEventListener("lostpointercapture", endDrag);

window.addEventListener("keydown", e => {
  if (e.key === "r" || e.key === "R") { if (menu.hidden) resetLevel(); }
  else if (e.key === "Escape") showMenu();
  else if ((e.key === "n" || e.key === "N" || e.key === "Enter") && S && S.status === "win" && !winBox.hidden && levelIdx < LEVELS.length - 1) { e.preventDefault(); start(levelIdx + 1); }
});

// ---------- ui ----------
function buildMenu() {
  grid.innerHTML = "";
  LEVELS.forEach((lv, i) => {
    const b = document.createElement("button");
    b.className = "note" + (progress[i] != null ? " done" : "");
    b.id = "lvl-" + (i + 1);
    b.innerHTML = `<span class="n">${i + 1}</span><span class="t">${lv.name}</span><span class="b">${progress[i] != null ? "best " + progress[i].toFixed(1) + "s" : "&nbsp;"}</span>`;
    b.addEventListener("click", () => { audio(); start(i); });
    grid.appendChild(b);
  });
}
function showMenu() { menu.hidden = false; winBox.hidden = true; if (S) endDrag(); }
function start(i) { menu.hidden = true; loadLevel(i); }

$("btnMenu").onclick = showMenu;
$("btnLevels").onclick = showMenu;
$("btnRestart").onclick = () => { if (menu.hidden) resetLevel(); };
$("btnReplay").onclick = () => resetLevel();
$("btnNext").onclick = () => start(Math.min(levelIdx + 1, LEVELS.length - 1));
function setMuteLabel() { $("btnMute").textContent = muted ? "♪̸ off" : "♪"; $("btnMute").style.opacity = muted ? 0.6 : 1; }
$("btnMute").onclick = () => { muted = !muted; try { localStorage.setItem("snapback-muted", muted ? "1" : "0"); } catch (e) {} setMuteLabel(); };
setMuteLabel();

function updateHud() {
  if (!S) return;
  const got = S.stars.filter(s => s.got).length, tot = S.stars.length;
  const parts = [];
  if (tot) parts.push(`★ ${got}/${tot}`);
  if (S.cups.length) parts.push(`● ${S.balls.filter(b => b.cup >= 0).length}/${S.balls.length}`);
  if (S.pads.length) parts.push(`◎ ${S.pads.filter(p => p.occ).length}/${S.pads.length}`);
